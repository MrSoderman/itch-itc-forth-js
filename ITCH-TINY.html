<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ITCH</title>
<style>
  /* one screen at a time: the source ( stopped, editing ) or the machine's display with its terminal ( running ) */
  :root { --fg: #4f4; --dim: #184a18; --bg: #000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; gap: 8px; height: 100vh; height: 100dvh; max-width: 1296px; margin: 0 auto; padding: 8px;
         font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 8px; }
  header b { letter-spacing: 3px; margin-right: auto; }
  button, select, input, textarea, pre { font: inherit; color: var(--fg); background: #000; border: 1px solid var(--dim); border-radius: 3px; }
  button { padding: 4px 12px; min-height: 32px; cursor: pointer; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  body[data-view="source"] #screen, body[data-view="screen"] #source, body[data-view="screen"] #demo { display: none; }

  /* the monitor: the chip's 320×200 picture, scaled by the GPU without smoothing, at most ×4, always fits;
     the scanlines are a CSS overlay that darkens the last quarter of every chip row */
  #monitor { position: relative; flex: none; margin: 0 auto; aspect-ratio: 16 / 10;
             width: min(100%, 1280px, calc((100vh - 190px) * 1.6)); width: min(100%, 1280px, calc((100dvh - 190px) * 1.6)); }
  #monitor:focus { outline: 1px solid var(--dim); outline-offset: 2px; }
  #monitor { touch-action: none; }                     /* fingers on the screen paint, they don't scroll or zoom */
  #display { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #monitor::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                    background: linear-gradient(to bottom, transparent 75%, rgba(0,0,0,.42) 75%); background-size: 100% calc(100% / 200); }

  pre { flex: 1; min-height: 4em; margin: 0; padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; border: 0; }
  #promptline { position: relative; display: flex; }
  #prompt { flex: 1; font-size: 16px; padding: 6px 8px; border: 0; border-top: 1px solid var(--dim); border-radius: 0; outline: none; }   /* 16px: phones don't zoom */
  /* the cursor: the browser's caret ( ORG ), or a solid block that blinks ( SQUARE ), drawn in inverse video over the
     character under it; the terminal script sets data-cursor and moves the block to the caret */
  #cursor { position: absolute; top: 7px; height: 1.45em; width: 1ch; font-size: 16px; display: none; pointer-events: none;
            background: var(--fg); mix-blend-mode: difference; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  body[data-cursor="SQUARE"] #prompt { caret-color: transparent; }
  body[data-cursor="SQUARE"] #promptline:focus-within #cursor { display: block; }
  /* the source wraps its long lines: only a vertical scrollbar */
  #program { flex: 1; min-height: 0; padding: 8px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere;
             overflow-x: hidden; overflow-y: auto; resize: none; }
  select { padding: 4px; min-height: 32px; }
  @media (max-width: 700px) { #program { font-size: 12px; } }
</style>
</head>
<body data-view="source" data-state="idle" data-cursor="ORG">
<header><b>ITCH</b><select id="demo" title="put a demo in the source"><option value="demo-balloons">balloons</option><option value="demo-steer">steer</option><option value="demo-logo">logo</option><option value="demo-clock">clock</option><option value="demo-paint">paint</option><option value="demo-piano">piano</option><option value="demo-tour">tour</option><option value="demo-cut">cut the cord</option></select><button id="run">RUN</button></header>
<section id="screen" class="view">
  <div id="monitor" tabindex="0" title="click, then type: keys go to the keyboard chip"><canvas id="display" width="320" height="200"></canvas></div>
  <pre id="terminal"></pre>
  <div id="promptline"><input id="prompt" placeholder="&gt; Forth" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"><span id="cursor"></span></div>
</section>

  <textarea id="program" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
</section>

<!-- ═══════════════════════════════════════════════════════════════════════════════════════════════
  ITCH — an indirect-threaded Forth on a 64K byte bus, in the style of 1985.

  THE FILE, TOP TO BOTTOM
    the machine (JavaScript)
      1   KERNEL       the Forth CPU: RAM, stacks, NEXT, the primitives, a seed interpreter.
                       It knows nothing about devices: each one is a chip on the bus.
      1a  TERMINAL     characters out: a ring on the bus that EMIT fills and the page empties
      1b  VIDEO CHIP   a device plugged into the bus: its own screen memory, CLS PLOT POINT SPLOT,
                       8 hardware sprites, and a 60 Hz VBL interrupt
      1c  KEYBOARD     a device that writes keys onto the bus: a 256-key ring and the held keys
      1d  CLOCK        the time of day in registers, set from the computer's clock every frame
      1e  POINTER      the mouse and up to four fingers: X Y DOWN, in screen pixels
      1f  SOUND        four voices (square, saw, triangle, sine, noise, 8-bit samples from RAM)
      1g  UART         a serial port, bytes only: the cord to a second, TARGET machine
      1h  MONITOR      the target's ROM: W R X G over its UART, EOT to come back (the page never runs it)
    the system (Forth, read at power-on, in this order)
      2   BOOT         the language, written in itself: headers, the compiler, control flow, CASE,
                       strings, WORD, FIND, NUMBER?, INTERPRET, QUIT, ABORT, MARKER ANEW
      2b  NUMBERS      HEX DECIMAL U. .                     (optional module)
      2c  TOOLS        SEE, the decompiler                  (optional module, needs NUMBERS)
      2d  GRAPHICS     sprites, LINE, the pointer, VBL      (optional module, needs the video chip)
      2e  MOTORS       background workers run every frame   (optional module, needs GRAPHICS)
      2f  TIME         TIME&DATE MS EVERY LATER ALARM       (optional module, needs MOTORS and the clock)
      2g  SOUND        VOICE TONE QUIET PLAY                (optional module, needs the sound chip)
      2h  META         Forth running Forth: META, TRACE     (optional module, needs TOOLS)
      2i  SERIAL       the UART from Forth: SEND RECV RX-ACCEPT, and SERVE: a QUIT on the UART
      2j  TETHER       the target over the cord: T! T@ TMOVE TCALL, and TARGET : … ; compiled there;
                       CUT TERM TETHER ( optional, needs NUMBERS and SERIAL )
    programs (Forth, not part of the system)
      4   DEMOS        balloons, steer, logo, clock, paint, piano, a tour of the language, and cutting the cord:
                       this system metacompiled into the target, which then serves its own Forth
    the page (JavaScript)
      3   TERMINAL     a log, a prompt, and a monitor on the video chip (×4, scanlines) that calls its
                       VBL on every screen refresh. To look inside the machine, ask Forth: .S SEE WORDS
                       One button: the source is stopped ( RUN ), the screen is running ( STOP ); the demo
                       menu beside it. CURSOR picks the prompt's cursor ( "ORG" or "SQUARE" ); PAGE clears it.
                       It also runs the TARGET: a Web Worker made from blocks 1, 1g and 1h of this file,
                       joined to our UART by a wire that moves bytes once a frame.

  HOW A LINE YOU TYPE IS RUN
    terminal → your text into RAM at $8000 → QUIT → REFILL frames one line → INTERPRET:
    WORD reads a name; the context stack's top frame lists (recognizer, action) pairs, and the
    first recognizer that knows the name hands it to its action. Interpreting: COMMON words run,
    FORTH words run, "strings" and numbers are pushed. Compiling: COMMON and COMPILER words run, FORTH
    words are compiled with , and strings and numbers become literals. A word's header never says how it acts: the
    wordlist it lives in does (IMMEDIATE moves a word into COMPILER, ALWAYS into COMMON).
    All of this is Forth in BOOT; the kernel supplies only NEXT and the primitives underneath
    (and a seed interpreter, with the same frames built in, that reads BOOT at power-on).

  THE FOUR STACKS: a 2×2, one stack per question in each domain
                     being built / worked on          navigating what already exists
    execution        DATA: values                     RETURN: where we are in running threads
    compilation      COMPILE: what is being built,    CONTEXT: how to treat tokens now
                     where, and the IF/BEGIN holes    (interpreting, compiling, compiling DOES>)
    A definition opens a frame on both compilation stacks and ; closes both. There is no STATE.

  WHAT A WORD LOOKS LIKE IN RAM (its xt is the address of its header)
    PARENT(2) | LINK(2) LEN(1) NAME(len) KIND(1) body…      ( LINK: the previous word in its wordlist )
    PARENT sits just before the xt: the word that made this one (0 = the machine itself). So every
    word knows its lineage: X made by C, made by P, made by G … like parent slots in Self.
    The parent is fixed when CREATE is compiled (the word being compiled, or SELF after DOES>), so
    making a word costs nothing extra. While DOES> code runs, SELF ($2A) holds its word, so DOES>
    code that makes words makes children.
    Words: PARENT SELF IS-A? CLONE (BOOT), CHILDREN and SEE's "made by C <- P <- G" (TOOLS).
    KIND 0 CODE      body = 1 byte: which primitive (native #)
    KIND 1 COLON     body = a thread: xt xt xt … EXIT   (LIT n and BRANCH a carry an inline cell)
    KIND 2 CREATED   body = ACTION(2) data…             (ACTION = address of DOES> code, or 0)
  So there are only two ways to run a Forth word: DOCOL enters a thread, DODOES pushes a data
  address and enters its DOES> code. Every data word runs through DODOES: VARIABLE, CONSTANT,
  DEFER and your own defining words alike.

  MAKING IT FASTER: a Forth word can become a primitive — see "HOW TO" at the primitive table.
════════════════════════════════════════════════════════════════════════════════════════════════ -->

<!-- ═══ 1 · KERNEL: a 16-bit machine and the smallest Forth that can build the rest ═══════════ -->
<script id="vm-kernel">
"use strict";
// The kernel is plain procedures over one block of RAM: no objects, no classes. Each part maps
// onto a real CPU: byte/cell are loads and stores, push/pop move a stack pointer that lives in RAM,
// NEXT is the ~10-instruction inner loop, and each prim(...) line is one code routine.
// Lines marked HOST are where JavaScript meets the outside world (text in, characters out); on a
// real machine that is the terminal driver.
//
// PORTING TO C OR ASSEMBLY — what each JavaScript piece stands for:
//   M, V            the 64K RAM: uint8_t ram[65536]; cells are 16-bit little-endian (a 6502's order)
//   registers       the first 64 bytes of RAM (zero page on a 6502): SP RP IP CSP CXP CFP … all live there
//   cell setCell    16-bit load and store; & 0xFFFF is what a 16-bit register does by itself
//   prim(name, fn)  one machine-code routine; natives[] is the jump table a CODE word's byte indexes
//   NEXT EXECUTE    the inner interpreter: a few instructions (fetch the xt at IP, step IP, dispatch on KIND)
//   throw n         trap n: C longjmp()s to the trap handler, assembly BRKs to its vector. Nothing is made:
//                   the handler points MSG at message n in the ROM table ($EC00) for Forth to read
//   try … finally   the trap handler restoring what it must ( run() puts back the WAIT flag )
//   HOST lines      where the page meets the machine ( text in; the tests ). Characters out go through the
//                   terminal chip's ring on the bus, as on any machine
//   devices         memory-mapped chips: each one's registers are RAM cells at fixed addresses ($F000…)

// ── memory map: one 64K bus holds everything ─────────────────────────────────────────────────────
//   Registers: 16-bit cells in the first 64 bytes.
//     $02 CSP     compile stack depth (bytes)        $14 SPACE   where new definitions are built ( 0 here; BOOT's )
//     $04 >IN     how far into the source            $16 KEND    where the kernel's own words end ( the devices' come after )
//     $06 #TIB    length of the source               $18 SRC     address of the source text
//     $08 LATEST  newest header                      $1A MSG     error message (counted), 0 = none
//     $0A HERE    next free dictionary byte (DP)     $1C LINE    source line number
//     $0C SP      data stack depth (bytes)           $1E TXT     next line of the loaded text
//     $0E RP      return stack depth (bytes)         $20 TXTEND  end of the loaded text
//     $10 BASE    number base                        $22 STOP    halt register: non-zero stops NEXT
//     $12 IP      instruction pointer                $24…$28     devices and modules ($24 FRAMES, $28 VBL vector: video chip; $26 ME: motors)
//                                                    $2A SELF    the data word whose DOES> code is running (0 = none)
//                                                    $2C CXP     context stack depth (bytes; its bottom frame never goes)
//                                                    $2E CFP     compile stack: where the open definition's frame ends (0 = none)
//                                                    $30 COMMON  $32 COMPILER  $34 FORTH   the three wordlists' newest headers
//                                                    $36 CURRENT the wordlist new words go into (the address of its head)
//                                                    $38 QUIT-VECTOR  $3A ABORT-VECTOR  the system's entry points: BOOT sets
//                                                        them, as a 6502's reset vector sits at $FFFC ( 0: no system yet )
//   Areas:
//     $0040 TIB (1K)  $0440 PAD  $04C0 data stack  $05C0 return stack  $06C0 compile stack
//     $07C0 context stack  $0800 dictionary …  $8000 loaded text …  $EC00 ROM: the trap messages
//     $EF00 a message made at run time ( Forth's UNKNOWN )
//   Devices: each chip's registers, on the bus above the error message ( its header says more ):
//     $F000  8 sprites x  X Y PATTERN ON               video chip     ( + $24 FRAMES )
//     $F040  HEAD TAIL of the key ring                 keyboard chip
//     $F048  4 points x  X Y DOWN                      pointer chip
//     $F060  SEC MIN HOUR DAY MONTH, $F066 YEAR        clock chip
//     $F080  held keys, a byte per key code 0-127      keyboard chip
//     $F100  the key ring, 256 bytes                   keyboard chip
//     $F200  4 voices x  FREQ VOL WAVE ADDR LEN        sound chip
//     $F600  OUT-HEAD OUT-TAIL, $F700 the ring         terminal chip ( characters out: EMIT )
//     $F300  TX-HEAD TX-TAIL RX-HEAD RX-TAIL           UART ( the cord to a target machine )
//     $F400  TX ring, $F500 RX ring, 256 bytes each    UART
//   Forth names them with small words: KEY-HEAD SPRITES POINTERS SECONDS VOICES …
//     $F000…$FFFF  I/O: devices' registers (the video chip: sprite registers at $F000)
const CSP = 2, IN = 4, KEND = 22, QUIT_VEC = 56, ABORT_VEC = 58, NTIB = 6, LATEST = 8, HERE = 10, SP = 12, RP = 14, BASE = 16, IP = 18, SRC = 24, MSG = 26, LINE = 28, TXT = 30, TXTEND = 32, STOP = 34, SELF = 42, CXP = 44, CFP = 46, CURRENT = 54;
const TIB = 0x40, PAD = 0x440, DS = 0x4C0, RS = 0x5C0, CS = 0x6C0, CX = 0x7C0, DICT = 0x800, TEXT = 0x8000, ROM = 0xEC00, ERRBUF = 0xEF00, MAX_STEPS = 2000000;
let M, V, natives, steps, maxDepth;        // RAM as bytes (M) and as cells (V); the code table; counters
const DEVICES = [];                        // devices' power-on routines: each adds its I/O primitives (see the video chip)
const ON_FRAME = [];                       // the frame interrupt's work outside the CPU ( the terminal empties its ring ):
                                           //  each returns true if it gave a sleeping CPU something to wake for
let LIT_XT, EXIT_XT;                       // xts the kernel compiles itself: labels, kept as prim() lays them down
const report = msg => new Error(msg);      // HOST: an error as text, for the page ( never raised by the machine itself )

// ── traps: numbered, their messages in ROM ───────────────────────────────────────────────────────
//   A primitive that cannot go on raises trap n: throw n ( C: longjmp; a 6502: BRK, then its trap
//   vector ). No text is made: the handler, trap(n), points MSG at message n, a counted string in the
//   ROM table at $EC00: first a cell per trap ( its message's address ), then the messages themselves.
//   Power-on writes the table there, as a real machine's ROM would already hold it.
const T_DS_OVER = 0, T_DS_UNDER = 1, T_RS_OVER = 2, T_RS_UNDER = 3, T_CS_OVER = 4, T_MISMATCH = 5,
      T_CX_OVER = 6, T_CX_UNDER = 7, T_NESTED = 8, T_DICT_FULL = 9, T_SEMI_OUTSIDE = 10, T_SEMI_OPEN = 11,
      T_SEMI_SPACE = 12, T_NOT_FOUND = 13, T_NO_WAKE = 14, T_RUNAWAY = 15, T_BREAK = 16, T_UMMOD = 17,
      T_NO_BRACKET = 18, T_UNKNOWN = 19, T_MSG = -1;        // T_MSG: MSG already holds it ( Forth's ERROR )
const TRAP_TEXTS = [                     // HOST: what the ROM holds, in trap order ( written into it at power-on )
  "DATA STACK OVERFLOW", "DATA STACK UNDERFLOW", "RETURN STACK OVERFLOW", "RETURN STACK UNDERFLOW",
  "COMPILE STACK OVERFLOW", "CONTROL STRUCTURE MISMATCH", "CONTEXT STACK OVERFLOW", "CONTEXT STACK UNDERFLOW",
  "a nested word is built where the word around it is", "DICTIONARY FULL", "; outside colon definition",
  "; with an unclosed IF, BEGIN or CASE", "; of another space: that space has its own", "' word not found",
  "WAIT: nothing to wake it", "MAX STEPS EXCEEDED (runaway loop?)", "BREAK", "UM/MOD OVERFLOW", "] without [",
  "UNKNOWN WORD"];
function burnRom() {                     // power-on: the trap table at ROM
  let a = ROM + 2 * TRAP_TEXTS.length;
  for (let n = 0; n < TRAP_TEXTS.length; n++) {
    const t = TRAP_TEXTS[n];
    setCell(ROM + 2 * n, a); setByte(a, t.length);
    for (let i = 0; i < t.length; i++) setByte(a + 1 + i, t.charCodeAt(i));
    a += 1 + t.length;
  }
}
function trap(n) {                       // the trap handler: MSG := message n; stacks and IP stay as they were at the fault
  if (typeof n !== "number") throw n;    // HOST: a fault of the simulator itself, not of the machine: let it show
  if (n >= 0) setCell(MSG, cell(ROM + 2 * n));
}

// ── bus: bytes, and 16-bit little-endian cells that wrap at 64K ──────────────────────────────────
const byte    = a => M[a & 0xFFFF];
const setByte = (a, v) => { M[a & 0xFFFF] = v; };
const cell    = a => (a &= 0xFFFF) < 0xFFFF ? V.getUint16(a, true) : M[a] | M[0] << 8;   // $FFFF: low byte there, high byte at $0000
const setCell = (a, v) => { (a &= 0xFFFF) < 0xFFFF ? V.setUint16(a, v & 0xFFFF, true) : (M[a] = v, M[0] = v >> 8); };
const signed  = a => cell(a) << 16 >> 16;  // the cell as -32768..32767

// ── byte rings: how a device and Forth pass bytes ( the keys, the UART, the terminal ) ────────────
//   Two byte registers, HEAD at regs and TAIL at regs + 1, and 256 bytes at ring. The writer puts at TAIL
//   and steps it, the reader takes at HEAD and steps it: HEAD = TAIL is empty, TAIL one behind HEAD is full.
//   Bytes wrap by themselves ( 255 + 1 is 0 ). Forth's side is in Forth ( KEY SEND RECV EMIT ); these are
//   the device's side, as its hardware would do it.
function ringPut(regs, ring, c) {         // the device puts c at TAIL → false if the ring is full
  const t = byte(regs + 1);
  if (((t + 1) & 255) === byte(regs)) return false;
  setByte(ring + t, c); setByte(regs + 1, t + 1); return true;
}
function ringTake(regs, ring, into) {     // the device takes every byte waiting, into its own buffer → how many
  const h = byte(regs), n = (byte(regs + 1) - h) & 255;
  for (let i = 0; i < n; i++) into[i] = byte(ring + ((h + i) & 255));
  setByte(regs, h + n); return n;
}
const ringFree = regs => 255 - ((byte(regs + 1) - byte(regs)) & 255);   // room left for the writer

// ── registers: the only doors into kernel state ──────────────────────────────────────────────────
const getHere   = () => cell(HERE);    const setHere   = v => setCell(HERE, v);
const getLatest = () => cell(LATEST);  const setLatest = v => setCell(LATEST, v);
const getIP     = () => cell(IP);      const setIP     = v => setCell(IP, v);
const getIn     = () => cell(IN);      const setIn     = v => setCell(IN, v);

// ── stacks: 128 cells each, in RAM; SP and RP count bytes from the bottom ────────────────────────
const push  = v => { const p = cell(SP); if (p >= 256) throw T_DS_OVER; setCell(DS + p, v); setCell(SP, p + 2); };
const pop   = () => { const p = cell(SP) - 2; if (p < 0) throw T_DS_UNDER; setCell(SP, p); return signed(DS + p); };
const rpush = v => { const p = cell(RP); if (p >= 256) throw T_RS_OVER; setCell(RS + p, v); setCell(RP, p + 2); maxDepth = Math.max(maxDepth, p / 2 + 1); };
const rpop  = () => { const p = cell(RP) - 2; if (p < 0) throw T_RS_UNDER; setCell(RP, p); return cell(RS + p); };

// ── the two compilation stacks: compile ( what is being built ) and context ( how to treat tokens ) ──
//   Together with the data and return stacks they make the 2×2: each domain has one stack for what is
//   being made and one for where we are in what already exists (see the design note).
//   COMPILE STACK ($06C0, 256 bytes, depth CSP). A definition's frame is 4 cells: [outer frame end]
//   [space][xt][hole]. CFP marks where the open frame ends, like a CPU's frame pointer; hole ≠ 0 means
//   an enclosing word jumps over this one (nested definitions). space is where the word is built:
//   0 this machine's RAM, else the address of a SPACE TABLE (see the vectored primitives below). Above the frame sit the control-flow
//   addresses IF and BEGIN leave (>C C>): they can never reach into the frame, and ; refuses to close
//   a frame with any left.
//   CONTEXT STACK ($07C0, 64 bytes, depth CXP). One cell per frame: the mode. Its bottom frame is the
//   outer interpreter's (INTERPRETING) and never goes. [ pushes INTERPRETING, ] pops it.
//   One rule ties them: a definition opens a frame on BOTH stacks, and ; closes both.
const INTERPRETING = 0, COMPILING = 1;   // modes ( BOOT's DOES> uses 2: compiling DOES> code )
const cPush     = v => { const p = cell(CSP); if (p >= 256) throw T_CS_OVER; setCell(CS + p, v); setCell(CSP, p + 2); };
const cPop      = () => { const p = cell(CSP) - 2; if (p < cell(CFP)) throw T_MISMATCH; setCell(CSP, p); return cell(CS + p); };
const mode      = () => cell(CX + cell(CXP) - 2);
const compiling = () => mode() !== INTERPRETING;
const cxPush    = m => { const p = cell(CXP); if (p >= 64) throw T_CX_OVER; setCell(CX + p, m); setCell(CXP, p + 2); };
const cxPop     = () => { const p = cell(CXP) - 2; if (p < 2) throw T_CX_UNDER; setCell(CXP, p); };
const anyOpen   = () => cell(CFP) !== 0;
const csDepth   = () => { let n = 0; for (let f = cell(CFP); f; f = cell(CS + f - 8)) n++; return n; };   // open definitions
const frameSpace = () => anyOpen() ? cell(CS + cell(CFP) - 6) : 0;   // where the open definition is built ( 0: here )
function openFrame(space, xt, hole) {    // a definition begins: a frame on the compile stack, COMPILING on the context stack
  if (anyOpen() && frameSpace() !== space) throw T_NESTED;
  cPush(cell(CFP)); cPush(space); cPush(xt); cPush(hole); setCell(CFP, cell(CSP)); cxPush(COMPILING);
}

// ── dictionary: headers in RAM, in three wordlists (header layout: see the file overview) ───────
//   A wordlist is a chain of headers, newest first, whose head sits in a register:
//     $30 COMMON    words that act the same in every mode:  \ ( .( : :NONAME CREATE S" ." IS
//     $32 COMPILER  words that act while compiling: IF THEN ; [ ['] DOES> POSTPONE …
//     $34 FORTH     every other word
//   CURRENT holds the address of the head new words go into (FORTH's). IMMEDIATE and ALWAYS move the
//   newest word into COMPILER or COMMON: no bit in any header says how a word acts, the wordlist it is
//   found in does ( see the context frames in BOOT ).
const CODE = 0, COLON = 1, CREATED = 2;
const COMMON_WL = 48, COMPILER_WL = 50, FORTH_WL = 52;
const WORDLISTS = [COMMON_WL, COMPILER_WL, FORTH_WL];                 // the order a name is looked up in
const nameLen     = x => byte(x + 2) & 127;                          // ( bit 7 of the length byte is free )
const CFA         = x => x + 3 + nameLen(x);                          // >CFA: the KIND byte
const kindOf      = x => byte(CFA(x));
const body        = x => CFA(x) + 1;
const PFA         = x => body(x) + (kindOf(x) === CREATED ? 2 : 0);   // >BODY
const nameOf      = x => String.fromCharCode(...M.subarray(x + 3, x + 3 + nameLen(x)));   // HOST: a name as text
const inList      = (wl, a) => { for (let x = cell(wl); x; x = cell(x)) if (x === a) return true; return false; };
const isHeader    = a => inList(COMMON_WL, a) || inList(COMPILER_WL, a) || inList(FORTH_WL, a);

  Its registers (on the bus):
    $F600  OUT-HEAD  where the chip takes the next character   ( the chip steps it )
    $F601  OUT-TAIL  where EMIT puts the next character          ( EMIT steps it )
    $F700  the ring, 256 characters                              ( HEAD = TAIL: empty )
  The page's terminal takes them every frame ( and whenever a WAIT gives it a frame ): ttyTake() copies them
  into the chip's own 256-byte buffer, OUT_BUF, and says how many.
  A target has the same chip; its driver sends what it takes up the cord.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="terminal-chip">
"use strict";
const OUT_HEAD = 0xF600, OUT_RING = 0xF700;
const OUT_BUF = new Uint8Array(256);                   // the chip's side: where it takes the characters to
const ttyTake = () => ringTake(OUT_HEAD, OUT_RING, OUT_BUF);   // every character waiting → how many ( in OUT_BUF )
if (typeof module !== "undefined") Object.assign(module.exports, { ttyTake, OUT_BUF });   // HOST: for the tests
</script>

<!-- ═══ 1b · VIDEO CHIP: a device on the bus, like an MSX VDP or the C64's VIC-II ═════════════════
  The Forth machine knows nothing about graphics. This chip plugs into it the way hardware does:
  it adds I/O primitives at power-on (the kernel's DEVICES list), keeps its own memory OFF the 64K
  bus, reads a few registers ON the bus, and raises an interrupt once per frame.

  Its memory (not on the bus):
    a 320×200 screen and 8 sprite patterns of 64×64, one 12-bit colour $RGB per pixel:
    one hex digit per channel, $F80 is orange ( shown as FF8800 ). In a pattern, 0 is transparent.
  Its registers (on the bus, so Forth reads and writes them with @ and !):
    $24          FRAMES  frames shown so far
    $28          the VBL vector: the xt the interrupt runs (0 = none)
    $F000 + 8n   sprite n: X  Y  PATTERN  ON   (4 cells; X and Y may be off screen)
  Its primitives:
    CLS    ( -- )                clear the screen to black
    PLOT   ( x y rgb -- )        set a pixel;  POINT ( x y -- rgb ) read one back
    SPLOT  ( x y rgb pattern -- )  set a pixel of sprite pattern 0-7
  Its interrupt: every frame it adds 1 to FRAMES and runs the Forth word VBL (a DEFER word, set up by the
  forth-graphics module). The display calls vbl() and then compose() once per screen refresh.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="video-chip">
"use strict";
const W = 320, H = 200, PATSIZE = 64;              // screen and sprite sizes
const FRAMES = 0x24, VBL_VECTOR = 0x28, SPRITES = 0xF000;   // its registers on the bus
let VID, PAT;                                      // its own memory: the screen, and 8 sprite patterns

DEVICES.push(function videoChip() {                // power-on: fresh memory, and the primitives
  VID = new Uint16Array(W * H); PAT = new Uint16Array(8 * PATSIZE * PATSIZE);
  const onScreen = (x, y) => x >= 0 && x < W && y >= 0 && y < H;     // off-screen pixels are ignored
  prim("CLS",   () => { for (let i = 0; i < W * H; i++) VID[i] = 0; });
  prim("PLOT",  () => { const c = pop() & 0xFFF, y = pop(), x = pop(); if (onScreen(x, y)) VID[y * W + x] = c; });
  prim("POINT", () => { const y = pop(), x = pop(); push(onScreen(x, y) ? VID[y * W + x] : 0); });
  prim("SPLOT", () => { const p = pop() & 7, c = pop() & 0xFFF, y = pop(), x = pop();
                        if (x >= 0 && x < PATSIZE && y >= 0 && y < PATSIZE) PAT[(p * PATSIZE + y) * PATSIZE + x] = c; });
});

// ── the interrupt: once per frame ────────────────────────────────────────────────────────────────
//   Count the frame, then run VBL on top of whatever the machine is doing — even in the middle of a
//   running program, between two of its steps: VBL's call pushes the program's IP and its EXIT pops
//   it back, as an interrupt saves and restores the program counter. It also runs while the machine
//   is halted by an error: the error waits, untouched. If VBL fails, the chip puts the interrupted program's registers back as they were,
//   switches the interrupt off ( its vector := 0: the error is reported once, not 60 times a second ) and passes it on.
function vbl() {
  setCell(FRAMES, cell(FRAMES) + 1);
  const v = cell(VBL_VECTOR);                      // the interrupt vector: set by forth-graphics, 0 = none
  if (!v) return;
  const sp = cell(SP), rp = cell(RP), ip = getIP(), stop = cell(STOP), msg = cell(MSG), self = cell(SELF);   // the interrupted program
  setCell(STOP, 0); setCell(MSG, 0);
  try { run(v); } catch (e) { trap(e); }
  const failed = cell(MSG), why = failed ? text(failed) : "";
  setCell(STOP, stop); setCell(MSG, msg);
  if (!failed) return;
  setCell(SP, sp); setCell(RP, rp); setIP(ip); setCell(SELF, self);   // back to the program, untouched
  setCell(VBL_VECTOR, 0);                          // the interrupt off ( as masking it ): reported once, not 60 times a second
  throw report("VBL: " + why + " (VBL switched off: ' VBL VBL-VECTOR ! turns it back on)");   // HOST: for the page
}

// ── the picture: the screen with the sprites on top, as 8-bit RGBA ───────────────────────────────
//   A colour lookup table (like a video DAC) turns each $RGB into a finished 32-bit pixel, so a pixel
//   costs one table read and one store. Sprite 7 is drawn first, so sprite 0 ends up in front.
//   The screen memory itself is never changed.
const DAC = new Uint32Array(4096);                 // $RGB → R G B A bytes (×17 turns F into FF), little-endian
for (let c = 0; c < 4096; c++) DAC[c] = 0xFF000000 | (c & 15) * 17 << 16 | (c >> 4 & 15) * 17 << 8 | (c >> 8 & 15) * 17;

function compose(rgba) {                           // rgba: the 320×200×4 bytes of an ImageData
  const px = new Uint32Array(rgba.buffer, rgba.byteOffset, W * H);
  for (let i = 0; i < W * H; i++) px[i] = DAC[VID[i]];
  for (let n = 7; n >= 0; n--) {
    const r = SPRITES + n * 8, sx = signed(r), sy = signed(r + 2), base = (cell(r + 4) & 7) * PATSIZE * PATSIZE;
    if (!cell(r + 6)) continue;                    // ON = 0: hidden
    const x0 = Math.max(0, -sx), x1 = Math.min(PATSIZE, W - sx), y0 = Math.max(0, -sy), y1 = Math.min(PATSIZE, H - sy);   // clip once
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const c = PAT[base + y * PATSIZE + x];
      if (c) px[(sy + y) * W + sx + x] = DAC[c];   // colour 0 is transparent
    }
  }
}

if (typeof module !== "undefined") { module.exports.vbl = vbl; module.exports.compose = compose; module.exports.video = () => VID; module.exports.patterns = () => PAT; }   // HOST: for the tests
</script>

<!-- ═══ 1c · KEYBOARD CHIP: a key queue and the held keys, written straight onto the bus ══════════
  It has no primitives: Forth reads it with C@ and C!, as a 6502 reads a keyboard's buffer.
  Its registers (on the bus):
    $F040  HEAD   where Forth takes the next key from      ( a byte: KEY steps it )
    $F041  TAIL   where the chip puts the next key         ( a byte: the chip steps it )
    $F080  HELD   one byte per key code 0-127: 255 while the key is down, 0 when it is up
    $F100  RING   256 bytes of keys waiting: HEAD = TAIL means none. Both are bytes, so they wrap
                  round the ring by themselves; when the ring is full a new key is dropped.
  Key codes: ASCII, plus  8 backspace  9 tab  13 enter  27 escape  28 ← 29 → 30 ↑ 31 ↓
  In HELD a letter is kept under its capital, so 65 KEY-DOWN? is the A key, with or without shift.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="keyboard-chip">
"use strict";
const KEY_HEAD = 0xF040, KEY_TAIL = 0xF041, KEY_HELD = 0xF080, KEY_RING = 0xF100;
const KEY_NAMES = { Backspace: 8, Tab: 9, Enter: 13, Escape: 27, ArrowLeft: 28, ArrowRight: 29, ArrowUp: 30, ArrowDown: 31 };

function keyCode(name) {                 // HOST: a browser key name → the chip's code, or 0 for keys it doesn't have
  if (name.length === 1) { const c = name.charCodeAt(0); return c < 128 ? c : 0; }
  return KEY_NAMES[name] || 0;
}
function keyIn(c) { if (c) ringPut(KEY_HEAD, KEY_RING, c); }   // a key pressed: into the ring, unless it is full
function keyHeld(c, down) {              // a key goes down or comes up
  if (c >= 97 && c <= 122) c -= 32;      // a letter: under its capital
  if (c) setByte(KEY_HELD + c, down ? 255 : 0);
}
function keysUp() { for (let c = 0; c < 128; c++) setByte(KEY_HELD + c, 0); }   // the window lost the keyboard
function typeKeys(s) { for (let i = 0; i < s.length; i++) keyIn(s.charCodeAt(i) & 127); }   // HOST: for the tests

if (typeof module !== "undefined") Object.assign(module.exports, { keyCode, keyIn, keyHeld, keysUp, typeKeys, loadKeys: typeKeys });   // HOST: for the tests
</script>

<!-- ═══ 1d · CLOCK CHIP: the time of day, as registers on the bus ═════════════════════════════════
  Like the time-of-day clock in the C64's CIA chip: the page sets it from the computer's clock every
  frame, and Forth reads it with C@ and @.
    $F060 SECONDS  $F061 MINUTES  $F062 HOURS (0-23)  $F063 DAY (1-31)  $F064 MONTH (1-12)   bytes
    $F066 YEAR                                                                               a cell
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="clock-chip">
"use strict";
const CLOCK = 0xF060;
function clockSet(d) {                   // HOST: the time of day into the registers (the page, every frame)
  setByte(CLOCK, d.getSeconds()); setByte(CLOCK + 1, d.getMinutes()); setByte(CLOCK + 2, d.getHours());
  setByte(CLOCK + 3, d.getDate()); setByte(CLOCK + 4, d.getMonth() + 1); setCell(CLOCK + 6, d.getFullYear());
}
if (typeof module !== "undefined") module.exports.clockSet = clockSet;   // HOST: for the tests
</script>

<!-- ═══ 1e · POINTER CHIP: the mouse and up to four fingers, in screen pixels ═════════════════════
  Four points at $F048 + 6n, three cells each:  X  Y  DOWN (-1 pressed, 0 not)
  The mouse is always point 0 (X and Y follow it even with no button down). A finger takes the first
  free point while it touches, and gives it back when it lifts. X and Y are screen pixels, 0-319 and
  0-199 (less or more when a drag leaves the screen), whatever size the page shows the screen at.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="pointer-chip">
"use strict";
const POINTERS = 0xF048;
function pointerSet(n, x, y, down) {     // point n is at x,y, pressed or not
  const a = POINTERS + 6 * n; setCell(a, x); setCell(a + 2, y); setCell(a + 4, down ? -1 : 0);
}
if (typeof module !== "undefined") module.exports.pointerSet = pointerSet;   // HOST: for the tests
</script>

<!-- ═══ 1f · SOUND CHIP: four voices, read once a frame ═══════════════════════════════════════════
  Four voices at $F200 + 8n:
    +0 FREQ  a cell, in Hz ( for a sample: its sample rate )
    +2 VOL   a byte, 0-15
    +3 WAVE  a byte: 0 off  1 square  2 sawtooth  3 triangle  4 sine  5 noise
                     6 play the sample: the chip starts it and sets WAVE back to 0 (a strobe:
                       write 6 again to play it again)
    +4 ADDR  +6 LEN  cells: the sample, LEN bytes in RAM from ADDR, unsigned 8-bit ( 128 = silence )
  Like a real sound chip it knows nothing of Forth: once per frame it reads its registers.
  soundFrame() gives what each voice should sound like now, and the samples started this frame;
  the page turns that into Web Audio.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="sound-chip">
"use strict";
const VOICES = 0xF200, SAMPLE = 6;
function soundFrame() {                  // → { voices: [{ freq, vol, wave }], samples: [{ voice, rate, vol, bytes }] }
  const voices = [], samples = [];
  for (let n = 0; n < 4; n++) {
    const a = VOICES + 8 * n, freq = cell(a), vol = byte(a + 2) & 15, wave = byte(a + 3);
    if (wave === SAMPLE) {               // the strobe: copy the sample out of RAM, then WAVE reads 0 again
      const at = cell(a + 4), len = cell(a + 6), bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = byte(at + i);
      samples.push({ voice: n, rate: freq, vol, bytes }); setByte(a + 3, 0);
    }
    voices.push({ freq, vol, wave: wave === SAMPLE ? 0 : wave });
  }
  return { voices, samples };
}
if (typeof module !== "undefined") module.exports.soundFrame = soundFrame;   // HOST: for the tests
</script>

<!-- ═══ 1g · UART: a serial port, bytes only, like a 6551 ACIA with a ring on each side ═══════════
  The cord between two ITCH machines. Each machine has one; the page joins the two with a wire.
  It has no primitives: Forth reads and writes it with C@ and C!, as it does the keyboard.
  Its registers (on the bus):
    $F300  TX-HEAD  where the wire takes the next byte out          ( the chip steps it )
    $F301  TX-TAIL  where Forth puts the next byte out              ( SEND steps it )
    $F302  RX-HEAD  where Forth takes the next byte in              ( RECV steps it )
    $F303  RX-TAIL  where the wire puts the next byte in            ( the chip steps it )
    $F400  TX ring, 256 bytes      $F500  RX ring, 256 bytes
  HEAD = TAIL: empty. TAIL one behind HEAD: full (255 bytes). Both are bytes, so they wrap by themselves.
  The wire: uartTake() empties TX into the chip's buffer TX_BUF ( → how many ), uartGive() fills RX with as
  much as fits ( → how many ). Nothing else.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script id="uart-chip">
"use strict";
const TX_HEAD = 0xF300, TX_TAIL = 0xF301, RX_HEAD = 0xF302, RX_TAIL = 0xF303, TX_RING = 0xF400, RX_RING = 0xF500;
const TX_BUF = new Uint8Array(256);                    // the wire's side: where it takes TX's bytes to
const uartTake = () => ringTake(TX_HEAD, TX_RING, TX_BUF);   // the wire takes every byte waiting in TX → how many ( in TX_BUF )
function uartGive(b, from = 0) {         // the wire puts b[from…] into RX, until it is full → how many fitted
  let i = from;
  while (i < b.length && ringPut(RX_HEAD, RX_RING, b[i])) i++;
  return i - from;
}
if (typeof module !== "undefined") Object.assign(module.exports, { uartTake, uartGive, TX_BUF });   // HOST: for the tests
</script>

<!-- ═══ 1h · MONITOR: the target's ROM, three commands on the UART ════════════════════════════════
  A TARGET machine is powered on with its primitives only: no BOOT, no interpreter, no names needed.
  Like the ROM monitor of a 1985 board, this small routine sits on the UART and obeys the host.
  Every command is a byte, a 16-bit address (low byte first) and, for W and R, a length:
    W  (87)  addr len data…   store len bytes at addr                   → no reply
    R  (82)  addr len         read len bytes at addr                    → the len bytes
    X  (88)  xt               run xt ( the data stack is the target's ) → O c … then K 0, or K 1 n msg
    G  (71)  xt               leave the monitor: xt runs, and the UART is its ( the host's CUT )
             EOT (4)          while G's word serves: back to the monitor, its RAM untouched ( the host's TETHER )
    Y  (89)  nonce            the handshake                                         → EOT Y nonce
             A served word may have printed anything, so the host finds the monitor's first reply by this
             marker: its nonce is new each time, so no byte sent before it can hold it.
             O (79) c         one character the word EMITted
             K (75) 0         it ended;  K 1 n chars: it failed, with that message
  The host's cord words (forth-tether) build on these: T! T@ TMOVE TCALL >T T> .TS
  A command never exceeds 244 bytes, so a whole one always fits in the RX ring.
  It runs between the host's messages ( the worker's onmessage ), never in the middle of a word.
  Its type is text/x-rom: the page itself never runs it, only the target's Worker does.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script type="text/x-rom" id="target-monitor">
"use strict";
// ── the monitor's side of the UART ───────────────────────────────────────────────────────────────
//   Flow control, as hardware does it: a reply is started only when it fits in TX, characters move
//   only as fast as TX drains, and what does not fit waits where it is ( in RX, in the terminal's ring ).
const rxCount = () => (byte(RX_TAIL) - byte(RX_HEAD)) & 255;          // bytes waiting in RX
const rxPeek  = i => byte(RX_RING + ((byte(RX_HEAD) + i) & 255));     // the i-th of them, left in place
const rxDrop  = n => setByte(RX_HEAD, byte(RX_HEAD) + n);             // done with n of them
const txFree  = () => ringFree(TX_HEAD);                               // room in TX
const txPut   = c => ringPut(TX_HEAD, TX_RING, c);                    // one byte out ( only after txFree said it fits )

// ── the wire's two buffers, outside the 64K bus ( a modem's ): fixed, allocated once ─────────────────
//   WIRE_IN  bytes off the wire that do not fit RX yet: a 4K ring ( an overrun past it loses bytes, as a UART's does )
//   WIRE_OUT the bytes TX gave up this heartbeat, handed back to the page ( which copies them )
const WIRE_IN = new Uint8Array(4096), WIRE_OUT = new Uint8Array(4096);
let inHead = 0, inTail = 0, outN = 0;

// ── three states: obeying commands; CALLING a word ( X ); SERVING a word for good ( G ) ────────────
//   A word never runs inside a command: X only starts it, and the heartbeat gives it slices of steps, as
//   it does after G. So a word may WAIT ( for room in the terminal's ring, for a byte ) like any other.
let calling = false, ended = false, serving = 0;          // X started a word; it has ended ( K still to send ); G's word
DEVICES.push(function monitorReset() {                    // power-on: nothing waiting, nothing running
  calling = ended = false; serving = 0; inHead = inTail = outN = 0;
});

function start(xt) {                     // enter xt ( a fault in a primitive entered directly: its message into RAM )
  try { startXt(xt); } catch (e) { trap(e); }            //  MSG is left alone: a SERVE entered again reports it
}

function command() {                     // obey the next whole command in RX → false if none is whole, or its reply must wait
  for (let n; (n = rxCount()) >= 3; ) {
    const c = rxPeek(0), a = rxPeek(1) | rxPeek(2) << 8;
    if (c === 88) { rxDrop(3); calling = true; setCell(MSG, 0); start(a); return true; }   // X xt: start it
    if (c === 71) { rxDrop(3); serving = a; setCell(MSG, 0); start(a); return true; }      // G xt: the UART is its now
    if (c === 89) {                                                                       // Y nonce: EOT Y nonce back,
      if (txFree() < 4) return false;                                                     //  the marker the host waits for
      rxDrop(3); txPut(4); txPut(89); txPut(a & 255); txPut(a >> 8); return true;
    }
    if (c !== 82 && c !== 87) { rxDrop(1); continue; }                                    // not a command: skip it
    if (n < 4) return false;
    const len = rxPeek(3);
    if (c === 82) {                                                                       // R addr len: the bytes back,
      if (txFree() < len) return false;                                                   //  once they fit in TX
      rxDrop(4); for (let i = 0; i < len; i++) txPut(byte(a + i)); return true;
    }
    if (n < 4 + len) return false;                                                        // W: wait for all its data
    for (let i = 0; i < len; i++) setByte(a + i, rxPeek(4 + i));
    rxDrop(4 + len); return true;
  }
  return false;
}

function terminalOut() {                 // what the word EMITted, as far as TX has room ( O c pairs while CALLING ) → moved any?
  const per = serving ? 1 : 2;
  let moved = false;
  while (txFree() >= per && byte(OUT_HEAD) !== byte(OUT_HEAD + 1)) {
    const h = byte(OUT_HEAD); if (!serving) txPut(79); txPut(byte(OUT_RING + h)); setByte(OUT_HEAD, h + 1); moved = true;
  }
  return moved;
}

function called() {                      // the X word ended: K 0, or K 1 and its message, once TX has room → sent?
  const msg = cell(MSG), n = msg ? Math.min(byte(msg), 200) : 0;
  if (byte(OUT_HEAD) !== byte(OUT_HEAD + 1) || txFree() < 3 + n) return false;   // its output first, and room for K
  txPut(75); txPut(msg ? 1 : 0);
  if (msg) { txPut(n); for (let i = 0; i < n; i++) txPut(byte(msg + 1 + i)); }
  setCell(MSG, 0); setCell(STOP, 0); setCell(RP, 0); setIP(0);         // the data stack stays, to look at
  calling = ended = false; return true;
}

function home() {                        // EOT while SERVING: the monitor takes the UART back ( the host's TETHER )
  serving = 0; inHead = inTail;                          //  the word stays frozen where it was, never resumed: X or G restarts
  setByte(RX_HEAD, byte(RX_TAIL)); setByte(TX_HEAD, byte(TX_TAIL)); setByte(OUT_HEAD, byte(OUT_HEAD + 1));   //  its unread input, unsent output: dropped
}

function wireIn(bytes) {                 // bytes off the wire into WIRE_IN ( while SERVING: ctrl-C, byte 3, is BREAK; EOT, byte 4, home )
  for (let i = 0; i < bytes.length; i++) {
    if (serving && bytes[i] === 3) { brk(); continue; }
    if (serving && bytes[i] === 4) { home(); continue; }  // the bytes after it are commands again
    if (((inTail + 1) & 4095) !== inHead) { WIRE_IN[inTail] = bytes[i]; inTail = (inTail + 1) & 4095; }   // full: an overrun
  }
}
function toRx() { while (inHead !== inTail && ringPut(RX_HEAD, RX_RING, WIRE_IN[inHead])) inHead = (inHead + 1) & 4095; }
function fromTx() {                      // TX's bytes into WIRE_OUT, while it has room for a whole TX
  if (WIRE_OUT.length - outN < 256) return;
  const n = uartTake(); WIRE_OUT.set(TX_BUF.subarray(0, n), outN); outN += n;
}

// ── slices of steps: the target's clock ──────────────────────────────────────────────────────────
//   Each heartbeat grants STEPS_PER_TICK steps, shared by whatever runs. The same bytes in give the same
//   bytes out, in the same heartbeat, on any computer: nothing here reads a clock. 200,000 steps a tick
//   ( 12 million a second ) is about half what a browser's 8 ms slice gets.
const STEPS_PER_TICK = 200000;
let budget = 0;
function slice() {                       // run the word for the budget left → "stopped", "asleep" or "spent"
  const s0 = steps;
  try { const more = resume(budget, false); budget -= steps - s0; return !more ? "stopped" : sleeping() ? "asleep" : "spent"; }
  catch (e) { budget -= steps - s0; if (!cell(MSG)) throw e; return "stopped"; }   // failed: its message is in MSG
}                                        // ( no MSG: a fault of the simulator, not of the machine: let it show )

// ── the heartbeat: the Worker calls it 60 times a second, and on every message ───────────────────
//   The wire's bytes into WIRE_IN, then into RX; the frame interrupt ( wake ); commands and slices until
//   there is nothing left to do or the budget is spent; TX's bytes out. After G, a word that stops ( an
//   error HALTs it, or BREAK ) is entered again, as a ROM jumps to its reset vector: SERVE then says
//   what went wrong.
function targetTick(bytes) {             // HOST: bytes off the wire ( maybe none ) → the bytes for the wire ( a view of WIRE_OUT )
  wireIn(bytes); outN = 0; budget = STEPS_PER_TICK;
  wake();
  for (;;) {
    toRx(); fromTx();
    if (!calling && !serving) { if (command()) continue; break; }
    if (ended) { const moved = terminalOut(); if (called() || moved) continue; break; }   // its last output, then K, as TX has room
    if (budget <= 0) break;
    const how = slice(), moved = terminalOut();
    if (how === "stopped") { if (calling) ended = true; else start(serving); continue; }
    if (how === "asleep" && moved) { wake(); continue; } // it waited for room in its ring: now there is some
    break;                                                // asleep for a byte, or the budget is spent
  }
  fromTx();
  return WIRE_OUT.subarray(0, outN);
}
if (typeof module !== "undefined") Object.assign(module.exports, { targetTick, STEPS_PER_TICK });   // HOST: for the tests
</script>

<!-- ═══ 2 · BOOT: the rest of the language, in Forth ══════════════════════════════════════════════
  The kernel's seed interpreter reads this at power-on. Read it top to bottom: every word uses
  only primitives and words above it.
  It is laid out as a tutorial, from what a reader meets first to what the system itself needs:
  values on the stack, computing, memory, deciding and looping, comparing; then what a word is,
  making words, and words that make words; then reading text, the interpreter, QUIT, forgetting.
     1 stack words             14 the terminal
     2 arithmetic and bits     15 strings
     3 system variables        16 the keyboard
     4 control flow            17 the wordlists
     5 comparison              18 deferred words
     6 headers                 19 WORD and FIND
     7 colon definitions       20 number input
     8 compiler verbs          21 errors, HALT, ABORT
     9 defining words          22 the outer interpreter
    10 lineage                 23 QUIT
    11 which wordlist          24 MARKER and ANEW
    12 CASE
    13 counted loops ( off )
  Stack comments ( before -- after ):  n number  u unsigned  f flag (0 false, -1 true)
    a address  c character  c-addr counted string [len][chars]  xt a word (its header address)
    "name" text read from the source.
  Lines tagged \ [PRIM] are Forth words you can swap for a primitive: see HOW TO at the
  kernel's primitive table.

  STAGE 0, the first eleven lines, cannot hold comments: \ and ( are its last two words.
    LATEST >IN #TIB   kernel registers: each word pushes an address (see the memory map)
    NEGATE INVERT OR  built from - and AND  (these three are [PRIM] candidates too)
    (RELINK)          move the newest word from the CURRENT wordlist ($36) into another:
                      three stores: CURRENT's head := its LINK, its LINK := the list's head, head := it
    IMMEDIATE         into COMPILER ($32): it acts while compiling ( no bit in its header )
    ALWAYS            into COMMON ($30): it acts the same in every mode
    \                 skips the rest of the line: >IN := #TIB
    (                 skips up to the next )
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script type="text/forth" id="forth-boot">
: LATEST 8 ;
: >IN 4 ;
: #TIB 6 ;
: NEGATE 0 SWAP - ;
: INVERT -1 SWAP - ;
: OR INVERT SWAP INVERT AND INVERT ;
: (RELINK) LATEST @ @ 54 @ ! DUP @ LATEST @ ! LATEST @ SWAP ! ;
: IMMEDIATE 50 (RELINK) ;
: ALWAYS 48 (RELINK) ;
: \ #TIB @ >IN ! ; ALWAYS
: ( 41 WORD DROP ; ALWAYS

\ ── 1 · stack words, from the primitives DUP DROP SWAP >R R> ──────────────────────────────────────
\ Everything else on the stacks is built from those five; each [PRIM] line can become native code.
: OVER ( a b -- a b a ) >R DUP R> SWAP ;        \ [PRIM]
: ROT ( a b c -- b c a ) >R SWAP R> SWAP ;      \ [PRIM]
: NIP ( a b -- b ) SWAP DROP ;                  \ [PRIM]
: 2DUP ( a b -- a b a b ) OVER OVER ;           \ [PRIM]
: 2DROP ( a b -- ) DROP DROP ;                  \ [PRIM]
: R@ ( -- x ) R> R> DUP >R SWAP >R ;            \ [PRIM]  the first R> is R@'s own return address
: RP@ ( -- n ) 14 @ 2 - ;                       \ return stack depth in bytes, less R@'s own frame
: DEPTH ( -- n ) 12 @ 2 / ;                     \ data stack depth in cells ( SP counts bytes )

\ ── 2 · arithmetic and bits ───────────────────────────────────────────────────────────────────────
\ The rest of arithmetic, from + - * / AND and the stack words.
: 1+ ( n -- n ) 1 + ;                           \ [PRIM]
: 1- ( n -- n ) 1 - ;                           \ [PRIM]
: MOD ( a b -- r ) 2DUP / * - ;                 \ a - (a/b)*b
: XOR ( a b -- x ) 2DUP OR >R AND R> SWAP - ;   \ [PRIM]  OR minus the shared bits ( no borrows: AND is a subset of OR )
: +! ( n a -- ) DUP @ ROT + SWAP ! ;            \ add n to the cell at a

\ ── 3 · system variables ──────────────────────────────────────────────────────────────────────────
\ Kernel state is RAM at fixed addresses. Each of these words just pushes an address;
\ @ and ! read and write it. There is no STATE: the context stack answers "compiling?".
: DP ( -- a ) 10 ;                      \ dictionary pointer: the next free byte
: COMMON-WORDS ( -- a ) 48 ;            \ $30 the COMMON wordlist: its newest header
: COMPILER-WORDS ( -- a ) 50 ;          \ $32 the COMPILER wordlist
: FORTH-WORDS ( -- a ) 52 ;             \ $34 the FORTH wordlist
: CURRENT ( -- a ) 54 ;                 \ $36 the wordlist new words go into: FORTH-WORDS
: TIB ( -- a ) 64 ;                     \ terminal input buffer: the boot script is read through it
: PAD ( -- a ) 1088 ;                   \ scratch: WORD leaves its counted string here
: SRC ( -- a ) 24 ;                     \ address of the text being read: a line, the TIB, an EVALUATE string
: BASE ( -- a ) 16 ;                    \ number base, for input and output
: ALLOT ( n -- ) DP @ + DP ! ;         \ reserve n bytes of dictionary
: C, ( c -- ) DP @ C! 1 ALLOT ;         \ one byte into the dictionary  ( , compiles a cell: a primitive )
\ HERE , and PATCH are primitives that build wherever the open definition is built: here, or in
\ another SPACE ( a target machine, over the tether ). ALLOT and C, always mean this machine's RAM.
: CURRENT-SPACE ( -- a ) 20 ;           \ $14 where new definitions are built: 0 here, or a space table

\ ── 4 · control flow ──────────────────────────────────────────────────────────────────────────────
\ These are IMMEDIATE: they run while a definition is compiled and lay down BRANCH or 0BRANCH
\ followed by a target cell. Their bookkeeping lives on the COMPILE stack ( C: ), not the data
\ stack: a forward jump leaves its 0 "hole" there (orig) until THEN fills it with HERE, and BEGIN
\ leaves where its loop starts (dest). The primitives >C and C> can never reach into the open
\ definition's frame, and ; refuses to close a word with one left: an unclosed IF is an error.
: CSWAP ( C: a b -- b a ) C> C> SWAP >C >C ;
: >MARK ( C: -- orig ) HERE >C 0 , ;             \ a hole, to fill later
: >RESOLVE ( C: orig -- ) C> HERE SWAP PATCH ;   \ fill the newest hole with HERE
: IF ( C: -- orig ) ['] 0BRANCH , >MARK ; IMMEDIATE                     \ 0BRANCH jumps when the flag is 0
: THEN ( C: orig -- ) >RESOLVE ; IMMEDIATE
: ELSE ( C: orig -- orig' ) ['] BRANCH , >MARK CSWAP >RESOLVE ; IMMEDIATE   \ jump over the ELSE part; IF lands here
: BEGIN ( C: -- dest ) HERE >C ; IMMEDIATE
: UNTIL ( C: dest -- ) ['] 0BRANCH , C> , ; IMMEDIATE
: AGAIN ( C: dest -- ) ['] BRANCH , C> , ; IMMEDIATE
: WHILE ( C: dest -- orig dest ) ['] 0BRANCH , >MARK CSWAP ; IMMEDIATE  \ standard order, so two WHILEs work:
: REPEAT ( C: orig dest -- ) ['] BRANCH , C> , >RESOLVE ; IMMEDIATE     \ BEGIN … WHILE … WHILE … REPEAT THEN

\ ── 5 · comparison: a flag is 0 (false) or -1 (true: all bits set) ────────────────────────────────
: 0= ( n -- f ) IF 0 ELSE -1 THEN ;             \ [PRIM]
: 0<> ( n -- f ) 0= 0= ;
: 0< ( n -- f ) 32768 AND 0<> ;                 \ [PRIM]  the sign bit
: 0> ( n -- f ) DUP 0= SWAP 0< OR 0= ;
: = ( a b -- f ) - 0= ;                         \ [PRIM]
: <> ( a b -- f ) = 0= ;
\ < for signed numbers: when the signs differ ( a XOR b is negative ), a < b exactly when a is
\ negative; when they agree, a-b cannot overflow and its sign is the answer. U< is the same for
\ unsigned numbers, except that when the high bits differ it is b that has it set.
: < ( a b -- f ) 2DUP XOR 0< IF DROP 0< ELSE - 0< THEN ;    \ [PRIM]
: > ( a b -- f ) SWAP < ;
: <= ( a b -- f ) > 0= ;
: >= ( a b -- f ) < 0= ;
: U< ( u u -- f ) 2DUP XOR 0< IF NIP 0< ELSE - 0< THEN ;   \ [PRIM]
: U> ( u u -- f ) SWAP U< ;
: WITHIN ( n lo hi -- f ) OVER - >R - R> U< ;              \ lo <= n < hi, with one unsigned compare
: ?DUP ( x -- x x | 0 ) DUP IF DUP THEN ;
: MIN ( a b -- n ) 2DUP > IF SWAP THEN DROP ;
: MAX ( a b -- n ) 2DUP < IF SWAP THEN DROP ;
: ABS ( n -- u ) DUP 0< IF NEGATE THEN ;

\ ── 6 · headers ───────────────────────────────────────────────────────────────────────────────────
\ A word:  PARENT(2) | xt: LINK(2) LEN(1) NAME(len) KIND(1) body…
\ PARENT is the word that made this one: its lineage (see the defining words below). LINK points
\ at the previous header in the same wordlist; LATEST holds the newest header made, in any list.
\ KIND tells EXECUTE how to run the body:
\ 0 CODE  1 COLON  2 CREATED. WORD leaves [len][name] in PAD, exactly the LEN NAME part.
: (HEADER) ( parent kind c-addr -- )    \ the one word builder: : :NONAME CREATE CLONE all use it
  >R >R , R> R>                         \ PARENT, just before the header
  >R HERE CURRENT @ @ ,                 \ LINK = the CURRENT wordlist's newest header   ( kind xt )
  R> DUP C@ 1 + DUP >R HERE SWAP MOVE   \ copy [len][name] to HERE     ( kind xt )
  R> ALLOT SWAP C,                      \ step past it, the KIND byte  ( xt )
  DUP CURRENT @ !  LATEST ! ;           \ the new header heads CURRENT, and is LATEST
: HEADER ( parent kind "name" -- ) 32 WORD (HEADER) ;
: >CFA ( xt -- a ) DUP 2 + C@ 127 AND + 3 + ;   \ skip LINK LEN NAME: the address of the KIND byte
: >ACTION ( xt -- a ) >CFA 1 + ;                \ a CREATEd word's first body cell: its DOES> code, or 0
: PARENT ( xt -- xt' ) 2 - @ ;                  \ the word that made it (0: the machine itself)
: SELF ( -- xt ) 42 @ ;                         \ the data word whose DOES> code is running (0: none)

\ ── 7 · colon definitions: the compile stack and the context stack ────────────────────────────────
\ Instead of STATE, ITCH keeps two compilation stacks (the kernel's header shows them in full):
\   the COMPILE stack says what is being built: a frame per open definition, [outer][space][xt][hole],
\     CFP marking where the open frame ends, and the control-flow addresses above it
\   the CONTEXT stack says how to treat tokens now: 0 interpreting, 1 compiling, 2 compiling DOES> code
\ : opens a frame on both and ; closes both. [ and ] push and pop an interpreting frame on the
\ context stack only, so the word being built waits underneath.
\ A : inside a definition: the outer word gets BRANCH <hole>, the inner word is built right
\ there, and the inner ; fills the hole with HERE, so the outer thread jumps over it. Any depth.
: CSP ( -- a ) 2 ;                              \ compile stack depth, in bytes
: CS ( -- a ) 1728 ;                            \ the compile stack, $06C0
: CFP ( -- a ) 46 ;                             \ where the open definition's frame ends ( 0: none )
: CXP ( -- a ) 44 ;                             \ context stack depth, in bytes
: CX ( -- a ) 1984 ;                            \ the context stack, $07C0
: BUILDING ( -- xt ) CFP @ CS + 4 - @ ;         \ the word being compiled
: MODE ( -- n ) CXP @ CX + 2 - @ ;              \ the top context frame's mode
: MODE! ( n -- ) CXP @ CX + 2 - ! ;
: IN-DOES? ( -- f ) MODE 2 AND ;                \ are we compiling DOES> code?
: (OPEN) ( parent kind c-addr -- )
  CURRENT-SPACE @ DUP IF 6 + @ EXECUTE EXIT THEN DROP  \ built in another space: its table's OPEN does it
  >R >R >R OPEN? IF ['] BRANCH , HERE 0 , ELSE 0 THEN   \ inside another definition? jump around us  ( hole )
  R> R> R> (HEADER) >R 0 LATEST @ R> >CS ;         \ build the word; open its frames on both stacks ( space 0 )
: : ( "name" -- ) ['] : 1 32 WORD (OPEN) ; ALWAYS             \ ALWAYS, so : works inside a definition too
: :NONAME ( -- xt ) ['] :NONAME 1 0 PAD C! PAD (OPEN) ; ALWAYS      \ an empty name; its ; leaves the xt

\ ── 8 · compiler verbs ────────────────────────────────────────────────────────────────────────────
\ Words that compile: they lay code into the word being built, or ask the compilation stacks about it.
: LITERAL ( n -- ) ['] LIT , , ; IMMEDIATE          \ compile "push n"
: RECURSE ( -- ) BUILDING , ; IMMEDIATE                \ compile a call to the word being built

\ ── 9 · defining words and lineage ────────────────────────────────────────────────────────────────
\ Who made a word is settled when CREATE is compiled, not when it runs, so it costs nothing:
\   CREATE X                  typed: X is made by CREATE
\   : CONSTANT CREATE … ;     compiles LIT CONSTANT (CREATE): its words are made by CONSTANT
\   … DOES> … CREATE … ;      compiles SELF (CREATE): made by the word whose DOES> code runs,
\                             so words that make words that make words form a family line
: (CREATE) ( parent "name" -- ) 2 HEADER 0 , ;  \ KIND 2, ACTION 0: running it pushes its data address
: CREATE ( "name" -- )
  COMPILING? IF IN-DOES? IF ['] SELF , ELSE ['] LIT , BUILDING , THEN ['] (CREATE) ,
  ELSE ['] CREATE (CREATE) THEN ; ALWAYS
\ DOES> compiles (DOES>) into the defining word. When the defining word runs, (DOES>) pops
\ its own return address (R>): that is the address of the code after DOES>. It stores it as
\ the new word's ACTION, and since it took that return address, it returns straight to the
\ defining word's caller: the DOES> code is kept for the new word and not run now.
: (DOES>) ( -- ) R> LATEST @ >ACTION ! ;
: DOES> ( -- ) ['] (DOES>) , 2 MODE! ; IMMEDIATE   \ and from here on the context is: compiling DOES> code
: CONSTANT ( n "name" -- ) CREATE , DOES> @ ;
: VARIABLE ( "name" -- ) CREATE 0 , ;

\ ── 10 · lineage: follow PARENT up the family tree ────────────────────────────────────────────────
: IS-A? ( xt ancestor -- f ) >R                        \ R: ancestor
  BEGIN DUP WHILE                                      \ ( xt ) up the family line, until 0
    DUP R@ = IF DROP R> DROP -1 EXIT THEN              \ there it is: yes
    PARENT
  REPEAT R> 2DROP 0 ;                                  \ past the oldest: no

\ ── 11 · which wordlist a word is in ───────────────────────────────────────────────────────────────
\ A word acts while compiling when it lives in COMMON or COMPILER: there is no flag in its header.
: IN-LIST? ( xt wl -- f ) @ BEGIN DUP WHILE 2DUP = IF 2DROP -1 EXIT THEN @ REPEAT NIP ;   \ along one wordlist
: IMMEDIATE? ( xt -- f ) DUP COMMON-WORDS IN-LIST? SWAP COMPILER-WORDS IN-LIST? OR ;
\ POSTPONE: a word that acts while compiling is compiled as it is, so it acts when the word we build runs.
\ Any other word gets code that compiles it later:  LIT xt ,
: POSTPONE ( "name" -- ) ' DUP IMMEDIATE? IF , ELSE ['] LIT , , ['] , , THEN ; IMMEDIATE

\ ── 12 · CASE: pick one branch by value ───────────────────────────────────────────────────────────
\   x CASE  1 OF … ENDOF  2 OF … ENDOF  … default, x still on the stack …  ENDCASE
\ Each OF compiles  OVER = IF DROP : if x equals the value, drop x and run the branch. Each ENDOF
\ is an ELSE that jumps to the end. While compiling, the compile stack holds a 0 from CASE, then one
\ orig per ENDOF; ENDCASE drops x and fills every hole down to that 0.
: CASE ( C: -- 0 ) 0 >C ; IMMEDIATE                              \ a 0 marks where this CASE's ENDOFs begin
: OF ( C: -- orig ) POSTPONE OVER POSTPONE = POSTPONE IF POSTPONE DROP ; IMMEDIATE
: ENDOF ( C: orig -- orig' ) POSTPONE ELSE ; IMMEDIATE
: ENDCASE ( C: 0 orig… -- ) POSTPONE DROP BEGIN C> ?DUP WHILE HERE SWAP PATCH REPEAT ; IMMEDIATE   \ fill every ENDOF's hole

\ ── 13 · counted loops: DO ?DO LOOP +LOOP I J LEAVE UNLOOP ( switched off ) ───────────────────────
\ Each definition below is switched off: delete its leading "\ " to turn it on.
\ limit start DO … LOOP runs its body with I = start, start+1, … limit-1. (DO) moves the loop onto
\ the return stack as three cells,   exit limit d   with d = index - limit, so LOOP is done exactly
\ when d reaches 0, and +LOOP when its step carries d across the line between -1 and 0, either way.
\ I is d + limit. exit is the address just past the loop (DO leaves a hole for it after (DO), LOOP
\ fills it), so LEAVE only drops its own return address and the loop's d and limit: its EXIT then
\ "returns" to exit. The top of the return stack is always the running word's own return address,
\ so each of these takes it off first (R>) and puts it back last.
\ Turn on (DO) (LOOP) UNLOOP I DO LOOP for the basics; the others each need only those.
\ : (DO) ( limit start -- ) R> DUP @ >R ROT ROT OVER - SWAP >R >R 2 + >R ;                 \ [PRIM]  R: exit limit d
\ : (?DO) ( limit start -- ) 2DUP = IF 2DROP R> @ >R EXIT THEN R> DUP @ >R ROT ROT OVER - SWAP >R >R 2 + >R ;   \ [PRIM]  or jump to exit
\ : (LOOP) ( -- f ) R> R> 1+ DUP >R 0= SWAP >R ;                                          \ [PRIM]  d+1: done at 0
\ : (+LOOP) ( n -- f ) R> SWAP R> 2DUP + DUP >R OVER XOR ROT ROT XOR AND 0< SWAP >R ;      \ [PRIM]  crossed -1|0?
\ : UNLOOP ( -- ) R> R> DROP R> DROP R> DROP >R ;                                          \ [PRIM]  drop the loop's 3 cells
\ : I ( -- n ) R> R> DUP R@ + SWAP >R SWAP >R ;                                            \ [PRIM]  d + limit
\ : J ( -- n ) R> R> R> R> R> DUP R@ + SWAP >R SWAP >R SWAP >R SWAP >R SWAP >R ;             \ [PRIM]  the outer loop's I
\ : LEAVE ( -- ) R> DROP R> DROP R> DROP ;                                                 \ its EXIT pops exit: out of the loop
\ : DO ( C: -- orig dest ) ['] (DO) , >MARK HERE >C ; IMMEDIATE
\ : ?DO ( C: -- orig dest ) ['] (?DO) , >MARK HERE >C ; IMMEDIATE                                \ DO, but skip the loop if limit = start
\ : LOOP ( C: orig dest -- ) ['] (LOOP) , ['] 0BRANCH , C> , ['] UNLOOP , >RESOLVE ; IMMEDIATE
\ : +LOOP ( C: orig dest -- ) ['] (+LOOP) , ['] 0BRANCH , C> , ['] UNLOOP , >RESOLVE ; IMMEDIATE  \ n +LOOP: step by n

\ ── 14 · the terminal: characters out ────────────────────────────────────────────────────────────
\ EMIT puts a character in the terminal chip's ring, at TAIL; the chip takes them from HEAD and shows
\ them. HEAD and TAIL are bytes: C! keeps 8 bits, so they wrap round the ring. A full ring ( TAIL one
\ behind HEAD ): sleep until the next frame, when the terminal will have taken some.
: OUT-HEAD ( -- a ) 62976 ;                             \ $F600  a byte: where the terminal takes the next one
: OUT-TAIL ( -- a ) 62977 ;                             \ $F601  a byte: where EMIT puts the next one
: OUT-RING ( -- a ) 63232 ;                             \ $F700  256 characters on their way out
: EMIT ( c -- ) BEGIN OUT-TAIL C@ 1+ 255 AND OUT-HEAD C@ = WHILE WAIT REPEAT   \ full: sleep a frame
  OUT-TAIL C@ OUT-RING + C!  OUT-TAIL C@ 1+ OUT-TAIL C! ;                        \ the character first, then TAIL
: PAGE ( -- ) 12 EMIT ;                                 \ a clean screen: a form feed, as a terminal takes it

\ ── 15 · strings and the dictionary ───────────────────────────────────────────────────────────────
\ Counted strings (a length byte, then the characters), text input, and finding a word by name.
: >BODY ( xt -- a ) DUP >CFA C@ 2 = IF >CFA 3 + ELSE >CFA 1 + THEN ;   \ the data field: CREATEd words skip ACTION
: CR ( -- ) 10 EMIT ;
: SPACE ( -- ) 32 EMIT ;
: COUNT ( c-addr -- a n ) DUP 1+ SWAP C@ ;                             \ [len][chars] → address and length
: /STRING ( a n k -- a+k n-k ) ROT OVER + ROT ROT - ;                  \ step k characters into a string
: TYPE ( a n -- ) BEGIN DUP WHILE OVER C@ EMIT 1 /STRING REPEAT 2DROP ;
: FILL ( a n c -- ) SWAP BEGIN DUP WHILE >R 2DUP SWAP C! SWAP 1+ SWAP R> 1- REPEAT 2DROP DROP ;   \ n bytes of c from a

\ ── 16 · the keyboard: a ring of keys the keyboard chip fills and KEY empties ─────────────────────
\ The chip puts each key at RING+TAIL and steps TAIL; KEY takes one from RING+HEAD and steps HEAD.
\ HEAD and TAIL are bytes: C! keeps 8 bits, so 255 1+ becomes 0 and they wrap round the ring.
: KEY-HEAD ( -- a ) 61504 ;                             \ $F040  a byte: where KEY takes the next key
: KEY-TAIL ( -- a ) 61505 ;                             \ $F041  a byte: where the chip puts the next key
: KEY-HELD ( -- a ) 61568 ;                             \ $F080  a byte per key code: 255 while it is held
: KEY-RING ( -- a ) 61696 ;                             \ $F100  256 bytes of keys waiting
: KEY? ( -- f ) KEY-HEAD C@ KEY-TAIL C@ <> ;            \ is a key waiting?
: KEY ( -- c ) BEGIN KEY? 0= WHILE WAIT REPEAT           \ none yet: sleep until the next frame
  KEY-HEAD C@ DUP KEY-RING + C@ SWAP 1+ KEY-HEAD C! ;    \ take the key at HEAD, step HEAD
: KEY-DOWN? ( c -- f ) 127 AND KEY-HELD + C@ 0<> ;      \ is that key held down right now? ( for games )
: KEYS ( a n -- ) BEGIN DUP WHILE                        \ type them, as if on the keyboard:
    OVER C@ KEY-TAIL C@ KEY-RING + C!  KEY-TAIL C@ 1+ KEY-TAIL C!   \ the key first, then TAIL
  1 /STRING REPEAT 2DROP ;
\ ACCEPT: read keys into a until enter, at most n of them, showing each one; backspace takes one
\ back; other control keys are ignored. Leaves how many it kept.
: ACCEPT ( a n -- n' ) >R 0 BEGIN KEY DUP 13 <> WHILE           \ ( a i c )  R: n
    DUP 8 = IF DROP DUP IF 1- 8 EMIT THEN                         \ backspace
    ELSE OVER R@ < 0= OVER 32 < OR IF DROP                        \ no room, or a control key: ignore it
    ELSE >R 2DUP + R@ SWAP C! 1+ R> EMIT THEN THEN                \ keep it and show it
  REPEAT DROP R> DROP NIP ;
\ Reading the source: the text is SRC for #TIB bytes, and >IN says how far we got.
\ SKIP steps over delimiters; PARSE collects up to the next one and steps past it.
\ They run for every character the interpreter reads, so the delimiter sits in a variable
\ instead of being juggled on the stack.  ( fig-Forth had a code word for this: ENCLOSE )
VARIABLE DELIM
: MORE? ( -- n ) #TIB @ >IN @ - ;               \ characters left: non-zero counts as true
: PEEK ( -- c ) SRC @ >IN @ + C@ ;              \ the character at >IN
: >IN+ ( -- ) >IN @ 1+ >IN ! ;
: SKIP ( c -- ) DELIM ! BEGIN MORE? WHILE PEEK DELIM @ - 0= WHILE >IN+ REPEAT THEN ;   \ [PRIM]
: PARSE ( c -- a n ) DELIM ! SRC @ >IN @ + 0          \ ( a 0 ): the text starts here  [PRIM]
  BEGIN MORE? WHILE PEEK DELIM @ - WHILE 1+ >IN+ REPEAT  \ count up to the delimiter or the end
  >IN+ THEN ;                                          \ at the delimiter: step past it too
\ A string in a definition is stored inline:  (S") [len][chars] …the thread goes on…
\ At run time (S") pops its return address, which points at the string, returns the string,
\ and pushes back the address just past it, so the thread carries on after the string.
: S, ( a n -- ) 255 MIN DUP C, HERE OVER ALLOT SWAP MOVE ;       \ lay down a counted string
: (S") ( -- a n ) R> DUP COUNT + >R COUNT ;
: SLITERAL ( a n -- ) ['] (S") , S, ; IMMEDIATE        \ compile "push this string": (S") and the string inline
: S" ( "ccc<quote>" -- a n ) 34 PARSE COMPILING? IF POSTPONE SLITERAL THEN ; ALWAYS   \ at the prompt it points into the source
: ." ( "ccc<quote>" -- ) POSTPONE S" COMPILING? IF ['] TYPE , ELSE TYPE THEN ; ALWAYS
: .( ( "ccc<paren>" -- ) 41 PARSE TYPE ; ALWAYS             \ print now, even in a definition
: NAME>STRING ( xt -- a n ) 2 + COUNT 127 AND ;                 \ a header's name ( bit 7 is free )
\ Names are found without regard to case. UPC folds a-z to A-Z; c is a byte, so a plain -
\ can't overflow and 0< is enough ( no need for the full signed < ).
: UPC ( c -- C ) DUP 97 - 0< 0= OVER 123 - 0< AND IF 32 - THEN ;   \ [PRIM]
: NOCASE= ( c1 c2 -- f ) 2DUP = IF 2DROP -1 ELSE UPC SWAP UPC = THEN ;   \ equal bytes: no folding needed
: UPPER ( a n -- ) BEGIN DUP WHILE OVER DUP C@ UPC SWAP C! 1 /STRING REPEAT 2DROP ;
: S= ( a1 a2 n -- f )                                  \ the same n characters, in any case?
  BEGIN DUP WHILE >R                                   \ ( a1 a2 )  R: n
    OVER C@ OVER C@ NOCASE= 0= IF R> DROP 2DROP 0 EXIT THEN   \ they differ: no
    1+ SWAP 1+ SWAP R> 1-                              \ the next pair
  REPEAT DROP 2DROP -1 ;                               \ all n alike: yes
\ ── 17 · the wordlists: COMMON, COMPILER, FORTH, each a chain of headers from its newest ────────────
\ FIND-IN walks one wordlist. It checks the length byte first ( cheap ) and calls S= only for
\ names of the same length. WANT holds the length: one fetch, no stack juggling.
VARIABLE WANT
: FIND-IN ( a n wl -- xt|0 ) @ SWAP WANT ! BEGIN DUP WHILE     \ ( a xt ), from the newest header
    DUP 2 + C@ 127 AND WANT @ - 0= IF                          \ same length?
      2DUP 3 + WANT @ S= IF NIP EXIT THEN THEN                 \ same name: found
    @                                                          \ LINK: the next older header
  REPEAT NIP ;
: FIND-NAME ( a n -- xt|0 )                                    \ in any wordlist: COMMON, COMPILER, FORTH
  2DUP COMMON-WORDS FIND-IN ?DUP IF NIP NIP EXIT THEN
  2DUP COMPILER-WORDS FIND-IN ?DUP IF NIP NIP EXIT THEN
  FORTH-WORDS FIND-IN ;
\ EACH-WORD shows every word, list by list and newest first, to a word ( x -- ): WORDS, CHILDREN,
\ HEADER?, CLONE and MARKER all look at the whole dictionary through it. ( It does not nest. )
VARIABLE VISITOR
: (VISIT) ( wl -- ) @ BEGIN DUP WHILE DUP >R VISITOR @ EXECUTE R> @ REPEAT DROP ;
: EACH-WORD ( xt -- ) VISITOR ! COMMON-WORDS (VISIT) COMPILER-WORDS (VISIT) FORTH-WORDS (VISIT) ;
VARIABLE SOUGHT                                                \ what a visitor is looking for
: (.WORD) ( x -- ) NAME>STRING ?DUP IF TYPE SPACE ELSE DROP THEN ;   \ a :NONAME word has no name to show
: WORDS ( -- ) ['] (.WORD) EACH-WORD ;
\ CLONE, as in Self: a new word made from an existing one, which becomes its parent. A data word's
\ clone gets the same DOES> code and a copy of its data (up to the next word); any other word's
\ clone is a colon word that runs it.
VARIABLE NEAREST
: (NEARER) ( x -- ) DUP SOUGHT @ U> OVER NEAREST @ U< AND IF NEAREST ! ELSE DROP THEN ;   \ above xt, below the best
: DATA-END ( xt -- a )                  \ where xt's data ends: the next header's PARENT cell, or HERE
  SOUGHT ! HERE 2 + NEAREST ! ['] (NEARER) EACH-WORD NEAREST @ 2 - ;
: CLONE ( xt "name" -- ) DUP >CFA C@ 2 = IF
    DUP >BODY OVER DATA-END OVER -      ( xt from n )
    ROT DUP 2 HEADER >ACTION @ ,        \ ( from n ) same DOES> code
    HERE OVER ALLOT SWAP MOVE           \ copy the data
  ELSE DUP 1 HEADER , ['] EXIT , THEN ;

\ ── 18 · deferred words: an ordinary defining word. The data cell holds the xt it runs ────────────
: NOOP ( -- ) ;
: SOURCE ( -- a n ) SRC @ #TIB @ ;
: DEFER ( "name" -- ) CREATE ['] NOOP , DOES> @ EXECUTE ;
\ The kernel's WORD and FIND vectors ran on a hand-laid copy of that DOES> code; point them at
\ DEFER's own, so every deferred word in the system runs the same code (and SEE says "made by DEFER")
DEFER (VECTOR)  ' (VECTOR) >ACTION @  DUP ' WORD >ACTION !  ' FIND >ACTION !
' DEFER ' WORD 2 - !  ' DEFER ' FIND 2 - !            \ and they are DEFER's children now
: IS ( xt "name" -- ) COMPILING? IF ['] LIT , ' >BODY , ['] ! , ELSE ' >BODY ! THEN ; ALWAYS

\ ── 19 · WORD and FIND, in Forth ──────────────────────────────────────────────────────────────────
\ The kernel made WORD and FIND as deferred words aimed at the seed primitives (WORD) and (FIND),
\ because ( HEADER and : need them before Forth could say them. IS re-aims both vectors here,
\ so every word compiled above with WORD or FIND runs this Forth code from now on.
\ WORD: skip delimiters, parse the name, copy at most 127 characters to PAD as [len][chars],
\ and upper-case them there, so a name is found whatever case you type.
:NONAME ( c -- c-addr ) DUP SKIP PARSE 127 MIN          \ skip the delimiters, take the name ( a n )
  DUP PAD C! PAD 1+ SWAP MOVE                          \ into PAD as [len][chars]
  PAD COUNT UPPER PAD ; IS WORD                        \ upper-cased there
\ FIND: xt and 1 for a word that acts while compiling ( found in COMMON or COMPILER ), xt and -1
\ for a FORTH word, the string and 0 if not found. ( INTERPRET asks the context frame instead. )
:NONAME ( c-addr -- c-addr 0 | xt 1 | xt -1 )
  DUP COUNT COMMON-WORDS FIND-IN ?DUP IF NIP 1 EXIT THEN
  DUP COUNT COMPILER-WORDS FIND-IN ?DUP IF NIP 1 EXIT THEN
  DUP COUNT FORTH-WORDS FIND-IN ?DUP IF NIP -1 EXIT THEN 0 ; IS FIND

\ ── 20 · number input: an optional prefix $ # %, an optional '-', digits 0-9 A-Z below BASE ───────
\ ( WORD has upper-cased them. The prefix picks the base for this one number: $FF #99 %101 )
\ DIGIT? maps '0'-'9' to 0-9 and 'A'-'Z' to 10-35. The seven characters between '9' and 'A'
\ become -1, which no BASE accepts: U< sees it as 65535.
: DIGIT? ( c -- n f ) 48 - DUP 9 > IF 7 - DUP 10 < IF DROP -1 THEN THEN DUP BASE @ U< ;
: SIGN? ( a n -- a n f ) OVER C@ 45 = OVER 1 > AND DUP IF >R 1 /STRING R> THEN ;   \ a '-' with more after it: skip it
: >NUM ( u a n -- u a n ) BEGIN DUP WHILE              \ while characters are left
    OVER C@ DIGIT? WHILE                               \ ( u a n digit ): a digit in BASE
    >R ROT BASE @ * R> + ROT ROT 1 /STRING             \ u = u*BASE + digit, one character on
  REPEAT DROP THEN ;                                   \ not a digit: drop what DIGIT? left
: (NUMBER?) ( a n -- n -1 | 0 )
  SIGN? >R DUP 0= IF 2DROP R> DROP 0 EXIT THEN               \ nothing after the sign: not a number
  0 ROT ROT >NUM NIP IF DROP R> DROP 0 EXIT THEN             \ characters left over: not a number
  R> IF NEGATE THEN -1 ;
: BASE-PREFIX ( c -- base | 0 ) CASE 36 OF 16 ENDOF 35 OF 10 ENDOF 37 OF 2 ENDOF 0 SWAP ENDCASE ;   \ $ # %
: NUMBER? ( c-addr -- n -1 | 0 )
  COUNT OVER C@ BASE-PREFIX OVER 0<> AND ?DUP IF              \ a prefix: switch BASE for this number only
    BASE @ >R BASE ! 1 /STRING (NUMBER?) R> BASE ! EXIT THEN
  (NUMBER?) ;

\ ── 21 · errors, HALT and ABORT ───────────────────────────────────────────────────────────────────
\ An error puts the address of a counted message in MSG and halts: HALT writes the STOP
\ register, and the kernel's NEXT loop stops after that step. Nothing is unwound, so the
\ terminal shows the stacks exactly as they were. On the next line, QUIT sees MSG and cleans
\ up first ( ABORT's work, done then ).
: MSG ( -- a ) 26 ;
: HALT ( -- ) -1 34 ! ;                 \ the STOP register ($22): the NEXT loop checks it after every step
: SP! ( n -- ) 12 ! ;                   \ set the data stack depth in bytes: 0 SP! empties it
