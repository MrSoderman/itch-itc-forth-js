: ERRBUF ( -- c-addr ) 61184 ;          \ $EF00: room for a message built at run time
: PLACE ( a n c-addr -- ) 2DUP C! 1+ SWAP MOVE ;                           \ store a n as a counted string
: +PLACE ( a n c-addr -- ) DUP >R COUNT + SWAP DUP R@ C@ + R> C! MOVE ;    \ append a n to one
: ERROR ( c-addr -- ) MSG ! HALT ;
: (ABORT") ( f -- ) R> DUP COUNT + >R SWAP IF ERROR THEN DROP ;   \ the message is inline, as with (S")
: ABORT" ( f "ccc<quote>" -- ) ['] (ABORT") , 34 PARSE S, ; IMMEDIATE
: (ABORT) ( -- ) 0 MSG ! 0 SP! 0 CSP ! 0 CFP ! 2 CXP ! ;   \ empty the data, compile and context stacks, forget the error
: ABORT ( -- ) (ABORT) HALT ;              \ ( QUIT is always entered with an empty return stack )
: UNKNOWN ( c-addr -- ) S" UNKNOWN WORD: " ERRBUF PLACE COUNT ERRBUF +PLACE ERRBUF ERROR ;

\ ── 22 · the outer interpreter: context frames of (recognizer, action) pairs ─────────────────────
\ A RECOGNIZER only recognizes:  ( c-addr -- data -1 | c-addr 0 )  "mine, and here is what I found".
\ An ACTION only acts on it:  ( data -- )  run it, compile it, leave it, compile it as a literal.
\ A CONTEXT FRAME is a table: how many pairs, then the pairs [recognizer][action], tried in order.
\ The top context's mode ( 0 interpreting, 1 compiling, 2 compiling DOES> code, 3 and 4 the same
\ for another space: the tether sets their frame ) picks the frame,
\ so how a token is treated is never written in the token's header.
: (REC-IN) ( c-addr wl -- xt -1 | c-addr 0 ) >R DUP COUNT R> FIND-IN ?DUP IF NIP -1 ELSE 0 THEN ;
: REC-COMMON ( c-addr -- xt -1 | c-addr 0 ) COMMON-WORDS (REC-IN) ;
: REC-COMPILER ( c-addr -- xt -1 | c-addr 0 ) COMPILER-WORDS (REC-IN) ;
: REC-FORTH ( c-addr -- xt -1 | c-addr 0 ) FORTH-WORDS (REC-IN) ;
: REC-NUMBER ( c-addr -- n -1 | c-addr 0 ) DUP NUMBER? IF NIP -1 ELSE 0 THEN ;
\ A STRING is a token that starts with " : the text up to the next " , spaces and all. WORD has upper-
\ cased the token, so the recognizer steps >IN back to just after its " and PARSEs the source from
\ there: "Hello, world" keeps its case. Interpreting it leaves a n ( in the source, as S" does );
\ compiling it lays (S") and the string ( SLITERAL ). Its data is two cells: RECOGNIZE passes any number.
: REC-STRING ( c-addr -- a n -1 | c-addr 0 )
  DUP 1+ C@ 34 <> IF 0 EXIT THEN                       \ not a " token
  >IN @ DUP SRC @ + 1- C@ 32 = +                       \ where the token ends ( before WORD's delimiter )
  OVER C@ - 1+ >IN !  DROP 34 PARSE -1 ;               \ just after its " : the text up to the next "
CREATE INTERPRETING-FRAME  4 ,  ' REC-COMMON , ' EXECUTE ,   ' REC-FORTH , ' EXECUTE ,
                                ' REC-STRING , ' NOOP ,      ' REC-NUMBER , ' NOOP ,     \ a string, a number: leave it
CREATE COMPILING-FRAME     5 ,  ' REC-COMMON , ' EXECUTE ,   ' REC-COMPILER , ' EXECUTE ,
                                ' REC-FORTH , ' , ,          ' REC-STRING , ' SLITERAL ,   ' REC-NUMBER , ' LITERAL ,
CREATE MODE-FRAMES  INTERPRETING-FRAME , COMPILING-FRAME , COMPILING-FRAME , COMPILING-FRAME , COMPILING-FRAME ,   \ modes 0-4
: ACTIVE-FRAME ( -- a ) MODE 2 * MODE-FRAMES + @ ;
\ RECOGNIZE only finds: the data and its action. INTERPRET runs the action in its own loop, so a
\ word typed at the prompt meets the return stack exactly as it would without recognizers.
: RECOGNIZE ( c-addr -- data action | c-addr 0 ) ACTIVE-FRAME DUP @ >R 2 +   \ ( c-addr pair )  R: pairs left
  BEGIN R@ WHILE
    >R R@ @ EXECUTE IF R> 2 + @ R> DROP EXIT THEN               \ mine: what it found, and the action
    R> 4 + R> 1- >R                                              \ not mine: the next pair
  REPEAT DROP R> DROP 0 ;                                        \ nobody's
: INTERPRET ( -- ) BEGIN 32 WORD DUP C@ WHILE                     \ until the line is used up
    RECOGNIZE ?DUP IF EXECUTE ELSE UNKNOWN THEN
  REPEAT DROP ;
\ EVALUATE: save the input source on the return stack, interpret the string, restore
: EVALUATE ( a n -- ) SRC @ >R #TIB @ >R >IN @ >R     \ keep where we are reading now
  #TIB ! SRC ! 0 >IN ! INTERPRET                       \ read the string instead
  R> >IN ! R> #TIB ! R> SRC ! ;                        \ and carry on where we were

\ ── 23 · QUIT: the loop the terminal talks to ─────────────────────────────────────────────────────
\ The terminal copies your text to RAM at $8000 ( TXT = next line, TXTEND = the end ) and
\ enters QUIT. REFILL frames the next line where it lies: SRC = its start, #TIB = its length.
: LINE ( -- a ) 28 ;                    \ line number, for error messages
: TXT ( -- a ) 30 ;
: TXTEND ( -- a ) 32 ;
: REFILL ( -- f ) TXT @ DUP TXTEND @ U< 0= IF DROP 0 EXIT THEN          \ no text left: false
  DUP SRC ! BEGIN DUP TXTEND @ U< WHILE DUP C@ 10 <> WHILE 1+ REPEAT THEN   \ find the line's end
  DUP SRC @ - #TIB ! 1+ TXT ! 0 >IN ! 1 LINE +! -1 ;                    \ frame it; step past the newline
: QUIT ( -- ) MSG @ IF (ABORT) THEN BEGIN REFILL WHILE INTERPRET REPEAT ;   \ clean up after an error, then read
\ The system's entry points, for whoever runs it ( the page's terminal, a ROM ): two vector cells in the
\ register page, as a 6502 finds its reset vector at $FFFC. The machine enters the word in QUIT-VECTOR for
\ every text it is given, and the one in ABORT-VECTOR to clean up. 0 means: no system loaded yet.
: QUIT-VECTOR ( -- a ) 56 ;                     \ $38
: ABORT-VECTOR ( -- a ) 58 ;                    \ $3A
' QUIT QUIT-VECTOR !  ' ABORT ABORT-VECTOR !

\ ── 24 · MARKER and ANEW: give memory back ────────────────────────────────────────────────────────
\ MARKER name records HERE, LATEST, the FORGETTING hook and the three wordlists as they were just before name. Running
\ name puts them back: name and everything made after it are gone. A marker can only forget what
\ is newer than itself, so the system below it is always safe. Before the memory is given back,
\ what still points into it lets go: FORGETTING runs (modules hook their own cleanup onto it: the
\ motors unlink theirs), then every deferred word aimed into it is aimed at NOOP. HERE and LATEST
\ move last, so a VBL that comes in the middle still finds everything whole.
DEFER FORGETTING ( a -- a )                     \ a hook calls the one before it, then does its part
: (UNAIM) ( w -- )                              \ a deferred word ( DEFER's family, via lineage )
  DUP ['] DEFER IS-A? IF >BODY DUP @ SOUGHT @ U< IF DROP     \   aimed below here: it keeps its aim
  ELSE ['] NOOP SWAP ! THEN ELSE DROP THEN ;                  \   aimed into the forgotten part: NOOP
: (FORGET) ( a -- )                             \ a: the marker's data  here latest hook common compiler forth
  OPEN? ABORT" MARKER: finish the definition first"
  DUP @ FORGETTING DROP                         \ the modules first, while everything is still there
  DUP @ SOUGHT ! ['] (UNAIM) EACH-WORD          \ then every deferred word aimed into it
  DUP 6 + @ COMMON-WORDS !  DUP 8 + @ COMPILER-WORDS !  DUP 10 + @ FORTH-WORDS !   \ the wordlists as they were
  DUP 4 + @ ['] FORGETTING >BODY !              \ and the hook, with the modules' cleanup
  DUP 2 + @ LATEST !  @ DP ! ;                  \ HERE last
: MARKER ( "name" -- ) OPEN? ABORT" MARKER: not inside a definition"
  FORTH-WORDS @ COMPILER-WORDS @ COMMON-WORDS @ ['] FORGETTING >BODY @ LATEST @ HERE   \ ( the first , stores HERE )
  CREATE , , , , , ,  DOES> (FORGET) ;
: ANEW ( "name" -- )                            \ MARKER, but first run an older marker of that name
  >IN @ 32 WORD FIND IF DUP ['] MARKER IS-A? IF EXECUTE ELSE DROP THEN ELSE DROP THEN >IN ! MARKER ;
</script>

<!-- ═══ 2b · NUMBERS: base switching and number output, as one module ═════════════════════════════
     Needs: the core's BASE (the kernel cell at $10, boot sets it to 10) and the UM/MOD primitive.
     Number input (NUMBER?) is core: the interpreter needs it. With this module left out, input stays decimal.
     Toggle: remove "forth-numbers" from BOOT in the terminal script (you lose . U. HEX DECIMAL, and SEE). -->
<script type="text/forth" id="forth-numbers">
\ ── base: BASE is a kernel cell; these switch it ──────────────────────────────────────────────────
: DECIMAL ( -- ) 10 BASE ! ;
: HEX ( -- ) 16 BASE ! ;

\ ── output: U/MOD peels off the lowest digit; RECURSE prints the higher ones first ────────────────
: U/MOD ( u1 u2 -- r q ) 0 SWAP UM/MOD ;          \ UM/MOD divides a 32-bit number: high cell 0
: DIGIT ( n -- c ) DUP 9 > IF 7 + THEN 48 + ;     \ 0-9 → '0'-'9', 10-35 → 'A'-'Z'
: (U.) ( u -- ) BASE @ U/MOD ?DUP IF RECURSE THEN DIGIT EMIT ;   \ the digits alone
: (.) ( n -- ) DUP 0< IF 45 EMIT NEGATE THEN (U.) ;  \ a '-', then the magnitude ( -32768 NEGATE is 32768 unsigned )
\ . and U. print a number and then a space, as in fig-Forth, Forth-79 and F83: 1 2 3 . . . shows 3 2 1.
\ (.) and (U.) print the digits alone, for output laid out by hand ( .S SEE: <3>, ->2310, native #4 ).
: U. ( u -- ) (U.) SPACE ;
: . ( n -- ) (.) SPACE ;
</script>

<!-- ═══ 2c · TOOLS: SEE, the decompiler, in Forth ═════════════════════════════════════════════════
     Needs: the numbers module (SEE prints with . and U.).
     Toggle: remove "forth-tools" from BOOT in the terminal script. -->
<script type="text/forth" id="forth-tools">
\ ── walking a thread: one cell at a time, each printed after a space ──────────────────────────────
\ A thread is cells of xts. Four of them carry data inline: LIT n, (S") and (ABORT") a string,
\ BRANCH and 0BRANCH a target. An EXIT is the end unless a forward branch jumps past it: FAR
\ remembers the furthest target seen.
VARIABLE FOUND
: (IS-IT) ( x -- ) SOUGHT @ = IF -1 FOUND ! THEN ;
: HEADER? ( a -- f ) SOUGHT ! 0 FOUND ! ['] (IS-IT) EACH-WORD FOUND @ ;   \ is a a word, in any wordlist?
: .NAME ( xt -- ) DUP NAME>STRING ?DUP IF TYPE DROP ELSE 2DROP ." :NONAME" THEN ;
VARIABLE FAR   \ the furthest forward branch so far: an EXIT before it is not the end
: .LIT ( a -- a' ) DUP @ DUP 0> OVER HEADER? AND IF ." ['] " .NAME ELSE (.) THEN 2 + ;      \ a number, or ['] word
: .TEXT ( a -- a' ) SPACE DUP COUNT TYPE 34 EMIT COUNT + ;                 \ an inline counted string, closed by "
: .STR ( a -- a' ) DUP COUNT + @ ['] TYPE =           \ an inline string: is TYPE compiled after it?
  IF 46 EMIT 34 EMIT .TEXT 2 + ELSE 83 EMIT 34 EMIT .TEXT THEN ;   \ yes: ." ( skip the TYPE too ), no: S"
: .BRANCH ( a xt -- a' ) .NAME ." ->" DUP @ DUP (U.) FAR @ MAX FAR ! 2 + ;
: .NESTED ( a -- a' ) ." ( nested : " DUP 4 + .NAME ."  )" @ ;             \ BRANCH over a header: a nested word
: (CREATE)? ( a -- f ) @ ['] (CREATE) = ;   \ CREATE compiles  LIT xt (CREATE)  or  SELF (CREATE): show it as CREATE
: .CELL ( a -- a' f ) DUP @ SWAP 2 + SWAP SPACE                          \ ( a' xt )  f = the thread ended
  DUP ['] LIT = IF OVER 2 + (CREATE)? IF DROP 4 + ." CREATE" 0 EXIT THEN THEN
  DUP ['] SELF = IF OVER (CREATE)? IF DROP 2 + ." CREATE" 0 EXIT THEN THEN
  DUP ['] LIT = IF DROP .LIT 0 EXIT THEN
  DUP ['] (S") = IF DROP .STR 0 EXIT THEN
  DUP ['] (ABORT") = IF DROP ." ABORT" 34 EMIT .TEXT 0 EXIT THEN
  DUP HEADER? 0= IF 63 EMIT (U.) -1 EXIT THEN                              \ not a word: ?n, and stop
  DUP ['] BRANCH = IF OVER 4 + HEADER? IF DROP .NESTED 0 EXIT THEN THEN      \ BRANCH <end> PARENT | header
  DUP ['] BRANCH = OVER ['] 0BRANCH = OR IF .BRANCH 0 EXIT THEN
  DUP ['] EXIT = IF OVER FAR @ U> IF DROP 59 EMIT -1 EXIT THEN THEN      \ the real end: ;
  DUP ['] (DOES>) = IF DROP ." DOES>" 0 EXIT THEN
\   DUP ['] (DO) = IF .BRANCH 0 EXIT THEN                                 \ with (DO) on: (DO)->exit
\   DUP ['] (?DO) = IF .BRANCH 0 EXIT THEN                                \ with (?DO) on
  .NAME 0 ;
: .THREAD ( a -- ) 0 FAR ! BEGIN .CELL UNTIL DROP ;

\ ── SEE: one printer per KIND, picked from a table by the KIND byte ───────────────────────────────
: SEE-CODE ( xt -- ) ." CODE " DUP .NAME ."  ( native #" >CFA 1+ C@ (U.) ."  )" ;
\ .LINEAGE: made by …, following PARENT through data words up to the defining word that started it
: .LINEAGE ( xt -- ) PARENT BEGIN DUP WHILE           \ its maker …
    DUP .NAME DUP >CFA C@ 2 = WHILE ."  <- " PARENT    \ … a data word: on up its line
  REPEAT THEN DROP ;                                   \ a defining word, or the end: stop
: PLAIN? ( xt -- f ) PARENT DUP 0= OVER >CFA C@ 0= OR OVER ['] : = OR SWAP ['] :NONAME = OR ;   \ made the usual way
: SEE-COLON ( xt -- ) ." : " DUP .NAME
  DUP PLAIN? 0= IF ."  ( made by " DUP .LINEAGE ."  )" THEN   \ a clone says whose
  >CFA 1+ .THREAD ;
: .VALUE ( n -- ) DUP 0> OVER HEADER? AND IF ." ' " .NAME ELSE (.) THEN ;   \ a number, or ' word for an xt
: (CHILD) ( x -- ) DUP PARENT SOUGHT @ = IF .NAME SPACE ELSE DROP THEN ;
: CHILDREN ( xt -- ) SOUGHT ! ['] (CHILD) EACH-WORD ;   \ the words it made
\ a data word: its lineage, what it holds, and its DOES> code
: SEE-CREATE ( xt -- ) ." CREATE " DUP .NAME ."  ( "
  DUP PARENT IF ." made by " DUP .LINEAGE ." , " THEN
  ." holds " DUP >BODY @ .VALUE ."  )" >ACTION @ ?DUP IF ."  DOES>" .THREAD THEN ;
CREATE SEERS ' SEE-CODE , ' SEE-COLON , ' SEE-CREATE ,     \ indexed by KIND 0-2
: SEE ( "name" -- ) 32 WORD FIND DUP 0= ABORT" SEE: word not found" DROP
  DUP DUP >CFA C@ 2 * SEERS + @ EXECUTE DUP COMPILER-WORDS IN-LIST? IF ."  IMMEDIATE" THEN COMMON-WORDS IN-LIST? IF ."  ALWAYS" THEN CR ;

\ ── .S: the data stack, bottom first, without changing it:  <3> 1 2 3 ─────────────────────────────
\ The stack is RAM from $04C0 up, so .S just reads it: cell i is at 1216 + 2i.
: .S ( -- ) 60 EMIT DEPTH (U.) 62 EMIT                   \ <depth>
  DEPTH 0 BEGIN 2DUP > WHILE SPACE DUP 2 * 1216 + @ (.) 1+ REPEAT   \ then cell 0, 1, … oldest first
  2DROP SPACE ;
</script>

<!-- ═══ 2d · GRAPHICS: the video chip's sprites and the 60 Hz VBL vector ══════════════════════════
     The screen (320×200, colours $RGB: one hex digit per channel, $F80 is orange) is written with the
     video chip's primitives CLS PLOT POINT; these words add the sprites and the frame interrupt. Sprites: 8 hardware sprites, 64×64, drawn by the chip over the screen
     every frame from registers in RAM; their images are 8 patterns written with SPLOT (colour 0 is
     transparent). Sprite 0 is drawn on top.
     Toggle: remove "forth-graphics" from BOOT in the terminal script (the primitives stay). -->
<script type="text/forth" id="forth-graphics">
\ ── sprite registers: 8 sprites × 4 cells at $F000:  X  Y  PATTERN  ON ────────────────────────────
: SPRITES ( -- a ) 61440 ;                          \ $F000  8 sprites x 4 cells
: SPRITE ( n -- a ) 8 * SPRITES + ;                 \ sprite n's registers; X and Y may be off screen
: SPRITE-AT ( x y n -- ) SPRITE >R R@ 2 + ! R> ! ;  \ move it: the chip shows it there next frame
: SHOW ( pattern n -- ) SPRITE SWAP OVER 4 + ! 6 + -1 SWAP ! ;   \ pick its image and switch it on
: HIDE ( n -- ) SPRITE 6 + 0 SWAP ! ;

\ ── vertical blank ────────────────────────────────────────────────────────────────────────────────
\ Once per displayed frame (60 times a second, from the screen refresh, not a timer) the chip adds
\ 1 to FRAMES and runs VBL, like an interrupt. Aim it with IS; it must leave the stacks as it found
\ them, and be quick: the next frame waits for it.   ' MY-FRAME IS VBL   ' NOOP IS VBL
: FRAMES ( -- a ) 36 ;
: VBL-VECTOR ( -- a ) 40 ;                          \ $28: the chip's interrupt vector, like the 6502's IRQ vector
DEFER VBL  ' VBL VBL-VECTOR !                       \ the interrupt runs VBL; aim VBL with IS

\ ── the pointer chip: the mouse is point 0, fingers take points 0-3 while they touch ──────────────
: POINTERS ( -- a ) 61512 ;                         \ $F048  4 points x 3 cells
: (POINTER) ( n -- a ) 6 * POINTERS + ;             \ point n's registers: X Y DOWN
: POINTER ( n -- x y ) (POINTER) DUP @ SWAP 2 + @ ; \ where it is, in screen pixels
: PRESSED? ( n -- f ) (POINTER) 4 + @ ;             \ is that button or finger down?

\ ── lines: Bresenham, in whole numbers only ───────────────────────────────────────────────────────
\ Walk from x0,y0 to x1,y1 one pixel at a time, as many steps as the longer side. DX is the
\ distance across and DY minus the distance down; ERR adds them up and decides, at every step,
\ whether to move across, down, or both, so the line never strays half a pixel from the true one.
VARIABLE LX  VARIABLE LY  VARIABLE DX  VARIABLE DY  VARIABLE SX  VARIABLE SY  VARIABLE ERR  VARIABLE HUE
: DIR ( n -- 1|-1 ) 0< IF -1 ELSE 1 THEN ;
: LINE ( x0 y0 x1 y1 rgb -- ) HUE ! >R >R 2DUP LY ! LX !        \ ( x0 y0 )  R: y1 x1
  R> ROT - DUP DIR SX ! ABS DX !                                 \ across
  R> SWAP - DUP DIR SY ! ABS NEGATE DY !                         \ down ( negative )
  DX @ DY @ + ERR !  DX @ DY @ NEGATE MAX 1+ BEGIN               \ ( pixels left )
    LX @ LY @ HUE @ PLOT
    ERR @ DUP + DUP DY @ < 0= IF DY @ ERR +! SX @ LX +! THEN     \ time to move across
                    DX @ > 0= IF DX @ ERR +! SY @ LY +! THEN     \ time to move down
  1- DUP 0= UNTIL DROP ;
</script>

<!-- ═══ 2e · MOTORS: small background workers, run one after another on every frame ═══════════════
  A motor is an actor with one job, done once per frame by the VBL interrupt: add a velocity to a
  position, step through a table, keep a value inside limits, copy a block, run a hook. Its operands
  are ADDRESSES, so motors never talk on the stack: they are wired together through RAM cells, and
  build like LEGO — a PATH writes a velocity, an ADDER adds it to a sprite's X, a LIMITER keeps X on
  screen. The foreground program is left free.

  One record per motor, 11 cells, laid down in the dictionary:
     +0 LINK   the next motor (0 = last). At offset 0, so a motor's address is also a link cell.
     +2 ACT    its behaviour: ADD LIMIT PATH-STEP MOVE-STEP CODE-STEP (any word, really)
     +4 FLAGS  RUN (it works) KILL (remove it) BOUNCE WRAP ONCE (details for LIMIT and PATH)
     +6 COUNT  frames left on its timer, 0 = no timer
     +8 CDFLAGS  2 bytes: +8 the flags to TOGGLE when COUNT runs out, +9 COUNT again (0 = once)
    +10 BEFORE +12 AFTER   hooks, run around the job ( motor -- ), 0 = none
    +14 A  +16 B  +18 C  +20 D   operands; what they mean depends on the job, but A is always
                                 what it works on: the cell it writes, or the word it runs
  While a motor works, its address is also in the register ME ($26), like A0 on a 68000: a hook or a
  job written as a primitive reads it from there; Forth hooks get it on the stack as well.

  The timer needs no IF in your program: when COUNT runs out, the CDFLAGS bits are flipped. RUN
  flipped on starts a paused motor, KILL removes one, and a reload repeats it — a CODER that pauses
  itself and is woken by its own timer fires every N frames.

  The builders leave the motor's address; name it with CONSTANT to make the motor one word:
     vx x ADDER CONSTANT MOVE-X        MOVE-X PAUSE   MOVE-X START   MOVE-X KILL
  Motors run from the VBL vector (this module aims it at RUN-MOTORS). Your own per-frame code can
  be a motor too: ' MY-WORD CODER.
════════════════════════════════════════════════════════════════════════════════════════════════ -->
<script type="text/forth" id="forth-motors">
\ ── the record ────────────────────────────────────────────────────────────────────────────────────
\ A motor is a record of 11 cells; FIELD makes the words that step into it.
: FIELD ( offset "name" -- ) CREATE , DOES> @ + ;   \ a word that adds its offset to an address
2 FIELD >ACT   4 FIELD >FLAGS   6 FIELD >COUNT   8 FIELD >CD   10 FIELD >BEFORE   12 FIELD >AFTER
14 FIELD >A   16 FIELD >B   18 FIELD >C   20 FIELD >D
: F-RUN ( -- bit ) 1 ;   : F-KILL ( -- bit ) 2 ;   : F-BOUNCE ( -- bit ) 4 ;
: F-WRAP ( -- bit ) 8 ;  : F-ONCE ( -- bit ) 16 ;
: ME ( -- a ) 38 ;                                  \ register $26: the motor at work
VARIABLE MOTORS                                     \ the first motor; they run in the order they were made

\ ── flags, the timer, the hooks ───────────────────────────────────────────────────────────────────
\ Switch a motor on and off, give it a timer, hang your own code before or after its job.
: FLAG+ ( bits m -- ) >FLAGS DUP @ ROT OR SWAP ! ;
: FLAG- ( bits m -- ) >FLAGS DUP @ ROT INVERT AND SWAP ! ;
: FLAG? ( bits m -- f ) >FLAGS @ AND ;
: START ( m -- ) F-RUN SWAP FLAG+ ;
: PAUSE ( m -- ) F-RUN SWAP FLAG- ;
: KILL ( m -- ) F-KILL SWAP FLAG+ ;                 \ it leaves the list at the end of this frame
: BOUNCES ( m -- ) F-BOUNCE SWAP FLAG+ ;
: WRAPS ( m -- ) F-WRAP SWAP FLAG+ ;
: ONCE ( m -- ) F-ONCE SWAP FLAG+ ;
: TIMER ( frames toggle reload m -- ) >R R@ >CD 1+ C! R@ >CD C! R> >COUNT ! ;   \ toggle and reload: a byte each
: BEFORE ( xt m -- ) >BEFORE ! ;
: AFTER ( xt m -- ) >AFTER ! ;

\ ── the five jobs. Each reads its motor from ME: nothing arrives on the stack ─────────────────────
: MINE ( -- m ) ME @ ;
\ ADDER: [A] += [B] — position += velocity, velocity += acceleration, score += points …
: ADD ( -- ) MINE >B @ @ MINE >A @ +! ;
\ LIMITER: keep [A] within B..C. Past a limit it is put on that limit, or with WRAP on the other
\ one; with BOUNCE the cell at D (a velocity) is negated as well.
: LANDS ( v -- ) MINE >A @ ! MINE F-BOUNCE OVER FLAG? IF >D @ DUP @ NEGATE SWAP ! ELSE DROP THEN ;
: LIMIT ( -- ) MINE >A @ @
  DUP MINE >B @ < IF DROP MINE F-WRAP OVER FLAG? IF >C ELSE >B THEN @ LANDS EXIT THEN
  MINE >C @ > IF MINE F-WRAP OVER FLAG? IF >B ELSE >C THEN @ LANDS THEN ;
\ PATH: every D frames, [A] := the next cell of the table at B ( [n] then n cells ); C is the
\ position. At the end it starts over, or with ONCE it stops (RUN off).
: PATH-STEP ( -- ) FRAMES @ MINE >D @ MOD IF EXIT THEN
  MINE >C @ DUP 2 * MINE >B @ + 2 + @ MINE >A @ !
  1+ DUP MINE >B @ @ = IF DROP 0 F-ONCE MINE FLAG? IF MINE PAUSE THEN THEN MINE >C ! ;
\ MOVER: copy C bytes from B to A, every frame; B = 0 fills A with zeros instead
: MOVE-STEP ( -- ) MINE >B @ ?DUP IF MINE >A @ MINE >C @ MOVE ELSE MINE >A @ MINE >C @ 0 FILL THEN ;
\ CODER: run the word in A with the motor on the stack ( m -- ): your own code, safely inside the frame
: CODE-STEP ( -- ) MINE DUP >A @ EXECUTE ;

\ ── building motors: lay a record, link it at the end of the list, RUN it ─────────────────────────
: MOTOR ( a b c d act -- m ) HERE >R  0 , , F-RUN , 0 , 0 , 0 , 0 ,
  HERE 6 + ! HERE 4 + ! HERE 2 + ! HERE ! 8 ALLOT         \ A B C D ( D was on top )
  MOTORS BEGIN DUP @ WHILE @ REPEAT R@ SWAP !  R> ;       \ the last LINK now points at it
: ADDER ( dst src -- m ) 0 0 ['] ADD MOTOR ;
: LIMITER ( a min max velocity -- m ) ['] LIMIT MOTOR ;
: PATH ( a table every -- m ) 1 MAX 0 SWAP ['] PATH-STEP MOTOR ;
: MOVER ( dst src n -- m ) 0 ['] MOVE-STEP MOTOR ;
: CODER ( xt -- m ) 0 0 0 ['] CODE-STEP MOTOR ;

\ ── the engine: once per frame, every motor in turn ───────────────────────────────────────────────
: HOOK ( m cell -- m ) @ ?DUP IF OVER SWAP EXECUTE THEN ;   \ run a hook, if there is one, with the motor
: TICK ( m -- m )                                   \ its timer: count down; at 0 flip CDFLAGS, reload
  DUP >COUNT @ ?DUP IF 1- 2DUP SWAP >COUNT ! 0= IF
    DUP >CD C@ OVER >FLAGS @ XOR OVER >FLAGS !  DUP >CD 1+ C@ OVER >COUNT ! THEN THEN ;
: WORK ( m -- ) DUP ME !
  F-RUN OVER FLAG? IF DUP >BEFORE HOOK  DUP ME ! DUP >ACT @ EXECUTE  DUP >AFTER HOOK THEN
  TICK DROP ;
: RUN-MOTORS ( -- ) MOTORS BEGIN DUP @ ?DUP WHILE                 \ ( link motor )
    DUP WORK F-KILL OVER FLAG? IF @ OVER ! ELSE NIP THEN REPEAT DROP ;   \ KILL: unlink it
' RUN-MOTORS IS VBL
\ A MARKER that forgets motors: first unlink every motor that lives in the forgotten part, or works
\ on it: its hooks, and A, which in every job is what it works on (the cell it writes, the word it runs).
: REACH ( m -- a ) DUP DUP >BEFORE @ MAX OVER >AFTER @ MAX  \ the highest address m lives at or uses
  OVER >A @ MAX NIP ;                                       \ ( all below $8000: MAX compares them )
: FORGET-MOTORS ( a -- a ) [ ' FORGETTING >BODY @ , ]      \ the cleanup hooked on before us
  MOTORS BEGIN DUP @ WHILE                                  \ ( a link )
    2DUP @ REACH U> IF @ ELSE DUP @ @ OVER ! THEN REPEAT DROP ;   \ keep it, or unlink it
' FORGET-MOTORS IS FORGETTING
</script>

<!-- ═══ 2f · TIME: the clock chip, waiting, and motors that keep time ═════════════════════════════
     Needs: the clock chip, FRAMES (graphics) and the motors module.
     Toggle: remove "forth-time" from BOOT in the terminal script. -->
<script type="text/forth" id="forth-time">
\ ── the clock chip's registers ────────────────────────────────────────────────────────────────────
\ Each register is a byte; the year is a cell. Forth reads them like any RAM.
: SECONDS ( -- a ) 61536 ;  : MINUTES ( -- a ) 61537 ;  : HOURS ( -- a ) 61538 ;   \ $F060-$F062  bytes
: DAY ( -- a ) 61539 ;      : MONTH ( -- a ) 61540 ;    : YEAR ( -- a ) 61542 ;    \ $F063 $F064 bytes, $F066 a cell
: TIME&DATE ( -- sec min hour day month year )
  SECONDS C@ MINUTES C@ HOURS C@ DAY C@ MONTH C@ YEAR @ ;
: NOW ( -- sec minute-of-day ) SECONDS C@ HOURS C@ 60 * MINUTES C@ + ;   \ minutes since midnight: 0-1439

\ ── waiting: sleep frame by frame ( 60 a second ) until FRAMES reaches the goal ───────────────────
: MS ( n -- ) DUP 50 / 3 * SWAP 50 MOD 3 * 50 / +       \ n milliseconds = n x 3/50 frames, without overflow
  FRAMES @ + BEGIN DUP FRAMES @ - 0> WHILE WAIT REPEAT DROP ;

\ ── motors that keep time. xt is ( m -- ), like a CODER's job ─────────────────────────────────────
\ EVERY and LATER are nothing new: a paused CODER, woken by its own timer after n frames. EVERY's
\ AFTER hook pauses it again (and the timer reloads), LATER's kills it. So an EVERY rests paused
\ between its turns: stop it with KILL.
: EVERY ( xt n -- m ) SWAP CODER >R  R@ PAUSE  ['] PAUSE R@ AFTER  F-RUN OVER R@ TIMER  R> ;
: LATER ( xt n -- m ) SWAP CODER >R  R@ PAUSE  ['] KILL R@ AFTER  F-RUN 0 R@ TIMER  R> ;
\ ALARM: run xt once, the next time the clock reaches h:m:s. A = xt, B = minute of the day, C = the
\ second, D = armed: it arms once the time is not yet due, so an alarm set for a time already gone
\ today rings tomorrow.
: DUE? ( m -- f ) >R NOW R@ >B @ - ?DUP IF NIP 0> ELSE R@ >C @ - 0< 0= THEN R> DROP ;
: ALARM-STEP ( -- ) MINE DUE? IF MINE >D @ IF MINE DUP >A @ EXECUTE MINE KILL THEN
  ELSE -1 MINE >D ! THEN ;
: ALARM ( xt h m s -- m ) >R SWAP 60 * + R> 0 ['] ALARM-STEP MOTOR ;
</script>

<!-- ═══ 2g · SOUND: words for the sound chip ══════════════════════════════════════════════════════
     Needs: the sound chip ( nothing else: no graphics, no motors ).
     Toggle: remove "forth-sound" from BOOT in the terminal script. -->
<script type="text/forth" id="forth-sound">
\ ── four voices, 8 bytes each: FREQ(cell) VOL WAVE(bytes) ADDR LEN(cells) ─────────────────────────
: VOICES ( -- a ) 61952 ;                           \ $F200
: VOICE ( n -- a ) 8 * VOICES + ;
: SQUARE ( -- wave ) 1 ;  : SAWTOOTH ( -- wave ) 2 ;  : TRIANGLE ( -- wave ) 3 ;
: SINE ( -- wave ) 4 ;    : NOISE ( -- wave ) 5 ;
: TONE ( freq vol wave n -- ) VOICE >R R@ 3 + C! R@ 2 + C! R> ! ;        \ sound it, until QUIET
: QUIET ( n -- ) VOICE 0 OVER 2 + C! 0 SWAP 3 + C! ;
\ PLAY: len bytes from a, at rate samples a second: WAVE 6 starts it, and the chip clears it again
: PLAY ( a len rate vol n -- ) VOICE >R R@ 2 + C! R@ ! R@ 6 + ! R@ 4 + ! 6 R> 3 + C! ;
</script>

<!-- ═══ 2h · META: Forth running Forth ═════════════════════════════════════════════════════════
     A second inner interpreter, written in Forth: it reads a word's thread with its own IP and its
     own return stack, one step at a time, as the kernel's NEXT does. META runs a word on it; TRACE
     shows every step. Needs: TOOLS ( .NAME .S ).
     Toggle: remove "forth-meta" from BOOT in the terminal script. -->
<script type="text/forth" id="forth-meta">
\ ── pretend machines: an IP and a return stack of their own, one per level ──────────────────
\ Nothing here touches the real IP or the real return stack, so the interpreter's own calls never
\ tangle with the program it runs. The data stack is shared: the program works on the real one.
\ A machine is 72 bytes: PIP PRP THEIRS MARK, then its return stack. MACHINE points at the one at work.
\ So META can run META: each level gets a machine of its own ( up to four, taken in order: LEVEL ).
VARIABLE MACHINE  VARIABLE LEVEL  CREATE MACHINES 4 72 * ALLOT
: PIP ( -- a ) MACHINE @ ;                     \ the pretend IP: the next cell of the thread
: PRP ( -- a ) MACHINE @ 2 + ;                 \ its return stack's depth, in bytes
: THEIRS ( -- a ) MACHINE @ 4 + ;              \ what the program it runs sees in MACHINE ( see FOR-REAL )
: MARK ( -- a ) MACHINE @ 6 + ;                \ the real return stack's depth when it began
: PRS ( -- a ) MACHINE @ 8 + ;                 \ its return stack, 32 cells
: >PR ( x -- ) PRP @ 64 < 0= ABORT" META: return stack full" PRS PRP @ + !  2 PRP +! ;
: PR> ( -- x ) PRP @ 0= ABORT" META: return stack empty" -2 PRP +!  PRS PRP @ + @ ;
: CELL> ( -- x ) PIP @ @  2 PIP +! ;           \ read the next cell of the thread, step past it
CREATE UNSELF ' (UNSELF) ,                     \ a one-cell thread: where DOES> code returns, as in the kernel

\ ── entering a word: DOCOL and DODOES, in Forth ─────────────────────────────────────────────
: ENTER-COLON ( xt -- ) PIP @ >PR  >CFA 1+ PIP ! ;     \ keep where we are, go into its body
: ENTER-DOES ( xt -- ) DUP >BODY SWAP                   \ ( body xt ): push its data address
  DUP >ACTION @ ?DUP IF                                 \ ( body xt action ): it has DOES> code
    PIP @ >PR  SELF >PR  UNSELF >PR                     \ like DODOES: the way back, the old SELF
    PIP !  42 !                                         \ into the DOES> code; SELF ($2A) := xt
  ELSE DROP THEN ;

\ A primitive of the program runs for real. When the program is itself an interpreter ( META running
\ META ), its code uses MACHINE too: so for that one step MACHINE holds the program's own value, then
\ ours again. To the program, MACHINE is a register of its pretend machine, like its IP.
: FOR-REAL ( xt -- ) MACHINE @ >R  THEIRS @ MACHINE !  EXECUTE  MACHINE @ R@ 4 + !  R> MACHINE ! ;

\ ── one step ────────────────────────────────────────────────────────────────────────────────
\ Nine primitives touch the IP or the return stack; the pretend machine does their work itself.
\ Every other primitive runs for real. (S") (ABORT") (DOES>) R@ need nothing special: they are
\ colon words that reach their inline data with R>, and R> here is the pretend one.
: DISPATCH ( xt -- )                                    \ do one xt, as the kernel's EXECUTE would
  DUP ['] LIT      = IF DROP CELL> EXIT THEN            \ the number is the next cell
  DUP ['] BRANCH   = IF DROP PIP @ @ PIP ! EXIT THEN    \ jump to the next cell's address
  DUP ['] 0BRANCH  = IF DROP IF 2 PIP +! ELSE PIP @ @ PIP ! THEN EXIT THEN
  DUP ['] EXIT     = IF DROP PR> PIP ! EXIT THEN        \ back to the caller
  DUP ['] >R       = IF DROP >PR EXIT THEN
  DUP ['] R>       = IF DROP PR> EXIT THEN
  DUP ['] RP!      = IF DROP PRP ! EXIT THEN
  DUP ['] (UNSELF) = IF DROP PR> 42 ! PR> PIP ! EXIT THEN   \ DOES> code done: SELF back, then return
  DUP ['] EXECUTE  = IF DROP RECURSE EXIT THEN          \ EXECUTE: do the xt on the stack, here too
  DUP >CFA C@ DUP 1 = IF DROP ENTER-COLON EXIT THEN     \ KIND 1: a colon word
  2 = IF ENTER-DOES EXIT THEN                           \ KIND 2: a data word
  FOR-REAL ;                                            \ KIND 0: a primitive, run for real
: STEP ( -- ) CELL> DISPATCH ;

\ ── running a word on it ───────────────────────────────────────────────────────────────────
\ PIP = 0 means "nowhere": the word we run returns there, and the loop stops. Each run takes the next
\ machine; a machine whose MARK is not below ours was left by an error ( nothing is running on it ): it
\ is given back first.
: RP-NOW ( -- n ) 14 @ ;                                \ the real return stack's depth
: GIVE-BACK ( rp -- rp ) BEGIN LEVEL @ WHILE DUP LEVEL @ 1- 72 * MACHINES + 6 + @ > 0= WHILE -1 LEVEL +! REPEAT THEN ;
: MACHINE-ON ( xt rp -- xt ) GIVE-BACK LEVEL @ 4 < 0= ABORT" META: four levels at most"
  MACHINE @  LEVEL @ 72 * MACHINES + MACHINE !  1 LEVEL +!  THEIRS !  MARK !  0 PRP ! 0 PIP ! ;
: MACHINE-OFF ( -- ) THEIRS @ MACHINE !  -1 LEVEL +! ;   \ back to the machine of the level above
: META ( xt -- ) RP-NOW MACHINE-ON SELF >R DISPATCH BEGIN PIP @ WHILE STEP REPEAT R> 42 ! MACHINE-OFF ;
: .STEP ( -- ) PRP @ 2 / BEGIN DUP WHILE SPACE SPACE 1- REPEAT DROP   \ indent: how deep we are
  PIP @ @ DUP ['] LIT = IF DROP PIP @ 2 + @ (.) ELSE .NAME THEN          \ the next word ( a number: LIT n )
  9 EMIT .S CR ;                                                        \ and the stack before it runs
: TRACE ( xt -- ) RP-NOW MACHINE-ON SELF >R DISPATCH BEGIN PIP @ WHILE .STEP STEP REPEAT R> 42 ! MACHINE-OFF ;
</script>
<!-- ═══ 2i · SERIAL: the UART from Forth, and a Forth that serves it ═════════════════════════════
     SEND RECV RX?   a byte down the cord, a byte up it ( each sleeps while it must wait )
     RX-ACCEPT       ACCEPT, from the UART ( it echoes what it keeps, as ACCEPT shows it )
     SERVE           a QUIT that reads its lines from the UART: the target's own, once the cord is cut
     Loaded here ( the tether uses SEND RECV ) and metacompiled into the target. Needs: the UART chip. -->
<script type="text/forth" id="forth-serial">
\ ── the UART's rings, as the keyboard's: HEAD = TAIL is empty; C! keeps 8 bits, so they wrap ───────
: TX-HEAD ( -- a ) 62208 ;                    \ $F300  a byte: where the wire takes the next byte out
: TX-TAIL ( -- a ) 62209 ;                    \ $F301  a byte: where SEND puts the next byte
: RX-HEAD ( -- a ) 62210 ;                    \ $F302  a byte: where RECV takes the next byte
: RX-TAIL ( -- a ) 62211 ;                    \ $F303  a byte: where the wire puts the next byte in
: TX-RING ( -- a ) 62464 ;                    \ $F400  256 bytes going out
: RX-RING ( -- a ) 62720 ;                    \ $F500  256 bytes coming in
: SEND ( c -- ) BEGIN TX-TAIL C@ 1+ 255 AND TX-HEAD C@ = WHILE WAIT REPEAT   \ full: sleep a frame
  TX-TAIL C@ TX-RING + C!  TX-TAIL C@ 1+ TX-TAIL C! ;                          \ the byte first, then TAIL
: RX? ( -- f ) RX-HEAD C@ RX-TAIL C@ <> ;     \ is a byte waiting?
: RECV ( -- c ) BEGIN RX? 0= WHILE WAIT REPEAT                               \ none yet: sleep a frame
  RX-HEAD C@ DUP RX-RING + C@ SWAP 1+ RX-HEAD C! ;

\ ── a line from the UART: ACCEPT, with RECV where ACCEPT has KEY ──────────────────────────────────
: RX-ACCEPT ( a n -- n' ) >R 0 BEGIN RECV DUP 13 <> WHILE        \ ( a i c )  R: n
    DUP 8 = IF DROP DUP IF 1- 8 EMIT THEN                         \ backspace
    ELSE OVER R@ < 0= OVER 32 < OR IF DROP                        \ no room, or a control key: ignore it
    ELSE >R 2DUP + R@ SWAP C! 1+ R> EMIT THEN THEN                \ keep it and echo it
  REPEAT DROP R> DROP NIP ;

\ ── SERVE: QUIT for a machine whose terminal is its UART ───────────────────────────────────────
\ A line from the UART into the TIB, INTERPRET it, " ok". An error HALTs the machine; its driver then
\ enters SERVE again ( a reset vector ), which says what went wrong and cleans up first, as QUIT does.
: SERVE ( -- ) MSG @ ?DUP IF ." ? " COUNT TYPE CR (ABORT) THEN
  BEGIN TIB DUP 1024 RX-ACCEPT #TIB ! SRC ! 0 >IN ! SPACE INTERPRET ."  ok" CR AGAIN ;
</script>

<!-- ═══ 2j · TETHER: the host's side of the cord to a target machine ══════════════════════════════
     The target is a second ITCH ( on the page: a Web Worker ) with its primitives and the monitor
     ROM, nothing more. Its RAM is reached one command at a time over the UART: write-through, no
     cache. Its primitives have the same xts as ours ( power-on is the same ), so ' DUP names its
     DUP too.
       SEND RECV        one byte down the cord, one byte up it ( each sleeps while it must wait )
       TC! TC@ T! T@    the target's bytes and cells       TMOVE  our bytes into its RAM
       TCALL            run a target word; its output appears here, its error becomes ours
       >T T> .TS        its data stack
     And a compiler for it:  TARGET : SQ DUP * ; HOST  5 SQ .   prints 25.
       TARGET HOST      where new definitions are built ( CURRENT-SPACE )
       THERE T, T'      the target's HERE, a cell into it, a target xt by name
       TRUN             a target word run as if it were ours: our stack and the rest of our line go
                        there, it runs, its stack, >IN and HERE come back ( a word it makes gets a shadow )
       In target mode the prompt acts on the target: , C, HERE ALLOT ' CREATE VARIABLE build there,
       anything the target has runs there, CONSTANT DEFER IS IMMEDIATE ALWAYS run the target's own.
       IF THEN BEGIN LITERAL RECURSE … are BOOT's own: HERE , PATCH follow the compile frame's space.
       Transition words ( S" ." ABORT" CREATE DOES> POSTPONE OF ; ['] ) lay the target's own words,
       found by name when they run: "(S") is not on the target yet" until it is.
       :NONAME and nested words work there as here.
       METACOMPILING: BOOT NUMBERS TOOLS META read in target mode build the same language there, byte
       for byte the dictionary a headless machine would build by itself ( see test_metacompile ).
       Then  TARGET INTERPRET …  hands the rest of a line to the target's own interpreter, and CUT
       cuts the cord: the target serves its own Forth on its UART ( SERVE ); TERM talks to it.
       TETHER takes it back: its monitor again, and our shadows brought up to date with its words
       ( even if this machine was switched off in between ). TARGET TRUN CUT … work as before.
     Needs: the numbers module ( U/MOD U. . ) and the serial module ( SEND RECV ).
     Toggle: remove "forth-tether" from BOOT in the terminal script. -->
<script type="text/forth" id="forth-tether">
: SEND16 ( n -- ) 256 U/MOD SWAP SEND SEND ;  \ a cell, low byte first ( the 6502's order )
: RECV16 ( -- n ) RECV RECV 256 * + ;
: SENDS ( a n -- ) BEGIN DUP WHILE OVER C@ SEND 1 /STRING REPEAT 2DROP ;   \ n bytes from a

\ ── the monitor's commands: a byte, an address, a length ( see the target's MONITOR ) ───────────
: CMD ( a n c -- ) SEND SWAP SEND16 SEND ;
: TC! ( c a -- ) 1 87 CMD SEND ;              \ W a 1 c
: T! ( n a -- ) 2 87 CMD SEND16 ;             \ W a 2 lo hi
: TC@ ( a -- c ) 1 82 CMD RECV ;              \ R a 1: one byte back
: T@ ( a -- n ) 2 82 CMD RECV16 ;             \ R a 2: a cell back
: TMOVE ( a ta n -- ) BEGIN DUP WHILE DUP 240 MIN >R     \ in blocks of 240: a command fits the ring
    OVER R@ 87 CMD ROT DUP R@ SENDS                      \ W ta k, then k bytes from a  ( ta n a )
    R@ + ROT R@ + ROT R> - REPEAT DROP 2DROP ;           \ step all three by k

\ ── running a target word: X xt, then O c … until K ─────────────────────────────────────────────
: RECV+ ( c-addr -- ) RECV OVER COUNT + C!  DUP C@ 1+ SWAP C! ;   \ one byte from the cord onto a counted string
: (TCALL) ( xt -- f ) 88 SEND SEND16                    \ f: it failed ( its message is in ERRBUF )
  BEGIN RECV DUP 79 = WHILE DROP RECV EMIT REPEAT          \ O c: what the target printed
  75 <> ABORT" the cord is out of step"
  RECV DUP IF S" TARGET: " ERRBUF PLACE                    \ K 1 n chars: its error
    RECV BEGIN DUP WHILE ERRBUF RECV+ 1- REPEAT DROP THEN ;   \ ( K 0: it ended well )
: TCALL ( xt -- ) (TCALL) IF ERRBUF ERROR THEN ;          \ its error is ours

\ ── the target's data stack: RAM from $04C0 up, its depth in its SP register ( 12, as ours ) ─────
: >T ( n -- ) 12 T@ DUP 2 + 12 T!  1216 + T! ;
: T> ( -- n ) 12 T@ 2 - DUP 0< ABORT" TARGET STACK UNDERFLOW"  DUP 12 T!  1216 + T@ ;
: .TS ( -- ) 12 T@ 2 / 60 EMIT DUP (U.) 62 EMIT            \ <depth>, then its cells oldest first, as .S
  0 BEGIN 2DUP > WHILE SPACE DUP 2 * 1216 + T@ (.) 1+ REPEAT 2DROP SPACE ;

\ ── reading a block back: R ta k, then k bytes ─────────────────────────────────────────────────
: RECVS ( a n -- ) BEGIN DUP WHILE OVER RECV SWAP C! 1 /STRING REPEAT 2DROP ;   \ n bytes into a
: TREAD ( ta a n -- ) BEGIN DUP WHILE DUP 240 MIN >R     \ its bytes into ours, in blocks of 240
    ROT DUP R@ 82 CMD R@ +  ROT DUP R@ RECVS R@ +        \ R ta k, k bytes into a    ( n ta' a' )
    ROT R> - REPEAT DROP 2DROP ;

\ ══ THE TARGET'S DICTIONARY, built from here ═════════════════════════════════════════════════════
\ Its HERE is kept here as TDP while we build ( no round trip per cell ), and handed back to it
\ before any of its words runs. TREGS is its register block $04…$37 as we last read it.
VARIABLE TDP                                   \ the target's dictionary pointer ( its $0A )
VARIABLE TLINK                                 \ its newest header in its FORTH wordlist ( its $34 )
VARIABLE TLAST                                 \ its LATEST ( its $08 ): a change means it made a word
: THERE ( -- a ) TDP @ ;                       \ the target's HERE
: T, ( x -- ) THERE T! 2 TDP +! ;              \ a cell into the target: write-through, no reply
CREATE TREGS 52 ALLOT                          \ its $04 >IN +2 #TIB +4 LATEST +6 HERE +8 SP … +48 FORTH
: (PULL) ( -- ) 4 TREGS 52 TREAD  TREGS 6 + @ TDP !  TREGS 48 + @ TLINK ! ;   \ read them; take HERE and FORTH
: CONNECT ( -- ) TDP @ 0= IF (PULL) TREGS 4 + @ TLAST ! THEN ;             \ the first time: where is it?

\ The host keeps a SHADOW of each target word: a data word holding the target's xt and whether it
\ acts while compiling ( IMMEDIATE or ALWAYS there ), in a wordlist of its own. The target gets the real header ( PARENT LINK LEN NAME KIND ) in its own RAM.
\ Shadows are built with DP itself: a nested target word's shadow is made while a target word is open.
VARIABLE TARGET-WORDS                          \ the shadows
VARIABLE TARGET-COMPILER                       \ mode 3's own words: ; ['] and the not-yets
VARIABLE TARGET-INTERPRETER                    \ the prompt's own words in target mode: , HERE ' CREATE …
: H, ( x -- ) DP @ ! 2 DP +! ;                     \ a cell into OUR dictionary, whatever is being built
: MAKE-SHADOW ( txt imm? c-addr -- ) DUP C@ 0= IF DROP 2DROP EXIT THEN   \ ( a nameless word gets none )
  0 H,  DP @ >R  TARGET-WORDS @ H,                     \ PARENT 0 | LINK
  DUP C@ 1+ DUP >R DP @ SWAP MOVE R> ALLOT             \ LEN NAME
  2 C, 0 H, SWAP H, H,  R> TARGET-WORDS ! ;            \ KIND 2, ACTION 0, txt, immediate? ; it heads the list
: SHADOW ( txt -- xt | 0 ) TARGET-WORDS @ BEGIN DUP WHILE 2DUP >BODY @ = IF NIP EXIT THEN @ REPEAT NIP ;   \ the newest shadow of a target xt
: T-HEADER ( tparent kind c-addr -- txt ) >R           \ at THERE: PARENT ( a target xt ), then at txt:
  SWAP T,  THERE DUP 0 R@ MAKE-SHADOW  0 T,             \ LINK, set when it is linked ( and the shadow, here )
  R@ THERE R@ C@ 1+ TMOVE  R> C@ 1+ TDP +!              \ LEN NAME, as the name was read
  SWAP THERE TC! 1 TDP +! ;                             \ KIND
: T-LINK ( txt -- ) TLINK @ OVER T!                     \ into its FORTH list, at the head, and its LATEST:
  DUP TLINK !  DUP TLAST !  DUP 52 T!  8 T! ;           \ a colon word when its ; runs ( as ours: promote )

\ ── running a target word as if it were ours: our stack, the rest of our line, its dictionary ────
\ Ship our stack and the unread rest of our line ( into its TIB ) and hand it its HERE; run the word;
\ read back its registers ( how far it read, its HERE, its wordlist heads ) and its stack. Three round
\ trips. So a target word may parse a name from our line. Words it made ( headers at or above where
\ THERE was, at the top of its three lists ) get shadows here; if it forgot some ( a MARKER there:
\ its HERE went down ), their shadows go too.
CREATE TBUF 258 ALLOT                                    \ its stack, or a header ( LINK LEN NAME ), on its way back
VARIABLE TOLD                                            \ headers at or above it are new to us
: THEAD ( h -- h ) DUP TBUF 34 TREAD                     \ a header's LINK LEN NAME in one read …
  TBUF 2 + C@ 31 > IF DUP 2 + TBUF 2 + DUP C@ 1+ TREAD THEN ;   \ … and a second for a longer name
: TURN ( old -- ) DUP >R TARGET-WORDS @                  \ the shadows made since the head was old: turned
  BEGIN DUP R@ <> WHILE DUP @ >R SWAP OVER ! R> REPEAT    \  around ( each LINK to the one before it )
  DROP R> DROP TARGET-WORDS ! ;                          \ ( prev cur ): the last one made heads the list
: NEWS ( h imm? -- ) TARGET-WORDS @ >R >R                \ shadows for a list's headers at or above TOLD:
  BEGIN DUP TOLD @ U< 0= OVER AND WHILE                  \  walked newest first, one read each ( COMMON
    THEAD R@ TBUF 2 + MAKE-SHADOW  TBUF @ REPEAT   \  COMPILER: immediate ), on down its LINK;
  DROP R> DROP R> TURN ;                                 \  then oldest first, as if made one by one
: CATCH-UP ( -- ) TREGS 44 + @ -1 NEWS  TREGS 46 + @ -1 NEWS  TREGS 48 + @ 0 NEWS   \ COMMON COMPILER FORTH
  TREGS 4 + @ TLAST ! ;                                  \ and its LATEST, as we last read it
: PRUNE ( ta -- ) TARGET-WORDS BEGIN DUP @ WHILE          \ drop every shadow of a target word at or above ta
    2DUP @ >BODY @ U> 0= IF DUP @ @ OVER ! ELSE @ THEN REPEAT 2DROP ;
: TRUN ( i*x txt -- j*x ) >R CONNECT
  DEPTH 2 * DUP 12 T!  1216 SWAP 1216 SWAP TMOVE         \ our stack, there
  SRC @ >IN @ + 64 MORE? TMOVE  0 4 T!  MORE? 6 T!  64 24 T!   \ the rest of our line, in its TIB
  THERE DUP TOLD ! 10 T!  R> (TCALL) >R  (PULL)         \ its HERE; run it; its registers back, even if it
  TREGS @ >IN +!                                         \  failed ( its HERE moved on all the same )
  THERE TOLD @ U< IF THERE PRUNE THEN                    \ it forgot words: we forget their names
  CATCH-UP  R> IF ERRBUF ERROR EXIT THEN                 \ words it made get shadows; now its error is ours
  TREGS 8 + @ >R  1216 TBUF R@ TREAD                     \ its stack, into TBUF
  R@ SP!  TBUF 1216 R> MOVE ;                            \ ours becomes it ( MOVE's own cells sit above )

\ ══ TARGET COMPILING: HERE , PATCH go to the target while a target word is built ═════════════════
\ A SPACE TABLE names four words: HERE , PATCH ( the kernel's vectors ) and OPEN ( BOOT's (OPEN) ).
\ While the top compile frame's space is TARGET-SPACE, IF THEN BEGIN LITERAL RECURSE … lay their
\ cells in the target, unchanged: they only ever say HERE , and PATCH.
\ ── recognizers: target words, and the kernel's own words both machines share ─────────────────
: REC-TARGET ( c-addr -- txt -1 | c-addr 0 ) TARGET-WORDS (REC-IN) DUP IF SWAP >BODY @ SWAP THEN ;
\ The kernel's own words ( its primitives and its WORD FIND vectors, made before the devices, below
\ KEND ) are the same on every machine. They are the oldest part of FORTH, so they make a wordlist of
\ their own: its head is the first FORTH header below KEND. Found there, a name means the kernel's
\ word even when ours shadows it ( the motors' field >C shadows the compile stack's >C ).
: KERNEL-HEAD ( -- xt ) FORTH-WORDS @ BEGIN DUP 22 @ U< 0= WHILE @ REPEAT ;   \ the first FORTH header below KEND
VARIABLE KERNEL-WORDS  KERNEL-HEAD KERNEL-WORDS !
: REC-KERNEL ( c-addr -- xt -1 | c-addr 0 ) KERNEL-WORDS (REC-IN) ;
: REC-TCOMPILER ( c-addr -- xt -1 | c-addr 0 ) TARGET-COMPILER (REC-IN) ;
: REC-TIMMEDIATE ( c-addr -- txt -1 | c-addr 0 )         \ a target word that acts while compiling
  DUP TARGET-WORDS (REC-IN) IF DUP >BODY 2 + @ IF NIP >BODY @ -1 EXIT THEN THEN DROP 0 ;
: TARGET? ( -- f ) CURRENT-SPACE @ 0<> ;                  \ are we in target mode?
: REC-TINTERP ( c-addr -- xt -1 | c-addr 0 ) TARGET? IF TARGET-INTERPRETER (REC-IN) ELSE 0 THEN ;
: REC-THERE ( c-addr -- txt -1 | c-addr 0 )              \ in target mode: anything the target has
  TARGET? 0= IF 0 EXIT THEN REC-TARGET ?DUP IF EXIT THEN REC-KERNEL ;
: T' ( "name" -- txt ) 32 WORD REC-TARGET IF EXIT THEN REC-KERNEL IF EXIT THEN UNKNOWN ;   \ a target xt
: TFIND ( a n -- txt | 0 ) TARGET-WORDS FIND-IN DUP IF >BODY @ THEN ;               \ a target word by name
: REMOTE ( txt -- ) POSTPONE LITERAL ['] TRUN , ;        \ compile a call that runs txt on the target

\ ── a target word by name, looked up when it is needed ( the target fills up as we build it ) ────
: NOT-THERE ( a n -- ) ERRBUF PLACE S"  is not on the target yet" ERRBUF +PLACE ERRBUF ERROR ;
: T-XT ( a n -- txt | 0 ) 2DUP TFIND ?DUP IF NIP NIP EXIT THEN KERNEL-WORDS FIND-IN ;   \ a target word or a kernel word
: T-NAMED ( a n -- txt ) 2DUP T-XT ?DUP IF NIP NIP EXIT THEN NOT-THERE ;                  \ … or: not there yet
: TRUN-NAMED ( i*x a n -- j*x ) T-NAMED TRUN ;                         \ run it there
\ A target word's PARENT is the namesake there of the word that made ours: : is its : ( or the
\ kernel's seed : before BOOT has made one ), CREATE its CREATE … as a machine that booted by itself has it.
: >T-XT ( xt -- txt | 0 ) 2 + COUNT T-XT ;             \ our word's namesake there
: T-OPEN ( parent kind c-addr -- ) >R DROP >T-XT >R      \ R: c-addr tparent
  OPEN? IF ['] BRANCH , HERE 0 , ELSE 0 THEN             \ inside another word: it jumps around us ( hole )
  R> 1 R> T-HEADER  SWAP >R CURRENT-SPACE @ SWAP R> >CS  3 MODE! ;   \ a colon header there; open both frames
CREATE TARGET-SPACE  ' THERE , ' T, , ' T! , ' T-OPEN ,    \ HERE , PATCH OPEN
: TARGET ( -- ) CONNECT TARGET-SPACE CURRENT-SPACE ! ;     \ new definitions are built in the target …
: HOST ( -- ) 0 CURRENT-SPACE ! ;                          \ … and here again
: T-CREATE ( tparent "name" -- ) 2 32 WORD T-HEADER T-LINK 0 T, ;  \ a data word there: KIND 2, ACTION 0

: NOT-YET ( "name" -- ) CREATE DOES> DROP SELF 2 + COUNT NOT-THERE ;  \ would lay our xts there: refuse
: FORWARD ( "name" -- ) CREATE DOES> DROP SELF 2 + COUNT TRUN-NAMED ; \ run the target's word of this name
: T-IMMEDIATE? ( txt -- f ) SHADOW DUP IF >BODY 2 + @ THEN ;           \ does it act while compiling, there?
: MARK-IMMEDIATE ( -- ) TLAST @ SHADOW ?DUP IF -1 SWAP >BODY 2 + ! THEN ;   \ its newest word does

\ TRANSITION WORDS lay the target's own words, found by name when they run: T-COMPILE (S") in a
\ definition compiles the name as a string, then (T,NAMED), which lays that word's xt ( SEE shows both ).
: (T,NAMED) ( a n -- ) T-NAMED T, ;                                 \ the target's word of that name, laid there
: T-COMPILE ( "name" -- ) 32 WORD COUNT POSTPONE SLITERAL ['] (T,NAMED) , ; IMMEDIATE   \ the name as a string
: TS, ( a n -- ) 255 MIN DUP THERE TC! 1 TDP +!  THERE OVER TDP +! SWAP TMOVE ;   \ a counted string there
: TSLITERAL ( a n -- ) T-COMPILE (S") TS, ;             \ SLITERAL, there ( a "string" in a target word )

\ ── mode 3's own words ( TARGET-COMPILER, found first while a target word is built ) ────────────
\ Each is the same as BOOT's word of that name, with the target's xts. Mode 4 is target DOES> code.
TARGET-COMPILER CURRENT !
: ; ( -- ) CSP @ CFP @ <> ABORT" ; with an unclosed IF, BEGIN or CASE"
  ['] EXIT T,  CFP @ CS + 2 - @ ?DUP IF THERE SWAP T! THEN   \ nested: the BRANCH around us lands here
  BUILDING (CLOSE)  DUP T-LINK  THERE 10 T!                 \ close both frames; link it there; its HERE
  DUP SHADOW IF DROP THEN ;                                 \ :NONAME ( no shadow ) leaves its xt
: ['] ( "name" -- ) T' ['] LIT T, T, ;                  \ LIT and a target xt
: S" ( "ccc<quote>" -- ) 34 PARSE TSLITERAL ;
: ." ( "ccc<quote>" -- ) 34 PARSE TSLITERAL T-COMPILE TYPE ;
: ABORT" ( "ccc<quote>" -- ) T-COMPILE (ABORT") 34 PARSE TS, ;
: CREATE ( "name" -- ) MODE 4 = IF T-COMPILE SELF ELSE ['] LIT T, BUILDING T, THEN T-COMPILE (CREATE) ;
: DOES> ( -- ) T-COMPILE (DOES>) 4 MODE! ;              \ from here on: compiling its DOES> code
: POSTPONE ( "name" -- ) T' DUP T-IMMEDIATE? IF T, ELSE ['] LIT T, T, T-COMPILE , THEN ;
: OF ( C: -- orig ) T-COMPILE OVER T-COMPILE = POSTPONE IF T-COMPILE DROP ;
FORTH-WORDS CURRENT !

\ ── the prompt's own words in target mode ( TARGET-INTERPRETER, found first ) ───────────────────
\ , C, HERE ALLOT ' CREATE VARIABLE do here exactly what the target's would do there, with no round
\ trip. The rest run the target's own word of that name, or refuse: ours would build HERE.
TARGET-INTERPRETER CURRENT !
: , ( x -- ) T, ;
: C, ( c -- ) THERE TC! 1 TDP +! ;
: HERE ( -- a ) THERE ;
: ALLOT ( n -- ) TDP +! ;
: ' ( "name" -- txt ) T' ;
: CREATE ( "name" -- ) S" CREATE" T-XT T-CREATE ;
: VARIABLE ( "name" -- ) S" VARIABLE" T-XT T-CREATE 0 T, ;
: ] ( -- ) ] ;                                          \ ] is ours: it pops OUR context stack
FORWARD CONSTANT  FORWARD DEFER  FORWARD IS
: IMMEDIATE ( -- ) S" IMMEDIATE" TRUN-NAMED MARK-IMMEDIATE ;   \ relinked there; its shadow knows
: ALWAYS ( -- ) S" ALWAYS" TRUN-NAMED MARK-IMMEDIATE ;
FORTH-WORDS CURRENT !

\ ── the context frames, tethered ( see BOOT's outer interpreter ) ──────────────────────────────
\ Interpreting, host mode: our words first; a word only the target has runs there on our stack.
\ Interpreting, target mode: its prompt words, COMMON, then anything the target has ( run there ),
\ then ours. Compiling here: a target word becomes a REMOTE call. Compiling there ( modes 3 and 4 ): the
\ transition words, then BOOT's compilers ( they only say HERE , PATCH ), then a target word that acts
\ while compiling runs THERE ( on its HERE ), others and the kernel's shared words are laid down with , .
CREATE TETHERED-INTERPRETING  7 ,  ' REC-TINTERP , ' EXECUTE ,  ' REC-COMMON , ' EXECUTE ,  ' REC-THERE , ' TRUN ,
                                   ' REC-FORTH , ' EXECUTE ,    ' REC-TARGET , ' TRUN ,    ' REC-STRING , ' NOOP ,
                                   ' REC-NUMBER , ' NOOP ,
CREATE TETHERED-COMPILING  6 ,  ' REC-COMMON , ' EXECUTE ,  ' REC-COMPILER , ' EXECUTE ,
                                ' REC-FORTH , ' , ,   ' REC-TARGET , ' REMOTE ,   ' REC-STRING , ' SLITERAL ,
                                ' REC-NUMBER , ' LITERAL ,
CREATE TARGET-COMPILING  8 ,  ' REC-TCOMPILER , ' EXECUTE ,  ' REC-COMMON , ' EXECUTE ,  ' REC-COMPILER , ' EXECUTE ,
                              ' REC-TIMMEDIATE , ' TRUN ,   ' REC-TARGET , ' , ,   ' REC-KERNEL , ' , ,
                              ' REC-STRING , ' TSLITERAL ,   ' REC-NUMBER , ' LITERAL ,
TETHERED-INTERPRETING MODE-FRAMES !  TETHERED-COMPILING MODE-FRAMES 2 + !
TETHERED-COMPILING MODE-FRAMES 4 + !  TARGET-COMPILING MODE-FRAMES 6 + !  TARGET-COMPILING MODE-FRAMES 8 + !

\ ── MARKER: shadows made after a marker go with it ( the target keeps its code ) ─────────────────
: (UNSHADOW) ( a wl -- a ) >R R@ @ BEGIN DUP IF 2DUP U< ELSE 0 THEN WHILE @ REPEAT R> ! ;
: FORGET-SHADOWS ( a -- a ) [ ' FORGETTING >BODY @ , ]
  TARGET-WORDS (UNSHADOW) TARGET-COMPILER (UNSHADOW) TARGET-INTERPRETER (UNSHADOW) ;
' FORGET-SHADOWS IS FORGETTING

\ ══ CUTTING THE CORD ═════════════════════════════════════════════════════════════════════════════
\ CUT sends the monitor G SERVE: the target leaves its ROM for good and serves its own Forth on its
\ UART ( after BOOT … SERIAL are metacompiled into it ). T@ TCALL TARGET … wait: its monitor is away until TETHER.
\ TERM makes this machine its terminal: what it sends is shown, our keys are sent ( ESC or STOP: done ).
: CUT ( -- ) 0 12 T!  S" SERVE" T-NAMED 71 SEND SEND16 ;   \ an empty stack, as at power-on; then G SERVE
: TERM ( -- ) BEGIN
    RX? IF RECV EMIT THEN                                \ its bytes: shown
    KEY? IF KEY DUP 27 = IF DROP EXIT THEN SEND THEN     \ our keys: sent ( ESC leaves )
    RX? KEY? OR 0= IF WAIT THEN AGAIN ;                  \ nothing either way: sleep a frame

\ ══ TAKING THE CORD BACK ═══════════════════════════════════════════════════════════════════════
\ TETHER sends EOT: the target's ROM takes its UART back, the word it served frozen where it was,
\ its RAM untouched. Then we learn what it has now. Our newest shadow that is still true ( below its
\ HERE, the same name at its txt ) is where we and its dictionary agree: above it, our shadows go
\ ( words it forgot ) and its headers get new ones ( words typed to it ). A host that was switched
\ off meanwhile knows none: it learns them all, above the kernel.
\ SYNC is the handshake. A served word may have printed anything, and some of it may still be on its
\ way, so we send EOT and then Y with a NONCE, new each time; the monitor answers EOT Y nonce. We read
\ through a 4-byte window until it holds exactly that: every byte before it was the served word's.
\ ( The nonce: a count of syncs, and the frame count, so a host switched off and on again differs too. )
\ A wire overruns as a UART does ( a byte that finds its buffer full is lost ), so the answer may be
\ lost too: after 30 quiet frames we ask again, with a new nonce ( a late answer to the old one no
\ longer matches ).
VARIABLE SYNCS  VARIABLE WAITED  CREATE SYNC-WANT 4 ALLOT  CREATE SYNC-WIN 4 ALLOT
: (ASK) ( -- ) 1 SYNCS +!  SYNCS @ 36 @ 256 * +         \ a new nonce
  4 SYNC-WANT C!  89 SYNC-WANT 1+ C!  DUP SYNC-WANT 2 + !  0 WAITED !   \ the answer we wait for: EOT Y nonce
  4 SEND  89 SEND SEND16 ;                               \ EOT: its monitor is back; Y nonce: prove it
: SYNC ( -- ) 0 SYNC-WIN !  0 SYNC-WIN 2 + !  (ASK)
  BEGIN RX? IF RECV SYNC-WIN 1+ SYNC-WIN 3 MOVE  SYNC-WIN 3 + C!  0 WAITED !   \ one more byte into the window
      ELSE WAIT 1 WAITED +!  WAITED @ 30 > IF (ASK) THEN THEN     \ nothing: after 30 frames, ask again
    SYNC-WIN @ SYNC-WANT @ =  SYNC-WIN 2 + @ SYNC-WANT 2 + @ = AND UNTIL ;   \ all four alike: in step again
: TRUE? ( xt -- f ) DUP >BODY @ DUP THERE U< 0= IF 2DROP 0 EXIT THEN   \ at or above its HERE: forgotten
  THEAD DROP 2 + TBUF 2 + OVER C@ 1+ S= ;                \ its LEN NAME there, as ours?
: SURVIVOR ( -- txt | 0 ) TARGET-WORDS @ BEGIN DUP WHILE DUP TRUE? IF >BODY @ EXIT THEN @ REPEAT ;
: TETHER ( -- ) SYNC                                     \ its monitor, and the cord in step
  (PULL)  SURVIVOR 1+ 22 @ MAX  DUP PRUNE  TOLD !  CATCH-UP ;   \ from there up ( never the kernel ): anew
</script>


<!-- ═══ 4 · DEMOS: programs written in ITCH, not part of the system ═══════════════════════════════
     The selector above the RUN button copies one into the program box. RUN boots a fresh machine
     and runs the box. They are plain Forth source, so nothing in the system depends on them. -->
<script type="text/forth" id="demo-balloons">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  BALLOONS: eight hardware sprites drift up a 320x200 sky, moved 60 times a second by motors.
\  Uses the video chip (CLS PLOT SPLOT), the forth-graphics words (SHOW SPRITE) and forth-motors.
\  Colours are $RGB: one hex digit per channel. A $ in front of a number reads it as hex.
\ ══════════════════════════════════════════════════════════════════════════════════════════════════

\ ── 1. the backdrop: a sky that fades toward the horizon, and green hills ─────────────────────────
\ ROW paints one line of the screen in colour INK. Loops count down to 0 (DUP WHILE):
\ testing for zero is the cheapest test there is.
VARIABLE INK  VARIABLE ROWY
: ROW ( -- ) 320 BEGIN 1- DUP ROWY @ INK @ PLOT DUP WHILE REPEAT DROP ;
\ SKY: rows 0-149. Red rises every 40 rows and green every 12, blue stays full: deep blue at
\ the top, pale near the horizon.  colour = (y/40)*$100 + (y/12)*$10 + $F
: SKY ( -- ) 150 BEGIN 1- DUP ROWY !                   \ rows 149 … 0
    DUP 40 / 256 * OVER 12 / 16 * + 15 + INK !        \ the row's colour, $RGB
  ROW DUP WHILE REPEAT DROP ;
\ HILLS: rows 150-199, a light green strip and then darker grass
: HILLS ( -- ) 200 BEGIN 1- DUP ROWY !                 \ rows 199 … 150
    DUP 158 - 0< IF $4B4 ELSE $282 THEN INK !         \ a light strip on top, then grass
  ROW DUP 150 = UNTIL DROP ;
CLS SKY
HILLS

\ ── 2. a balloon, painted pixel by pixel into a 64x64 sprite pattern ──────────────────────────────
\ For each pixel (PX,PY) PIXEL decides its colour from a few shapes. Colour 0 is transparent,
\ so the sky shows through around the balloon. The numbers are small, so  a b - 0<  does the
\ job of  a b <  more cheaply.
: SQ ( n -- n*n ) DUP * ;
: D2 ( dx dy -- n ) SQ 7 * 8 / SWAP SQ + ;           \ squared distance, squashed a little: a tall ellipse
VARIABLE PX  VARIABLE PY                              \ the pixel being painted
VARIABLE BODY  VARIABLE DARK  VARIABLE SHINE          \ this balloon's three colours
: INSIDE? ( -- f ) PX @ 32 - PY @ 26 - D2 520 - 0< ;          \ the envelope, centred at 32,26
: SHINE? ( -- f ) PX @ 25 - SQ PY @ 17 - SQ + 30 - 0< ;       \ a highlight up and to the left
: RIM? ( -- f ) PX @ 29 - PY @ 23 - D2 430 - 0< 0= ;          \ outside a smaller, shifted ellipse: the shaded crescent
: KNOT? ( -- f ) PY @ 53 - 0< PX @ 32 - SQ PY @ 47 - SQ - 0< AND ;   \ a small cone under the envelope
: STRING? ( -- f ) 52 PY @ - 0< PX @ PY @ 4 / 1 AND 32 + = AND ;     \ a string that zigzags a pixel every 4 rows
: PIXEL ( -- rgb )
  INSIDE? IF SHINE? IF SHINE @ EXIT THEN RIM? IF DARK @ EXIT THEN BODY @ EXIT THEN
  PY @ 49 - 0< IF 0 EXIT THEN                                  \ beside the envelope: transparent
  KNOT? IF DARK @ EXIT THEN STRING? IF $CCC EXIT THEN 0 ;
: BALLOON ( body dark shine pattern -- ) >R SHINE ! DARK ! BODY !
  0 PY ! BEGIN 0 PX ! BEGIN                            \ every pixel of the 64x64 pattern
    PX @ PY @ PIXEL R@ SPLOT
  PX @ 1+ DUP PX ! 64 = UNTIL PY @ 1+ DUP PY ! 64 = UNTIL R> DROP ;
\ four balloons: body, shade, highlight, pattern
$E33 $922 $FAA 0 BALLOON
$FC2 $A71 $FFB 1 BALLOON
$37F $13A $ADF 2 BALLOON
$4D4 $182 $BFB 3 BALLOON

\ ── 3. the flight, built from motors: no per-frame code of our own ────────────────────────────────
\ Smooth motion on a 320x200 screen means WHOLE pixels on EVERY frame: a balloon moving 3/4 of a
\ pixel a frame would jump 1,1,1,0 and stutter. So every balloon climbs exactly 1 pixel a frame
\ (they all share one RISE cell), and the sway is a table of single-pixel steps spread out like a
\ sine curve, each held for 3 frames: never more than a pixel between two frames.
\ Each balloon gets one velocity cell and four motors wired through RAM:
\    PATH  writes its sway into VX      ADDER  X += VX
\    ADDER  Y += RISE                   LIMITER on Y with WRAP: past the top, back in below
\ A path table is [count] then the values.
: ARRAY ( "name" -- ) CREATE 16 ALLOT DOES> ( n a -- a' ) SWAP 2 * + ;
ARRAY VX
VARIABLE RISE  -1 RISE !
CREATE SWAY 32 ,  0 , 0 , 1 , 0 , 1 , 1 , 1 , 1 , 1 , 1 , 0 , 1 , 0 , 0 , 0 , 0 ,
               0 , 0 , -1 , 0 , -1 , -1 , -1 , -1 , -1 , -1 , 0 , -1 , 0 , 0 , 0 , 0 ,
: X-REG ( n -- a ) SPRITE ;  : Y-REG ( n -- a ) SPRITE 2 + ;
: FLIGHT ( n -- )
  DUP VX SWAY 3 PATH  OVER 4 * 31 AND SWAP >C !              \ sway, each balloon at its own phase
  DUP X-REG OVER VX ADDER DROP
  DUP Y-REG RISE ADDER DROP                                   \ climb
  DUP Y-REG -64 200 0 LIMITER WRAPS
  DUP 37 * 255 AND 20 + OVER X-REG !  DUP 33 * 200 SWAP - OVER Y-REG !   \ start: spread out, low
  DUP 3 AND SWAP SHOW ;
: LAUNCH ( -- ) 8 BEGIN 1- DUP FLIGHT DUP 0= UNTIL DROP ;

\ ── 4. a timer: every 4 seconds all balloons change colour ────────────────────────────────────────
\ A CODER motor that pauses itself as soon as it has run. Its timer flips RUN every 240 frames
\ (toggle F-RUN, reload 240), so it wakes, recolours, and sleeps again: no IF in sight.
: RECOLOUR ( m -- ) PAUSE 8 BEGIN 1- DUP SPRITE 4 + DUP @ 1+ 3 AND SWAP ! DUP 0= UNTIL DROP ;
' RECOLOUR CODER  DUP PAUSE  >R 240 F-RUN 240 R> TIMER

\ ── 5. go ─────────────────────────────────────────────────────────────────────────────────────────
LAUNCH
\ ( the motors now run on every frame. Try  3 HIDE  or  ' NOOP IS VBL  to stop them all )
</script>

<script type="text/forth" id="demo-steer">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  STEER: click the screen, then fly the ball with the arrow keys.
\  Three motors, run in the order they were made, every frame:
\    1. a CODER reads the held arrows (KEY-DOWN? reads the keyboard chip) and moves X and Y
\    2. two LIMITERs keep X and Y on the screen
\    3. a CODER puts sprite 0 at X,Y — after the limits, so it is never seen off the edge
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
CLS
VARIABLE X  144 X !   VARIABLE Y  84 Y !         \ where the ball is: the top left of its 32x32
VARIABLE PX  VARIABLE PY                          \ the pixel BALL is painting
: BALL ( -- ) 0 PY ! BEGIN 0 PX ! BEGIN           \ pattern 0: every pixel within 12 of (16,16)
    PX @ 16 - DUP * PY @ 16 - DUP * + 145 < IF PX @ PY @ $F80 0 SPLOT THEN
    PX @ 1+ DUP PX ! 32 = UNTIL PY @ 1+ DUP PY ! 32 = UNTIL ;
BALL  0 0 SHOW
: ARROWS ( m -- ) DROP                            \ 2 pixels a frame while an arrow is held
  28 KEY-DOWN? IF -2 X +! THEN  29 KEY-DOWN? IF 2 X +! THEN
  30 KEY-DOWN? IF -2 Y +! THEN  31 KEY-DOWN? IF 2 Y +! THEN ;
: PLACE ( m -- ) DROP X @ Y @ 0 SPRITE-AT ;
' ARROWS CODER DROP
X 0 288 0 LIMITER DROP   Y 0 168 0 LIMITER DROP
' PLACE CODER DROP
.( click the screen, then use the arrow keys) CR
</script>

<script type="text/forth" id="demo-logo">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  LOGO: a turtle with a pen, drawing with LINE on the 320x200 screen.
\  It keeps its place in 1/16 pixels, so many small turns never add up to a drift, and its
\  heading in degrees, clockwise from straight up. SIN comes from a table of sin 0-90° x 128.
\  It draws SPEED strokes, then WAITs for the next frame, so you watch it draw ( 0 SPEED ! draws
\  at once ). Sprite 0 is the turtle.
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
CREATE SINES   0 , 2 , 4 , 7 , 9 , 11 , 13 , 16 , 18 , 20 , 22 , 24 , 27 , 29 , 31 , 33 , 35 , 37 ,
  40 , 42 , 44 , 46 , 48 , 50 , 52 , 54 , 56 , 58 , 60 , 62 , 64 , 66 , 68 , 70 , 72 , 73 , 75 ,
  77 , 79 , 81 , 82 , 84 , 86 , 87 , 89 , 91 , 92 , 94 , 95 , 97 , 98 , 99 , 101 , 102 , 104 ,
  105 , 106 , 107 , 109 , 110 , 111 , 112 , 113 , 114 , 115 , 116 , 117 , 118 , 119 , 119 , 120 ,
  121 , 122 , 122 , 123 , 124 , 124 , 125 , 125 , 126 , 126 , 126 , 127 , 127 , 127 , 128 , 128 ,
  128 , 128 , 128 , 128 ,
: SIN ( deg -- n ) 360 MOD DUP 0< IF 360 + THEN          \ sine x 128, of any angle
  DUP 180 < IF 1 ELSE 180 - -1 THEN SWAP                 \ 180-359°: minus the sine of angle-180
  DUP 90 > IF 180 SWAP - THEN DUP + SINES + @ * ;        \ 91-179°: the same as 180-angle
: COS ( deg -- n ) 90 + SIN ;

\ ── the turtle ────────────────────────────────────────────────────────────────────────────────────
\ Where the turtle is, where it looks, and how it moves and draws.
VARIABLE TX  VARIABLE TY  VARIABLE HEADING               \ where it is ( 1/16 pixels ), where it looks
VARIABLE PEN  VARIABLE INK  VARIABLE SPEED  VARIABLE DRAWN
: TURTLE ( -- ) TX @ 16 / 3 - TY @ 16 / 3 - 0 SPRITE-AT ;   \ move sprite 0 onto it
: PACE ( -- ) SPEED @ IF 1 DRAWN +! DRAWN @ SPEED @ < 0= IF 0 DRAWN ! TURTLE WAIT THEN THEN ;
: HOME ( -- ) 2560 TX ! 1600 TY ! 0 HEADING ! ;         \ the middle, looking up
: MOVETO ( x y -- ) 16 * TY ! 16 * TX ! ;
: PENUP ( -- ) 0 PEN ! ;   : PENDOWN ( -- ) -1 PEN ! ;
: RIGHT ( deg -- ) HEADING +! ;   : LEFT ( deg -- ) NEGATE RIGHT ;
: (FORWARD) ( n -- ) TX @ 16 / TY @ 16 / ROT                \ n <= 100, so n x 128 fits a cell
  DUP HEADING @ SIN * 8 / TX +!  HEADING @ COS * 8 / NEGATE TY +!   \ n pixels = n x sin / 128 x 16
  PEN @ IF TX @ 16 / TY @ 16 / INK @ LINE PACE ELSE 2DROP THEN ;
: FORWARD ( n -- ) BEGIN DUP 0> WHILE DUP 100 MIN DUP (FORWARD) - REPEAT DROP ;
: BACK ( n -- ) 180 RIGHT FORWARD 180 RIGHT ;

\ ── pictures ──────────────────────────────────────────────────────────────────────────────────────
\ Every picture is only FORWARD and RIGHT, repeated.
: POLY ( size sides -- ) 360 OVER / SWAP               \ ( size angle sides )
  BEGIN >R OVER FORWARD DUP RIGHT R> 1- DUP 0= UNTIL   \ a side and a turn, sides times
  DROP 2DROP ;
: CIRCLE ( size -- ) 36 POLY ;                           \ 36 sides are round enough
: FLOWER ( size -- ) 12 BEGIN OVER CIRCLE 30 RIGHT 1- DUP 0= UNTIL 2DROP ;
: SPIRAL ( -- ) 2 BEGIN DUP FORWARD 89 RIGHT 3 + DUP 108 > UNTIL DROP ;
: STAR ( size -- ) 5 BEGIN OVER FORWARD 144 RIGHT 1- DUP 0= UNTIL 2DROP ;

: SHELL ( -- ) 49 BEGIN 1- DUP 7 MOD OVER 7 / $0F0 7 SPLOT DUP 0= UNTIL DROP ;   \ the turtle: a green 7x7
CLS SHELL 7 0 SHOW
HOME 3 SPEED !
$F80 INK !  PENUP 80 100 MOVETO PENDOWN  4 FLOWER
$0CF INK !  PENUP 230 100 MOVETO 0 HEADING ! PENDOWN  SPIRAL
$FF0 INK !  PENUP 150 185 MOVETO 0 HEADING ! PENDOWN  36 STAR
TURTLE .( a flower, a spiral and a star) CR
</script>

<script type="text/forth" id="demo-clock">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  CLOCK: the clock chip shown as LED digits, drawn with LINE. Three motors keep time:
\    EVERY 30 frames it redraws the digits; LATER, once, after 10 seconds; an ALARM at the next
\    whole minute. The program ends at once: from then on only the motors work, in the VBL.
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\ Seven segments per digit, a b c d e f g = bits 1 2 4 8 16 32 64; each is a line between two
\ corners of a 1 x 2 grid ( x y x y ). A dark segment is drawn dim, so a digit erases the last one.
CREATE SEGS 63 C, 6 C, 91 C, 79 C, 102 C, 109 C, 125 C, 7 C, 127 C, 111 C,     \ 0-9
CREATE SEGMENTS 0 C, 0 C, 1 C, 0 C,   1 C, 0 C, 1 C, 1 C,   1 C, 1 C, 1 C, 2 C,   0 C, 2 C, 1 C, 2 C,
                0 C, 1 C, 0 C, 2 C,   0 C, 0 C, 0 C, 1 C,   0 C, 1 C, 1 C, 1 C,
VARIABLE OX  VARIABLE OY  VARIABLE LIT  VARIABLE SEG#
: CORNER ( a -- x y ) DUP C@ 20 * OX @ + SWAP 1+ C@ 24 * OY @ + ;   \ a grid corner, on the screen
: DIGIT ( n x y -- ) OY ! OX ! SEGS + C@ LIT !  0 SEG# !  BEGIN
    SEG# @ 4 * SEGMENTS + DUP CORNER ROT 2 + CORNER
    LIT @ 1 AND IF $F42 ELSE $300 THEN LINE            \ lit, or dim: an LED
    LIT @ 2 / LIT !  SEG# @ 1+ DUP SEG# ! 7 = UNTIL ;
: TWO ( n x -- ) >R DUP 10 / R@ 76 DIGIT 10 MOD R> 28 + 76 DIGIT ;   \ two digits at x
: DOTS ( x -- ) DUP 90 $F42 PLOT DUP 110 $F42 PLOT DUP 1+ 90 $F42 PLOT 1+ 110 $F42 PLOT ;
: SHOW-TIME ( m -- ) DROP TIME&DATE DROP DROP DROP 52 TWO 136 TWO 220 TWO ;   \ hh mm ss
: NEXT-MINUTE ( -- h m s ) NOW NIP 1+ 1440 MOD DUP 60 / SWAP 60 MOD 0 ;
: RING ( m -- ) DROP ." alarm: a new minute" CR ;
: TEN ( m -- ) DROP ." later: ten seconds went by" CR ;

CLS 116 DOTS 200 DOTS  0 SHOW-TIME
' SHOW-TIME 30 EVERY DROP
' TEN 600 LATER DROP
' RING NEXT-MINUTE ALARM DROP
.( the time, with an alarm at the next minute) CR
</script>

<script type="text/forth" id="demo-paint">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  PAINT: draw on the screen with the mouse, or with up to four fingers at once, each its own
\  colour. One CODER motor, every frame: for each point that is pressed, a LINE from where it was
\  to where it is now, so fast strokes stay whole. Hold C to clear the screen.
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
CREATE COLOURS $F80 , $0F0 , $0CF , $F4F ,              \ point 0 ( the mouse ) orange, then green, blue, pink
CREATE LASTS 16 ALLOT                                    \ each point's last x y; x = -1: lifted
: LAST ( n -- a ) 4 * LASTS + ;
: STROKE ( n -- ) >R
  R@ PRESSED? IF
    R@ LAST @ 0< IF R@ POINTER R@ LAST 2 + ! R@ LAST ! THEN            \ a new stroke starts right here
    R@ LAST @ R@ LAST 2 + @  R@ POINTER  2DUP R@ LAST 2 + ! R@ LAST !  \ ( from to ), and remember to
    R@ 2 * COLOURS + @ LINE
  ELSE -1 R@ LAST ! THEN R> DROP ;
: PAINT ( m -- ) DROP 0 STROKE 1 STROKE 2 STROKE 3 STROKE  67 KEY-DOWN? IF CLS THEN ;
: LIFT ( -- ) 4 BEGIN 1- -1 OVER LAST ! DUP 0= UNTIL DROP ;

CLS LIFT ' PAINT CODER DROP
.( paint with the mouse, or up to four fingers; hold C to clear) CR
</script>

<script type="text/forth" id="demo-piano">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  PIANO: click the screen; the keyboard is a piano and a motor is the player.
\    A W S E D F T G Y H U J K  play C to C on voice 0, a square wave, while you hold them
\    SPACE  a drum: a sample built in RAM, played on voice 1
\    L      a hi-hat: noise on voice 2, switched off 4 frames later by a LATER motor
\  A sprite shows the key you hold.
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
CREATE KEYMAP 65 C, 87 C, 83 C, 69 C, 68 C, 70 C, 84 C, 71 C, 89 C, 72 C, 85 C, 74 C, 75 C,
CREATE PITCH 262 , 277 , 294 , 311 , 330 , 349 , 370 , 392 , 415 , 440 , 466 , 494 , 523 ,
: HELD-NOTE ( -- n | -1 ) -1 13 BEGIN 1-               \ ( found i ): keys 12 … 0
    DUP KEYMAP + C@ KEY-DOWN? IF NIP DUP THEN          \ held: this one ( the lowest wins )
  DUP 0= UNTIL DROP ;

\ the drum: 2000 bytes at 8000 a second, a square wave that falls in pitch as it fades out
CREATE DRUM 2000 ALLOT
VARIABLE HALF  VARIABLE PHASE  VARIABLE SIGN
: KICK ( -- ) 20 HALF ! 0 PHASE ! 1 SIGN !  0 BEGIN
    2000 OVER - 16 / SIGN @ * 128 + OVER DRUM + C!          \ loudness falls from 125 to 0
    1 PHASE +! PHASE @ HALF @ = IF 0 PHASE ! SIGN @ NEGATE SIGN ! 1 HALF +! THEN   \ each half wave longer
  1+ DUP 2000 = UNTIL DROP ;

\ the keys on screen, and a sprite over the one held
: KEYLINE ( i -- ) 20 * 30 + DUP 80 SWAP 150 $888 LINE ;            \ the left edge of key i
: KEYBOARD ( -- ) 13 BEGIN 1- DUP KEYLINE DUP 0= UNTIL DROP
  30 80 290 80 $888 LINE  30 150 290 150 $888 LINE  290 80 290 150 $888 LINE ;
: SHARP ( i -- ) 20 * 35 + 11 BEGIN 1- 2DUP + DUP 81 SWAP 118 $444 LINE DUP 0= UNTIL 2DROP ;   \ a dark key
: DOT ( -- ) 64 BEGIN 1- DUP 8 MOD OVER 8 / $F80 0 SPLOT DUP 0= UNTIL DROP ;

VARIABLE SPACE-WAS  VARIABLE L-WAS
: OFF ( m -- ) DROP 2 QUIET ;
: EDGE ( down var -- f ) DUP @ >R ! R> 0= ;               \ true only in the frame the key goes down
: PLAYER ( m -- ) DROP HELD-NOTE DUP 0< IF DROP 0 QUIET 0 HIDE ELSE
    DUP 2 * PITCH + @ 10 SQUARE 0 TONE  20 * 36 + 160 0 SPRITE-AT 0 0 SHOW THEN
  32 KEY-DOWN? DUP SPACE-WAS EDGE AND IF DRUM 2000 8000 15 1 PLAY THEN
  76 KEY-DOWN? DUP L-WAS EDGE AND IF 8000 6 NOISE 2 TONE ['] OFF 4 LATER DROP THEN ;

CLS KICK KEYBOARD 1 SHARP 3 SHARP 6 SHARP 8 SHARP 10 SHARP DOT ' PLAYER CODER DROP
.( click the screen: A W S E D F T G Y H U J K play, SPACE drum, L hi-hat) CR
</script>

<script type="text/forth" id="demo-tour">
\ ══════════════════════════════════════════════════════════════════════════════════════════════════
\  A TOUR of the language: DEFER, colon words, defining words, KEY, the dictionary, SEE,
\  nested definitions, strings, number bases and CASE. Text only: see the balloons for graphics.
\ ══════════════════════════════════════════════════════════════════════════════════════════════════

\ deferred words
DEFER GREET
: SAY-HI ( -- ) 100 . ;  : SAY-HELLO ( -- ) 200 . ;
' SAY-HI IS GREET  GREET CR
' SAY-HELLO IS GREET  GREET CR
: USE-HI ( -- ) ['] SAY-HI IS GREET ;  : TWICE ( -- ) GREET GREET ;
USE-HI TWICE CR

\ colon words, IF, CONSTANT, VARIABLE, loops
: SQUARE ( n -- n*n ) DUP * ;  6 SQUARE . CR
: ABS ( n -- u ) DUP 0 < IF NEGATE THEN ;  -9 ABS . CR
42 CONSTANT ANSWER  ANSWER . CR
VARIABLE COUNTER  5 COUNTER ! COUNTER @ . CR
: CD ( n -- ) BEGIN DUP . 1 - DUP 0 = UNTIL DROP ;  3 CD CR

\ a defining word of our own
: DOUBLED ( n "name" -- ) CREATE , DOES> @ 2 * ;
21 DOUBLED X  X . CR

\ KEY, and looking inside the dictionary
S" hello, forth" KEYS                              \ the keyboard's ring is RAM: this types into it
: ECHO ( -- ) BEGIN KEY? WHILE KEY EMIT REPEAT ;  ECHO CR   \ KEY waits for a key; KEY? only asks
: FN ( "name" -- xt ) 32 WORD COUNT FIND-NAME ;
3 FN square EXECUTE . CR
FN SQUARE >CFA C@ .  FN ANSWER >CFA C@ . CR
' COUNTER >BODY @ . CR
SEE SQUARE
SEE CONSTANT
SEE ANSWER
SEE FIND-NAME

\ nested definitions: INNER is laid down inside OUTER, and OUTER jumps over it
: OUTER ( -- ) 1 .  : INNER ( -- ) 2 . ;  3 . ;
OUTER INNER CR
SEE OUTER

\ strings, number bases, CASE
: GREET ( a n -- ) ." Hello, " TYPE ." !" CR ;
S" Forth" GREET
255 HEX . DECIMAL  HEX 7FFF DECIMAL . CR
: DAY ( n -- ) CASE 1 OF ." Mon" ENDOF 2 OF ." Tue" ENDOF ." ?" ENDCASE ;
1 DAY 2 DAY 7 DAY CR
SEE GREET
WORDS
</script>

<script type="text/forth" id="demo-cut">
\ ═══ CUT THE CORD: build this system in a second machine, then set it free ═══════════════════
\ The target is a second ITCH in a Web Worker: headless, its primitives and a ROM monitor, nothing more.
\ TARGET makes this machine build there. The long middle of this program is BOOT, NUMBERS, TOOLS,
\ META and SERIAL: their own text ( the page copied it in ), read in target mode and compiled into the
\ target byte for byte as that machine would build it by itself. It takes a while: every word it must
\ run there is a round trip down the cord, a frame each.
\ Then CUT: the monitor enters SERVE, the target's own QUIT on its UART, and TERM makes this machine
\ its terminal. Type at the prompt: your lines go down the cord. ESC on the screen ends TERM ( TERM
\ starts it again ); then TETHER takes the cord back, and the words you typed to it are ours to use.
TARGET
\ include: forth-boot forth-numbers forth-tools forth-meta forth-serial
HOST CUT
CR .( the cord is cut: type to the target ) CR
TERM
</script>

<!-- ═══ 3 · TERMINAL: a log, a prompt and a monitor; it only shows the machine ════════════════ -->
<script id="terminal-ui">
"use strict";
// ── the terminal: a log, a prompt and a monitor ──────────────────────────────────────────────────
//   It shows the machine; it doesn't look inside it (for that, ask Forth: .S  SEE  WORDS).
//   One loop, tick(), once per displayed frame at 60 Hz: the chip's VBL interrupt, a slice of CPU
//   time for a running program, then the picture.
const $ = id => document.getElementById(id), BANNER = "ITCH 64K FORTH READY\n";
const BOOT = ["forth-boot", "forth-numbers", "forth-tools", "forth-graphics", "forth-motors", "forth-time", "forth-sound", "forth-meta", "forth-serial", "forth-tether"];   // loaded in order; drop one to leave it out
const bootSrc = BOOT.map(id => $(id).textContent).join("\n");
let log = BANNER, task = "", queue = [], dirty = true;   // task: "run" or "line" while a program runs; queue: lines typed meanwhile

function terminal() {                                  // the terminal chip's ring → the log ( every frame, and on a WAIT )
  const n = ttyTake();
  if (n) {
    const s = String.fromCharCode(...OUT_BUF.subarray(0, n)), ff = s.lastIndexOf("\f");   // a form feed ( 12, PAGE ):
    log = ff < 0 ? log + s : s.slice(ff + 1); dirty = true;                                   //  a clean screen from there on
  }
  return n > 0;
}
ON_FRAME.push(terminal);                               // a word run to its end ( VBL ) that fills the ring gets a frame
function say(text) {                                   // the machine's output so far, then ours
  terminal(); log += text; dirty = true;
  while (log.includes("\b")) log = log.replace(/[^\n]?\x08/, "");   // a backspace (8) rubs out the character before it
}
function show() { if (log.length > 40000) log = log.slice(-30000); $("terminal").textContent = log; $("terminal").scrollTop = 1e9; dirty = false; }

// ── the cord: a target ITCH in a Web Worker, wired to our UART ───────────────────────────────────
//   The Worker is made from this file's own blocks ( still one file ): the kernel, the UART and the
