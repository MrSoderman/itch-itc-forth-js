//   monitor ROM, then power on. It starts the first time we send it a byte. Once a frame, wire()
//   moves our TX bytes to it and puts what it sent back into our RX, as much as fits.
const TARGET_SRC = ["vm-kernel", "terminal-chip", "uart-chip", "target-monitor"].map(id => $(id).textContent).join("\n") +
  "\npowerOn(); const NONE = new Uint8Array(0), beat = b => { const r = targetTick(b); if (r.length) postMessage(r); };" +
  "onmessage = e => beat(e.data); setInterval(() => beat(NONE), 16);";   // its own 60 Hz ( postMessage copies r )
let target = null;                                      // the Worker
const WIRE = new Uint8Array(4096); let wireN = 0;       // its bytes that did not fit RX yet: 4K, a modem's ( more: lost, an overrun )
function wire() {
  const n = uartTake(), b = TX_BUF.subarray(0, n);       // ( postMessage copies it )
  if (n) {
    if (!target) {
      target = new Worker(URL.createObjectURL(new Blob([TARGET_SRC], { type: "text/javascript" })));
      target.onmessage = e => { const n = Math.min(e.data.length, WIRE.length - wireN); WIRE.set(e.data.subarray(0, n), wireN); wireN += n; };
    }
    target.postMessage(b);
  }
  if (wireN) { const k = uartGive(WIRE.subarray(0, wireN)); WIRE.copyWithin(0, k, wireN); wireN -= k; }
}
function unplug() { if (target) target.terminate(); target = null; wireN = 0; }   // RUN: a fresh target too

// ── programs: start one; tick() gives it CPU time until it ends ──────────────────────────────────
function busy(on) { document.body.dataset.state = on ? "running" : "idle"; }
//   A program longer than the text area ( 28K ) runs in parts, whole lines each, one after the other;
//   what a part leaves ( stacks, an open definition ) the next one finds, as with lines typed at the prompt.
let parts = [];                                          // the parts still to run: [text, its first line number]
function split(text) {
  const room = ROM - TEXT, r = [];
  for (let i = 0, line = 0; i < text.length; ) {
    let j = Math.min(text.length, i + room);
    if (j < text.length && text.lastIndexOf("\n", j - 1) >= i) j = text.lastIndexOf("\n", j - 1) + 1;   // whole lines
    const t = text.slice(i, j); r.push([t, line]); line += t.split("\n").length - 1; i = j;
  }
  return r;
}
function start(text, kind) { parts = split(text); next(kind); }
function next(kind) {
  const [text, line] = parts.shift() || ["", 0];
  try { startSource(text, line); task = kind; busy(true); } catch (e) { parts = []; say(`? ${e.message}\n`); }
}
function done(error) {
  if (!error && parts.length) { next(task); return; }    // the next part of a long program
  parts = [];
  terminal();
  say(error ? (log.endsWith("\n") ? "" : "\n") + `? ${error}\n` : task === "run" ? "\nok\n" : " ok\n");
  task = ""; busy(false);
}

// ── one frame, 60 times a second ─────────────────────────────────────────────────────────────────
//   requestAnimationFrame follows the display (no timer); on a 120 or 144 Hz display some frames
//   are skipped, so the machine sees exactly 60 a second. A running program gets CPU_MS of each.
const FRAME_MS = 1000 / 60, CPU_MS = 8;
const ctx = $("display").getContext("2d"), img = ctx.createImageData(W, H);
let last = -1e9;

function tick(t) {
  requestAnimationFrame(tick);
  if (t - last < FRAME_MS - 2) return;
  last = Math.max(last + FRAME_MS, t - FRAME_MS);
  clockSet(new Date());                                  // the clock chip follows the computer's clock
  try { vbl(); } catch (e) { say(`? ${e.message}\n`); }
  sound(soundFrame());                                   // the sound chip's registers, as they are after VBL
  wire();                                                // the cord: bytes both ways
  wake();                                                // the frame interrupt wakes a CPU that sleeps in WAIT
  if (task) {
    const end = performance.now() + CPU_MS;
    try { let more; do { more = resume(4000, false); if (sleeping() && terminal()) wake(); }   // a full ring: empty it, go on
          while (more && !sleeping() && performance.now() < end); if (!more) done(""); }
    catch (e) { done(e.message); }
  } else if (queue.length) start(queue.shift(), "line");
  wire();                                                // send what this slice wrote at once: a reply is here next frame
  terminal();
  if (dirty) show();
  compose(img.data); ctx.putImageData(img, 0, 0);        // the GPU scales it; CSS draws the scanlines
}

// ── the loudspeaker: the sound chip's voices as Web Audio ────────────────────────────────────────
//   A browser starts sound only after a click or a key, so the first one switches it on.
const WAVES = [null, "square", "sawtooth", "triangle", "sine", "noise"];
let audio = null, master, speakers = [];                 // per voice: { gain, source, wave }
function soundOn() {
  if (audio) { if (audio.state === "suspended") audio.resume(); return; }
  audio = new AudioContext(); master = audio.createGain(); master.gain.value = 0.15; master.connect(audio.destination);
  const noise = audio.createBuffer(1, audio.sampleRate, audio.sampleRate), d = noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  speakers = [0, 1, 2, 3].map(() => { const gain = audio.createGain(); gain.gain.value = 0; gain.connect(master); return { gain, source: null, wave: 0, noise }; });
}
function sound(frame) {
  if (!audio) return;
  const t = audio.currentTime;
  frame.voices.forEach((v, n) => {
    const s = speakers[n];
    if (v.wave !== s.wave) {                             // a new wave: a new source
      if (s.source) s.source.stop(); s.source = null; s.wave = v.wave;
      if (v.wave === 5) { s.source = audio.createBufferSource(); s.source.buffer = s.noise; s.source.loop = true; }
      else if (WAVES[v.wave]) { s.source = audio.createOscillator(); s.source.type = WAVES[v.wave]; }
      if (s.source) { s.source.connect(s.gain); s.source.start(); }
    }
    if (s.source && s.source.frequency) s.source.frequency.setTargetAtTime(Math.max(1, v.freq), t, 0.004);
    if (s.source && v.wave === 5) s.source.playbackRate.setTargetAtTime(Math.max(0.05, v.freq / 8000), t, 0.004);
    s.gain.gain.setTargetAtTime(s.source ? v.vol / 15 : 0, t, 0.004);   // a short glide: no clicks
  });
  frame.samples.forEach(p => {                           // 8-bit unsigned bytes → a buffer, played once
    if (!p.bytes.length) return;
    const b = audio.createBuffer(1, p.bytes.length, Math.min(96000, Math.max(3000, p.rate))), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (p.bytes[i] - 128) / 128;
    const src = audio.createBufferSource(), g = audio.createGain(); g.gain.value = p.vol / 15;
    src.buffer = b; src.connect(g); g.connect(master); src.start();
  });
}
addEventListener("pointerdown", soundOn); addEventListener("keydown", soundOn);

// ── controls: SOURCE/SCREEN, RUN/STOP, the prompt ────────────────────────────────────────────────
// ── one button, two states: SOURCE is stopped ( you edit ), SCREEN is running ( or ran: the prompt ) ──
//   RUN: fresh machines, the program, the screen.  STOP: break it if it still runs, back to the source.
function view(name) { document.body.dataset.view = name; $("run").textContent = name === "screen" ? "STOP" : "RUN"; }
$("run").onclick = () => {
  if (document.body.dataset.view === "screen") { if (task) brk(); view("source"); return; }
  boot(bootSrc); unplug(); log = BANNER; queue = []; dirty = true;
  start($("program").value, "run"); view("screen"); $("prompt").focus({ preventScroll: true });
};
$("prompt").onkeydown = e => {
  if (e.key !== "Enter") return;
  const line = $("prompt").value; $("prompt").value = "";
  if (task && sleeping()) { typeKeys(line + "\r"); return; }   // a program waits for keys (KEY, ACCEPT): the line is typed to it
  say("> " + line + "\n");
  if (task) queue.push(line); else start(line, "line");  // typed while a program runs: it waits its turn
};
// ── the keyboard: while the screen has the focus, keys go to the keyboard chip ───────────────────
$("monitor").onkeydown = e => {
  const c = keyCode(e.key);
  if (!c || e.ctrlKey || e.metaKey || e.altKey) return;  // not a key the chip has, or a browser shortcut
  e.preventDefault();                                    // arrows and space must not scroll the page
  keyIn(c); keyHeld(c, true);
};
$("monitor").onkeyup = e => keyHeld(keyCode(e.key), false);
$("monitor").onblur = keysUp;                            // no key stays held when the focus leaves
// ── the pointer: the mouse and fingers on the screen go to the pointer chip ──────────────────────
const fingers = new Map();                               // a finger's pointerId → its point, 0-3 (the mouse is 0)
function pointOf(e, down) {
  if (e.pointerType === "mouse") return 0;
  if (fingers.has(e.pointerId)) return fingers.get(e.pointerId);
  if (!down) return -1;
  const taken = [...fingers.values()];
  for (let n = 0; n < 4; n++) if (!taken.includes(n)) { fingers.set(e.pointerId, n); return n; }
  return -1;                                             // a fifth finger: ignored
}
function pointer(e, down) {
  const n = pointOf(e, down); if (n < 0) return;
  const r = $("monitor").getBoundingClientRect();        // page pixels → screen pixels
  pointerSet(n, Math.floor((e.clientX - r.left) * W / r.width), Math.floor((e.clientY - r.top) * H / r.height), down);
  if (!down && e.pointerType !== "mouse") fingers.delete(e.pointerId);
}

  $("monitor").focus({ preventScroll: true });

};

// A demo line  \ include: id id …  is replaced by those blocks' own text when the demo is loaded.
const expand = text => text.replace(/^\\ include: (.*)$/gm, (line, ids) => ids.trim().split(/\s+/).map(id => $(id).textContent).join("\n"));

// ── the cursor: CURSOR picks the browser's own caret ( "ORG" ) or a solid retro block ( "SQUARE" ) ──────
//   The block sits where the caret is: the prompt's font is monospaced, so that is its padding plus one
//   character width per character before the caret, less how far the text has scrolled.
let CURSOR = "ORG";                                      // "ORG" or "SQUARE"
let charWidth = 0;
function cursor() {
  document.body.dataset.cursor = CURSOR;
  if (CURSOR !== "SQUARE") return;

  c.style.left = (8 + charWidth * p.selectionStart - p.scrollLeft) + "px";

}
for (const ev of ["input", "keyup", "click", "focus", "select"]) $("prompt").addEventListener(ev, cursor);

$("demo").onchange(); boot(bootSrc); view("source"); cursor(); show(); requestAnimationFrame(tick);
