<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>ITCH Forth Base</title>
<style>
  body { font: 14px monospace; background: #111; color: #0ff; padding: 16px; margin: 0; }
  /* one column, exactly as wide as the screen ( the host sets --w ) */
  #machine { width: var(--w, 642px); max-width: 100%; }
  #tabs { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .tab { padding: 2px 10px; }  .tab.on { background: #0ff; color: #000; }
  #meter { font-size: 11px; color: #088; margin-left: auto; white-space: nowrap; overflow: hidden; }
  .bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
  .bar > * { width: 100%; height: 34px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; }
  @media (max-width: 520px) { .bar > *, .tab { letter-spacing: 0; font-size: 12px; padding: 0 4px; } #meter { display: none; } }
  /* retro keys: a frame and a hard shadow that presses in */
  button, .btn, select { box-sizing: border-box; font: inherit; text-transform: uppercase; letter-spacing: 1px; margin: 0;
    background: #000; color: #0ff; border: 2px solid #0ff; box-shadow: 3px 3px 0 #077; padding: 4px 6px; cursor: pointer; }
  button:hover, .btn:hover, select:hover { background: #0ff; color: #000; }
  button:active, .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #077; }
  /* the monitor: sized by the host to a whole multiple of 320x200 in device pixels ( see fit ); nothing of
     the browser on it: no selection, callout, highlight or scrolling */
  #monitor { position: relative; line-height: 0; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: contain; }
  #scr { display: block; border: 1px solid #0ff; image-rendering: pixelated; outline: 0; touch-action: none; -webkit-user-drag: none; }
  #scr:focus { border-color: #ff0; }                  /* yellow: the keys go to the game */
  /* the log: plain web text over the screen, in every language; it can be selected and copied */
  #log { position: absolute; inset: 0; margin: 0; padding: 8px 10px; overflow-y: auto; box-sizing: border-box; border: 1px solid #0ff;
    background: #000; color: #cfe; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
    user-select: text; -webkit-user-select: text; touch-action: pan-y; }
  #src { width: 100%; box-sizing: border-box; height: 30vh; min-height: 4em; resize: vertical; padding: 8px;
    background: #000; color: #0ff; border: 1px solid #0ff; white-space: pre-wrap; overflow-x: hidden; }
  #kbd { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px; resize: none; }
</style>
</head>

// ITCH kernel: indirect-threaded Forth for a 6502/x64 style machine. 32 primitives, one runtime (DOCOL).
const DP = 0, LATEST = 2, TOIN = 4, NTIB = 6, BASE = 8, SRC = 10,
  ME = 14, TASK0 = 0x0100;
const S0 = 0x0300, R0 = 0x0400;
const DICT = 0x0500;
const WBUF = 0x0400, TIB = 0x7800;
const DOCOL = 0,
  EXIT = 1, LIT = 2, BRANCH = 3, ZBRANCH = 4, EXECUTE = 5,
  DUP = 6, DROP = 7, SWAP = 8, OVER = 9, TOR = 10, RFROM = 11,
  RPFETCH = 12, RPSTORE = 13, SPFETCH = 14, SPSTORE = 15,
  PLUS = 16, MINUS = 17, STAR = 18, DIVMOD = 19, LESS = 20,
  AND = 21, OR = 22,
  FETCH = 23, STORE = 24, CFETCH = 25, CSTORE = 26,
  EMIT = 27, SLEEP = 28,
  WORD = 29, BACKSLASH = 30, FIND = 31, NUMBER = 32;
const NAMES = "EXIT LIT BRANCH 0BRANCH EXECUTE DUP DROP SWAP OVER >R R> RP@ RP! SP@ SP! " +
  "+ - * U/MOD < AND OR @ ! C@ C! EMIT SLEEP WORD \\ FIND NUMBER";
let m, IP, W, SP, RP;
let xtLIT, xtEXIT;
let out;
let slp = 0;
let emit = c => { out = c === 8 ? out.slice(0, -1) : c === 12 ? '' : out + String.fromCharCode(c); };
const utf8in = new TextEncoder();
function load(s) {
  const b = utf8in.encode(s);
  if (b.length > 0xD000 - TIB) throw new Error('block too big: ' + b.length + ' bytes');
  m.set(b, TIB); wr(SRC, TIB); wr(NTIB, b.length); wr(TOIN, 0);
}
const rd = a => m[a & 0xFFFF] | m[(a + 1) & 0xFFFF] << 8;
const wr = (a, v) => { m[a & 0xFFFF] = v; m[(a + 1) & 0xFFFF] = v >> 8; };
const s16 = v => v << 16 >> 16;
const floor = () => 2 * rd(rd(ME) + 6) - rd(rd(ME) + 8);
const push = v => { if (SP === floor()) abort(WBUF, ' stack full'); SP -= 2; wr(SP, v); };
const pop = () => { if (SP === rd(rd(ME) + 6)) abort(WBUF); SP += 2; return rd(SP - 2); };
const rpush = v => { if (RP === rd(rd(ME) + 6)) abort(WBUF, ' return stack full'); RP -= 2; wr(RP, v); };
const rpop = () => { RP += 2; return rd(RP - 2); };
const comma = v => { wr(rd(DP), v); wr(DP, rd(DP) + 2); };
function abort(a, why = ' ?') {
  for (let i = 1; i <= m[a]; i++) emit(m[a + i]);
  for (const c of why) emit(c.charCodeAt(0));
  SP = rd(rd(ME) + 6); RP = rd(rd(ME) + 8); throw 0;
}
const cfa = h => h + 3 + (m[h + 2] & 31);
function header(a) {
  const h = rd(DP), n = Math.min(m[a], 31);
  comma(rd(LATEST)); m[h + 2] = n;
  for (let i = 0; i < n; i++) m[h + 3 + i] = m[a + 1 + i];
  wr(DP, h + 3 + n); wr(LATEST, h);
}
function find(a) {
  for (let h = rd(LATEST); h; h = rd(h)) {
    const n = m[h + 2] & 31;
    if (n !== m[a]) continue;
    let i = 0; while (i < n && m[h + 3 + i] === m[a + 1 + i]) i++;
    if (i === n) return h;
  }
  return 0;
}
const delim = (c, d) => d === 32 ? c <= 32 : c === d;
function word(d) {
  const s = rd(SRC), end = rd(NTIB);
  let i = rd(TOIN), n = 0;
  if (d === 32) while (i < end && delim(m[s + i], d)) i++;
  while (i < end && !delim(m[s + i], d)) { if (n < 255) m[WBUF + 1 + n++] = m[s + i]; i++; }
  m[WBUF] = n;
  wr(TOIN, i < end && delim(m[s + i], d) ? i + 1 : i);

}
function tick() {
  const h = find(word(32)); if (!h) abort(WBUF); return cfa(h);
}
function number(a) {
  const neg = m[a + 1] === 45 && m[a] > 1; let v = 0;
  for (let i = neg ? 2 : 1; i <= m[a]; i++) {
    let d = m[a + i] - 48;
    d = d > 16 ? d - 7 : d > 9 ? 99 : d;
    if (d < 0 || d >= rd(BASE)) abort(a);
    v = (v * rd(BASE) + d) & 0xFFFF;
  }
  return neg ? -v & 0xFFFF : v;
}
function step(c) {
  let a, b;
  switch (c) {
    case DOCOL: rpush(IP); IP = W + 2; break;
    case EXIT: IP = rpop(); break;
    case LIT: push(rd(IP)); IP += 2; break;
    case BRANCH: IP = rd(IP); break;
    case ZBRANCH: IP = pop() ? IP + 2 : rd(IP); break;
    case EXECUTE: W = pop(); step(rd(W)); break;
    case DUP: if (SP === rd(rd(ME) + 6)) abort(WBUF); push(rd(SP)); break;
    case DROP: pop(); break;
    case SWAP: a = pop(); b = pop(); push(a); push(b); break;
    case OVER: a = rd(rd(ME) + 6); if (SP === a || SP + 2 === a) abort(WBUF);
    push(rd(SP + 2)); break;
    case TOR: rpush(pop()); break;
    case RFROM: push(rpop()); break;
    case RPFETCH: push(RP); break;
    case RPSTORE: RP = pop(); break;
    case SPFETCH: push(SP); break;
    case SPSTORE: a = pop(); SP = a; break;
    case PLUS: a = pop(); push(pop() + a); break;
    case MINUS: a = pop(); push(pop() - a); break;
    case STAR: a = pop(); push(pop() * a); break;
    case DIVMOD: a = pop(); b = pop(); if (!a) abort(WBUF, ' division by zero');
    push(b % a); push((b - b % a) / a); break;
    case LESS: a = s16(pop()); push(s16(pop()) < a ? -1 : 0); break;
    case AND: push(pop() & pop()); break;
    case OR: push(pop() | pop()); break;
    case FETCH: push(rd(pop())); break;
    case STORE: a = pop(); wr(a, pop()); break;
    case CFETCH: push(m[pop()]); break;
    case CSTORE: a = pop(); m[a] = pop(); break;
    case EMIT: emit(pop()); break;
    case SLEEP: slp = 1; break;
    case WORD: push(word(pop())); break;
    case BACKSLASH: a = rd(TOIN); b = rd(SRC);
    if (m[b + a - 1] !== 10) {
    while (a < rd(NTIB) && m[b + a] !== 10) a++;
    wr(TOIN, a);
    } break;
    case FIND: push(find(pop())); break;
    case NUMBER: push(number(pop())); break;
    default: abort(WBUF, ' is not code');
  }
}
function run(xt) {
  IP = 0; W = xt; step(rd(W));
  while (IP) { W = rd(IP); IP += 2; step(rd(W)); }
}
function start(xt) { IP = 0; W = xt; step(rd(W)); }
function slice(n) {
  slp = 0;
  try { while (n-- && IP && !slp) { W = rd(IP); IP += 2; step(rd(W)); } }
  catch (e) { if (e !== 0) throw e; IP = 0; if (rd(rd(ME) + 4)) start(rd(rd(ME) + 4)); }
}
function interpret() {
  let comp = 0;
  for (;;) {
    const a = word(32); if (!m[a]) return;
    if (m[a] === 1 && m[a + 1] === 58) { header(word(32)); comma(DOCOL); comp = 1; continue; }
    if (m[a] === 1 && m[a + 1] === 59) { comma(xtEXIT); comp = 0; continue; }
    const h = find(a);
    const side = m[h + 2] & 0xC0;
    if (h && (!comp || side === 0x40 || side === 0x80)) run(cfa(h));
    else if (h) comma(cfa(h));
    else if (comp) { comma(xtLIT); comma(number(a)); }
    else push(number(a));
  }
}
function boot() {
  m = new Uint8Array(65536); SP = S0; RP = R0; out = '';
  wr(DP, DICT); wr(BASE, 10); wr(ME, TASK0); wr(TASK0 + 6, S0); wr(TASK0 + 8, R0);
  load(NAMES);
  for (let c = EXIT; c <= NUMBER; c++) {
    header(word(32)); comma(c);
    if (c === BACKSLASH) m[rd(LATEST) + 2] |= 0x80;
    if (c === TOR || c === RFROM || c === RPSTORE) m[rd(LATEST) + 2] |= 0xC0;
  }
  load('LIT EXIT'); xtLIT = tick(); xtEXIT = tick();
}

// VIDEO CHIP: 320x200 bitmap, 4 tile layers, 128 sprites; adds CLS PLOT POINT. A plug-in card.
const VW = 320, VH = 200, MAPS = 0xDA80, LREGS = 0xEA20, ATTRS = 0xEA80, SPRITES = 0xFA20;
const PAL = [0, 0xFFFFFF, 0x880000, 0xAAFFEE, 0xCC44CC, 0x00CC55, 0x0000AA, 0xEEEE77,
  0xDD8855, 0x664400, 0xFF7777, 0x333333, 0x777777, 0xAAFF66, 0x0088FF, 0xBBBBBB]
  .map(c => (0xFF000000 | (c & 255) << 16 | (c >> 8 & 255) << 8 | c >> 16) >>> 0);
const CLS = 40, PLOT = 41, POINT = 42;
const VID = new Uint16Array(VW * VH);
const TILES = new Uint32Array(256 * 64);
const BLANK = new Uint8Array(256);
const DAC = new Uint32Array(4096);
for (let c = 0; c < 4096; c++) DAC[c] = (0xFF000000 | (c & 15) * 17 << 16 | (c >> 4 & 15) * 17 << 8 | (c >> 8 & 15) * 17) >>> 0;
const sheet = new Image();
sheet.onload = () => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.drawImage(sheet, 0, 0); const d = g.getImageData(0, 0, 128, 128).data;
  for (let t = 0; t < 256; t++) for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
